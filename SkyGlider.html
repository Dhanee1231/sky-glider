const save={v:2,total:0,coins:0,races:0,diff:0,color:4,shape:1,pattern:0,trail:0,hat:0,
 ownTrail:[0],ownHat:[0],ownPat:[0,1,2,3,4],ownCol:[],muted:false,tilt:false,world:0,level:0,
 lv:{},maxLv:0,stk:{},boxes:0,dry:0,pending:0,gift:'',streak:0,wins:0,seenDiff:false};

(function load(){
 let d=null;try{d=JSON.parse(localStorage.getItem(KEY)||'null');}catch(e){}
 if(d&&typeof d==='object'){Object.assign(save,d);}
 else{let o=null;try{o=JSON.parse(localStorage.getItem(OLDKEY)||'null');}catch(e){}
  if(o&&typeof o==='object'){ // ---- migrate v1 save
   ['total','races','color','shape','pattern','muted','tilt','wins'].forEach(k=>{if(o[k]!=null)save[k]=o[k];});
   const n=Math.min(24,o.stickers|0);for(let i=0;i<n;i++)save.stk['s'+i]=1;
   const map={0:0,1:3,2:12},best=o.best||{};
   for(const w in best){const idx=map[w];if(idx!=null){save.lv[idx]=best[w]===1?3:best[w]<=3?2:1;save.maxLv=Math.max(save.maxLv,idx+1);}}
   if(save.races>0)save.maxLv=Math.max(save.maxLv,1);

   [[6,30],[7,80],[8,150],[9,250]].forEach(([i,need])=>{if((save.total||0)>=need)save.ownCol.push(i);});
   save.coins=30+Math.floor((save.total||0)/10);save.boxes=n;save.migrated=1;
   persist();
  }}
 // sanitize
 const num=(v,a,b,def)=>{v=+v;return isFinite(v)?Math.min(b,Math.max(a,Math.round(v))):def;};
 save.diff=num(save.diff,0,2,0);save.color=num(save.color,0,9,4);save.shape=num(save.shape,0,2,1);
 save.pattern=num(save.pattern,0,8,0);save.trail=num(save.trail,0,5,0);save.hat=num(save.hat,0,7,0);
 save.coins=num(save.coins,0,1e6,0);save.total=num(save.total,0,1e7,0);save.maxLv=num(save.maxLv,0,14,0);
 save.world=num(save.world,0,4,0);save.level=num(save.level,0,2,0);save.pending=num(save.pending,0,20,0);
 for(const k of['ownTrail','ownHat','ownPat','ownCol'])if(!Array.isArray(save[k]))save[k]=[];
 if(!save.ownTrail.includes(0))save.ownTrail.push(0);if(!save.ownHat.includes(0))save.ownHat.push(0);
 for(let i=0;i<5;i++)if(!save.ownPat.includes(i))save.ownPat.push(i);
 if(!save.ownPat.includes(save.pattern))save.pattern=0;if(!save.ownHat.includes(save.hat))save.hat=0;if(!save.ownTrail.includes(save.trail))save.trail=0;
 if(!save.lv||typeof save.lv!=='object')save.lv={};if(!save.stk||typeof save.stk!=='object')save.stk={};
})();

const COLORS=[

 {c:'#ff8fd8',d:'#de5fb3',need:60},{c:'gold',d:'#c99400',need:150},

 {name:'Hard',  speed:1.12,dens:1.55,rival:1.04,hang:0.97,catchup:1.25,cd:250,magnet:40, bonk:1.0,len:29000,dz:[15,24],boost:1,frac:0.75}];

 O:['#ff8f3d','#cf621a'],R:['#ff5a7a','#c9334f'],Wt:['#ffffff','#b9c8de'],Gy:['#c3cad6','#8d96a6'],K:['#ff7eb6','#d64f8e']};

const ALBUM=[
 [['s',6,0],['s',16,0],['s',17,0],['s',19,1],['c',0,1],['c',1,1],['c',2,2],['s',3,3]],
 [['s',9,0],['s',1,0],['s',14,0],['s',8,1],['c',3,1],['c',4,1],['c',5,2],['s',2,3]],
 [['s',22,0],['s',18,0],['s',20,0],['s',7,1],['c',6,1],['c',7,1],['c',8,2],['s',11,3]],
 [['s',0,0],['s',15,0],['s',5,0],['s',4,1],['c',9,1],['c',10,1],['c',11,2],['s',10,3]],
 [['s',13,0],['s',21,0],['s',12,0],['s',24,1],['c',12,1],['c',13,1],['c',14,2],['s',23,3]]];
const ALL_STK=[];ALBUM.forEach((pg,w)=>pg.forEach(e=>ALL_STK.push({id:e[0]+e[1],type:e[0],idx:e[1],rar:e[2],world:w})));
const STK_BY_ID={};ALL_STK.forEach(s=>STK_BY_ID[s.id]=s);
const RAR_COL=[['#ffffff','#9aa6bb'],['#dff0ff','#3d8bff'],['#f1e2ff','#a24dff'],['#fff4c2','#e6a800']];
const RAR_NAME=['Common','Rare','Super Rare','GOLDEN'];
const DUP_COINS=[5,10,20,50];
const ownedCount=()=>ALL_STK.filter(s=>save.stk[s.id]).length;

// ================= audio =================
const mtof=m=>440*Math.pow(2,(m-69)/12);
const Snd={ac:null,master:null,mus:null,fx:null,nb:null,lastChirp:0,
 init(){
  if(this.ac){if(this.ac.state!=='running')this.ac.resume().catch(()=>{});return;}
  const AC=window.AudioContext||window.webkitAudioContext; if(!AC)return;
  try{this.ac=new AC();}catch(e){return;}
  const ac=this.ac;
  this.master=ac.createGain();this.master.gain.value=save.muted?0:0.9;this.master.connect(ac.destination);
  this.mus=ac.createGain();this.mus.gain.value=0.3;this.mus.connect(this.master);
  this.fx=ac.createGain();this.fx.gain.value=0.85;this.fx.connect(this.master);
  const len=ac.sampleRate|0,b=ac.createBuffer(1,len,ac.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=Math.random()*2-1; this.nb=b;
  if(ac.state!=='running')ac.resume().catch(()=>{});
  Music.next=ac.currentTime+0.1;
 },
 ok(){return this.ac&&!save.muted&&this.ac.state==='running';},
 now(){return this.ac?this.ac.currentTime:0;},
 setMute(m){save.muted=m;persist();if(this.master)this.master.gain.setTargetAtTime(m?0:0.9,this.ac.currentTime,0.03);},
 tone(f,dur,type,vol,at,slide,dest){
  if(!this.ok())return; const ac=this.ac,t=Math.max(at||0,ac.currentTime);
  const o=ac.createOscillator(),g=ac.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.2,t+0.008);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(dest||this.fx);o.start(t);o.stop(t+dur+0.03);
 },
 noise(dur,vol,freq,at,ftype,dest,slide){
  if(!this.ok())return; const ac=this.ac,t=Math.max(at||0,ac.currentTime);
  const s=ac.createBufferSource();s.buffer=this.nb;
  const f=ac.createBiquadFilter();f.type=ftype||'bandpass';f.frequency.setValueAtTime(freq||1000,t);
  if(slide)f.frequency.exponentialRampToValueAtTime(slide,t+dur);
  const g=ac.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.2,t+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(f);f.connect(g);g.connect(dest||this.fx);s.start(t,Math.random()*0.5);s.stop(t+dur+0.03);
 },
 tap(){const t=this.now();this.tone(700,0.07,'sine',0.25,t,1100);},
 star(){const t=this.now();this.tone(1318,0.1,'sine',0.22,t);this.tone(1976,0.16,'sine',0.18,t+0.06);},
 ring(){const t=this.now();[784,988,1175,1568].forEach((f,i)=>this.tone(f,0.14,'triangle',0.2,t+i*0.05));},
 bonk(){const t=this.now();this.tone(420,0.42,'triangle',0.45,t,110);this.tone(880,0.18,'sine',0.18,t,300);
  // "boing" wobble
  for(let i=0;i<5;i++)this.tone(260+(i%2)*90,0.08,'sine',0.12,t+0.12+i*0.06);},
 whoosh(){const t=this.now();this.noise(0.5,0.3,400,t,'bandpass',null,3000);},
 loop(){const t=this.now();this.tone(300,0.55,'triangle',0.25,t,1400);this.tone(600,0.5,'sine',0.12,t+0.05,2400);this.noise(0.5,0.12,800,t,'bandpass',null,4000);},
 beep(go){const t=this.now();if(go){this.tone(1046,0.4,'square',0.14,t);this.tone(1568,0.4,'triangle',0.16,t);}else this.tone(523,0.18,'square',0.13,t);},
 cheer(){const t=this.now();[523,659,784,1046,784,1046,1318].forEach((f,i)=>this.tone(f,0.22,'triangle',0.2,t+i*0.09));
  this.noise(1.2,0.08,3000,t,'highpass');},
 chirp(){const t=this.now();if(t-this.lastChirp<0.35)return;this.lastChirp=t;
  this.tone(2300,0.07,'sine',0.12,t,3100);this.tone(2500,0.09,'sine',0.12,t+0.09,3300);},
 pop(){const t=this.now();this.tone(900,0.08,'sine',0.25,t,300);this.noise(0.06,0.2,2000,t);},
 sticker(){const t=this.now();[1046,1318,1568,2093].forEach((f,i)=>this.tone(f,0.25,'sine',0.16,t+i*0.07));}
};

// ================= audio extras =================
Object.assign(Snd,{
 seq(notes,type,vol,step,dur){const t=this.now();notes.forEach((f,i)=>{if(f)this.tone(f,dur||step*1.2,type,vol,t+i*step);});},
 coin(){const t=this.now();this.tone(1568,0.08,'square',0.07,t);this.tone(2093,0.16,'square',0.07,t+0.07);},
 shake(n){const t=this.now();this.tone(180+n*90,0.14,'triangle',0.3,t,260+n*110);this.noise(0.12,0.18,500+n*350,t);},
 boxOpen(){const t=this.now();this.noise(0.6,0.3,300,t,'bandpass',null,5000);this.tone(220,0.5,'sawtooth',0.08,t,880);
  [784,988,1175,1568,1976].forEach((f,i)=>this.tone(f,0.3,'triangle',0.16,t+0.25+i*0.06));},
 reveal(r){const t=this.now();const base=[[523,659,784],[523,659,784,1046],[523,659,784,1046,1318],[523,659,784,1046,1318,1568,2093]][r];
  base.forEach((f,i)=>{this.tone(f,0.35,'triangle',0.18,t+i*0.08);this.tone(f*2,0.25,'sine',0.06,t+i*0.08);});
  if(r>=2)for(let i=0;i<10;i++)this.tone(2000+Math.random()*2500,0.08,'sine',0.05,t+0.5+i*0.05);
  if(r===3)this.noise(1.4,0.07,6000,t+0.4,'highpass');},
 buy(){const t=this.now();[1046,1318,1568,2093].forEach((f,i)=>this.tone(f,0.12,'square',0.06,t+i*0.06));this.coin();},
 nope(){const t=this.now();this.tone(300,0.12,'square',0.1,t);this.tone(240,0.18,'square',0.1,t+0.12);},
 react(k){const t=this.now();
  switch(k){
   case 0:this.tone(520,0.22,'sine',0.3,t,470);this.tone(520,0.3,'sine',0.3,t+0.28,440);break;            // owl hoo-hoo
   case 1:this.tone(600,0.18,'triangle',0.25,t,950);this.tone(950,0.3,'triangle',0.22,t+0.17,480);break;  // meow
   case 2:this.noise(0.45,0.35,700,t,'lowpass',null,200);this.tone(130,0.35,'sawtooth',0.12,t,90);break; // pfff grumble
   case 3:this.tone(1000,0.1,'sawtooth',0.12,t,700);this.tone(1050,0.14,'sawtooth',0.12,t+0.13,650);break; // squawk
   case 4:this.tone(180,0.4,'sine',0.4,t,700);this.tone(700,0.2,'sine',0.15,t+0.25,300);break;            // boing
   case 5:this.tone(330,0.14,'square',0.14,t);this.tone(330,0.2,'square',0.14,t+0.2);this.tone(262,0.2,'square',0.1,t+0.2);break; // honk honk
   case 6:for(let i=0;i<6;i++)this.tone(i%2?260:340,0.08,'sine',0.25,t+i*0.06);break;                     // jiggle
   case 7:[1200,1500,1300,1700,1400,1900].forEach((f,i)=>this.tone(f,0.07,'sine',0.14,t+i*0.06));break;  // giggle
   case 8:this.tone(300,0.35,'triangle',0.2,t,650);this.noise(0.25,0.45,1500,t+0.38,'bandpass',null,600);break; // ah-CHOO
   case 9:for(let i=0;i<7;i++)this.tone(i%2?380:460,0.07,'sine',0.2,t+i*0.05);break;                       // wobble
   case 10:this.tone(200,0.38,'triangle',0.25,t,1000);this.noise(0.1,0.2,3000,t+0.36);break;              // puff up
   case 11:for(let i=0;i<3;i++)this.tone(320,0.1,'sine',0.25,t+i*0.12,140);break;                          // blub
   case 12:this.tone(800,0.06,'square',0.1,t,1300);this.tone(850,0.06,'square',0.1,t+0.22,1400);break;    // hic hic
   case 13:this.tone(110,0.4,'sawtooth',0.14,t,70);this.noise(0.3,0.2,400,t,'lowpass');break;              // grumble
   case 14:this.tone(200,0.55,'sawtooth',0.12,t,150);this.tone(100,0.55,'triangle',0.2,t,75);break;       // moo
  }}
});

// ================= music =================
const MELS=[
 [72,null,76,79,76,null,74,72, 74,null,79,null,79,77,76,74, 76,null,72,76,81,null,79,76, 77,null,76,74,72,null,null,null],
 [76,null,79,null,81,79,76,null, 74,null,76,79,null,76,74,72, 72,null,74,76,79,null,76,74, 76,null,null,74,72,null,69,null],
 [79,81,79,76,null,72,74,76, 79,null,84,null,81,79,76,null, 74,76,79,null,76,74,72,null, 74,null,76,null,72,null,null,null]];
const PROGS=[[[60,55,57,53],[[0,4,7],[0,4,7],[0,3,7],[0,4,7]]],[[60,57,53,55],[[0,4,7],[0,3,7],[0,4,7],[0,4,7]]],[[57,53,60,55],[[0,3,7],[0,4,7],[0,4,7],[0,4,7]]]];
const TRACKS=[
 {bpm:104,tp:0,lead:'triangle',drums:1,mel:0,pr:0},  // 0 menu
 {bpm:126,tp:0,lead:'square',drums:2,mel:0,pr:0},    // 1 backyard
 {bpm:116,tp:5,lead:'triangle',drums:2,mel:1,pr:1},  // 2 beach
 {bpm:136,tp:7,lead:'square',drums:2,mel:2,pr:1},    // 3 candy
 {bpm:98,tp:2,lead:'sine',drums:1,mel:1,pr:2},       // 4 underwater
 {bpm:110,tp:-3,lead:'sine',drums:1,mel:2,pr:2},     // 5 space
 {bpm:120,tp:2,lead:'triangle',drums:2,mel:0,pr:0}]; // 6 finish / prizes
const Music={track:-1,next:0,step:0,
 play(tr){if(this.track===tr)return;this.track=tr;this.step=0;this.next=Snd.now()+0.12;},
 update(){
  const ac=Snd.ac;if(!ac)return;
  if(this.track<0||!Snd.ok()||document.hidden){this.next=ac.currentTime+0.1;return;}
  const tr=TRACKS[this.track],spb=60/tr.bpm/2;
  if(this.next<ac.currentTime-0.3)this.next=ac.currentTime+0.05;
  while(this.next<ac.currentTime+0.22){this.playStep(tr,this.step,this.next,spb);this.step=(this.step+1)%64;this.next+=spb;}
 },
 playStep(tr,s,t,spb){
  const P=PROGS[tr.pr],MEL=MELS[tr.mel],bar=(s>>3)%4,i=s%8,root=P[0][bar]+tr.tp,CH=P[1],M=Snd.mus;
  if(i===0||i===3||i===4||i===6)Snd.tone(mtof(root-24+(i===6?7:0)),spb*1.5,'triangle',0.34,t,null,M);
  if(i%2===1)for(const iv of CH[bar])Snd.tone(mtof(root+iv),spb*0.7,'square',0.026,t,null,M);
  if(s<32){const m=MEL[s];if(m!=null)Snd.tone(mtof(m+tr.tp),spb*1.6,tr.lead,tr.lead==='square'?0.07:0.14,t,null,M);}
  else{const arp=[0,7,12,CH[bar][1]+12,7,12,19,12];Snd.tone(mtof(root+12+arp[i]),spb*1.2,'sine',0.1,t,null,M);
   if(i===0){const m=MEL[s-32];if(m!=null)Snd.tone(mtof(m+tr.tp),spb*3,tr.lead,tr.lead==='square'?0.06:0.12,t,null,M);}}
  if(tr.drums){
   if(i===0||i===4)Snd.tone(150,0.16,'sine',0.5,t,45,M);

 if(col.c==='rainbow'){const g=ctx.createLinearGradient(-40,-30,45,10);RAINBOW.forEach((k,i)=>g.addColorStop(i/5,k));return g;}

 return col.c;}
// draws plane nose-right at origin, ~95 units long
function drawPlane(shape,colIdx,pat,o){
 o=o||{};const g=PL[shape],col=typeof colIdx==='object'?colIdx:COLORS[colIdx]||COLORS[0];

 if(g.fin){poly(g.fin);fillStroke(dark,INK,2.2);}

 poly(g.wing);ctx.fillStyle=main;ctx.fill();
 if(pat||col.c==='galaxy'){ctx.save();poly(g.wing);ctx.clip();drawPattern(col.c==='galaxy'&&!pat?3:pat,col);ctx.restore();}
 poly(g.wing);ctx.strokeStyle=INK;ctx.lineWidth=2.2;ctx.stroke();

 ctx.fillStyle='#fff';circ(ex,ey,er*(o.bigEye||1));ctx.fill();ctx.strokeStyle=INK;ctx.lineWidth=1.5;ctx.stroke();

 if(o.dizzy){ctx.strokeStyle=INK;ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(ex-er*0.6,ey-er*0.6);ctx.lineTo(ex+er*0.6,ey+er*0.6);ctx.moveTo(ex+er*0.6,ey-er*0.6);ctx.lineTo(ex-er*0.6,ey+er*0.6);ctx.stroke();}
 else{ctx.fillStyle=INK;circ(ex+er*0.3+wob,ey+er*0.1,er*0.55);ctx.fill();ctx.fillStyle='#fff';circ(ex+er*0.45+wob,ey-er*0.15,er*0.18);ctx.fill();}
 if(o.brow){ctx.strokeStyle=INK;ctx.lineWidth=1.8;ctx.beginPath();ctx.moveTo(ex-er,ey-er*1.5);ctx.lineTo(ex+er,ey-er*1.1);ctx.stroke();}

// ================= layout =================
const V={scale:1,w:1,h:1,top:0,bot:1,bandH:1,camFrac:0.22,cb:80};
function layoutWorld(){
 const refW=clamp(560+(W/H-0.45)*240,560,760);const s=clamp(Math.min(H/600,W/refW),0.3,5);
 V.scale=s;V.w=W/s;V.h=H/s;
 V.cb=Math.min(84*UI,H*0.19,W*0.21); // control button diameter (px)
 const m=10*UI;
 V.top=(SAFE.t+m+56*UI)/s+34;
 V.bot=(H-SAFE.b)/s-74;
 V.bandH=Math.max(150,V.bot-V.top);
 // keep the plane clear of the left thumb buttons
 if(H>W*1.3){ // tall phone / cover screen: fly above the thumb buttons, so the plane can sit further left and see further ahead
  V.bot=Math.max(V.top+150,(H-SAFE.b-V.cb*2-m*3)/s-24);V.bandH=Math.max(150,V.bot-V.top);V.camFrac=clamp((SAFE.l+m+40*s)/W,0.17,0.3);}
 else V.camFrac=clamp((SAFE.l+V.cb+m*3+50*s)/W,0.22,0.42);
}
const wy=ny=>V.top+ny*V.bandH;
function resize(){
 W=Math.max(1,Math.round(window.innerWidth));H=Math.max(1,Math.round(window.innerHeight));
 DPR=Math.min(window.devicePixelRatio||1,2.5);
 const maxPx=3.2e6; if(W*H*DPR*DPR>maxPx)DPR=Math.max(1,Math.sqrt(maxPx/(W*H)));
 cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cv.style.width=W+'px';cv.style.height=H+'px';
 const cs=getComputedStyle(safeEl);
 SAFE={t:parseFloat(cs.paddingTop)||0,r:parseFloat(cs.paddingRight)||0,b:parseFloat(cs.paddingBottom)||0,l:parseFloat(cs.paddingLeft)||0};
 UI=clamp(Math.min(W,H)/420,0.8,1.7);
 layoutWorld();
}

// ================= buttons & input =================
let buttons=[];
const ptrs=new Map(); // pointerId -> {bid, steer, y}
const keys={up:false,down:false};
function hitBtn(x,y){for(let i=buttons.length-1;i>=0;i--){const b=buttons[i];
 if(b.circle){if(Math.hypot(x-b.x,y-b.y)<=b.r*1.12)return b;}
 else if(x>=b.x-4&&x<=b.x+b.w+4&&y>=b.y-4&&y<=b.y+b.h+4)return b;}return null;}
const held=id=>{for(const p of ptrs.values())if(p.bid===id)return true;return false;};
function steerY(){let y=null;for(const p of ptrs.values())if(p.steer)y=p.y;return y;}
function roundBtn(id,x,y,r,pal,icon,onTap,opt){
 opt=opt||{};const b={id,x,y,r,circle:true,onTap,hold:opt.hold,down:opt.down};buttons.push(b);
 const pr=held(id)||(opt.lit);ctx.save();ctx.translate(x,y);
 ctx.globalAlpha=opt.alpha==null?1:opt.alpha;
 ctx.fillStyle='rgba(20,20,60,.22)';circ(0,r*0.14,r);ctx.fill();
 const dy=pr?r*0.08:0;ctx.fillStyle=pal[1];circ(0,r*0.08,r*0.97);ctx.fill();
 ctx.fillStyle=pal[0];circ(0,dy-r*0.02,r*0.92);ctx.fill();
 ctx.lineWidth=Math.max(2,r*0.08);ctx.strokeStyle='#fff';ctx.stroke();
 ctx.fillStyle='rgba(255,255,255,.28)';ctx.beginPath();ctx.ellipse(-r*0.2,dy-r*0.45,r*0.45,r*0.22,-0.3,0,TAU);ctx.fill();
 ctx.restore();
 if(icon){if(typeof icon==='function'){ctx.save();ctx.translate(x,y+(pr?r*0.08:0));icon(r);ctx.restore();}else drawIcon(icon,x,y+(pr?r*0.08:0),r*(opt.iconScale||1),opt.iconArg);}
 ctx.globalAlpha=1;return b;}
function rectBtn(id,x,y,w,h,pal,draw,onTap,opt){
 opt=opt||{};const b={id,x,y,w,h,onTap};buttons.push(b);const pr=held(id);const r=Math.min(w,h)*0.28;
 ctx.fillStyle='rgba(20,20,60,.22)';rr(x,y+h*0.08,w,h,r);ctx.fill();
 ctx.fillStyle=pal[1];rr(x,y+h*0.05,w,h,r);ctx.fill();
 const dy=pr?h*0.05:0;ctx.fillStyle=pal[0];rr(x,y+dy,w,h*0.96,r);ctx.fill();
 ctx.lineWidth=opt.sel?Math.max(3,h*0.07):Math.max(2,h*0.04);ctx.strokeStyle=opt.sel?'#ffcf3d':'#fff';ctx.stroke();
 if(draw){ctx.save();ctx.translate(x+w/2,y+h/2+dy);draw(w,h);ctx.restore();}
 return b;}
function toLocal(e){return{x:e.clientX,y:e.clientY};}
cv.addEventListener('pointerdown',e=>{
 e.preventDefault();Snd.init();try{cv.setPointerCapture(e.pointerId);}catch(_){}
 const p=toLocal(e),b=hitBtn(p.x,p.y);
 if(b){ptrs.set(e.pointerId,{bid:b.id,y:p.y});if(b.down&&b.onTap){b.onTap();}}
 else ptrs.set(e.pointerId,{steer:true,y:p.y});
},{passive:false});
cv.addEventListener('pointermove',e=>{const q=ptrs.get(e.pointerId);if(q){q.y=e.clientY;}},{passive:true});
function endPtr(e,cancel){
 const q=ptrs.get(e.pointerId);ptrs.delete(e.pointerId);if(!q||cancel)return;
 Snd.init();
 if(q.bid){const b=hitBtn(e.clientX,e.clientY);if(b&&b.id===q.bid&&!b.hold&&!b.down&&b.onTap){Snd.tap();b.onTap();}}
}
cv.addEventListener('pointerup',e=>endPtr(e,false));
cv.addEventListener('pointercancel',e=>endPtr(e,true));
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
document.addEventListener('touchend',()=>Snd.init(),{passive:true});
['gesturestart','gesturechange','dblclick','contextmenu'].forEach(n=>document.addEventListener(n,e=>e.preventDefault(),{passive:false}));
window.addEventListener('keydown',e=>{Snd.init();
 if(e.key==='ArrowUp'||e.key==='w')keys.up=true;if(e.key==='ArrowDown'||e.key==='s')keys.down=true;
 if(e.key===' '){doLoop();e.preventDefault();}
 if(e.key==='Escape'&&R&&scene==='race')R.paused=!R.paused;});
window.addEventListener('keyup',e=>{if(e.key==='ArrowUp'||e.key==='w')keys.up=false;if(e.key==='ArrowDown'||e.key==='s')keys.down=false;});


// ================= tilt =================
const tilt={ok:false,v:0,raw:0,neutral:null,listening:false};
function onOri(e){if(e.beta==null)return;tilt.ok=true;
 const a=(screen.orientation&&typeof screen.orientation.angle==='number')?screen.orientation.angle:(window.orientation||0);
 let v;if(a===90)v=-e.gamma;else if(a===270||a===-90)v=e.gamma;else if(a===180)v=-e.beta;else v=e.beta;
 tilt.raw=v;if(tilt.neutral==null)tilt.neutral=v;tilt.v=clamp(v-tilt.neutral,-45,45);}
function listenTilt(){if(tilt.listening)return;tilt.listening=true;window.addEventListener('deviceorientation',onOri);}
const hasTilt=typeof window.DeviceOrientationEvent!=='undefined';
function toggleTilt(){
 if(save.tilt){save.tilt=false;persist();return;}
 const D=window.DeviceOrientationEvent;
 if(D&&typeof D.requestPermission==='function'){D.requestPermission().then(r=>{if(r==='granted'){listenTilt();save.tilt=true;persist();}}).catch(()=>{});}
 else{listenTilt();save.tilt=true;persist();}
}
if(save.tilt&&hasTilt&&!(window.DeviceOrientationEvent&&typeof DeviceOrientationEvent.requestPermission==='function'))listenTilt();

// ================= fullscreen =================
const fsEnabled=!!(document.fullscreenEnabled||document.webkitFullscreenEnabled);
const isFS=()=>!!(document.fullscreenElement||document.webkitFullscreenElement);
function toggleFS(){
 const d=document.documentElement;
 if(isFS()){(document.exitFullscreen||document.webkitExitFullscreen).call(document);}
 else{const f=d.requestFullscreen||d.webkitRequestFullscreen;if(f){try{const p=f.call(d,{navigationUI:'hide'});if(p&&p.catch)p.catch(()=>{});}catch(_){}}}
}

function confetti(n,x0,x1,y0){const cs=['#ff5a6e','#ffd93d','#4cd07d','#4d96ff','#b57bff','#ff9f1c','#ff8fd8'];
 for(let i=0;i<n;i++)addPart(sparts,{x:rand(x0,x1),y:y0+rand(-40,0),vx:rand(-60,60),vy:rand(60,220),life:rand(2.5,4.5),max:4.5,size:rand(6,12)*UI,col:cs[i%cs.length],type:2,g:60,rot:rand(0,TAU),vr:rand(-8,8)});}
function updParts(arr,dt){for(let i=arr.length-1;i>=0;i--){const p=arr[i];p.life-=dt;if(p.life<=0){arr.splice(i,1);continue;}
 p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt;if(p.type!==2){p.vx*=0.94;p.vy*=0.94;}else p.vx+=Math.sin(T*3+i)*20*dt;p.rot+=p.vr*dt;}}
function drawParts(arr){for(const p of arr){ctx.globalAlpha=Math.min(1,p.life/0.3);ctx.fillStyle=p.col;

 const pick=()=>{let r=Math.random()*tot;for(let i=0;i<wt.length;i++){if((r-=wt[i])<0)return i;}return 0;};

  if(k===0){const ny=clamp(lastNy+rand(-0.35,0.35),0.08,0.92),n=3+(Math.random()*2|0),wav=Math.random()<0.5;

  else if(k===1){const ny=rand(0.15,0.85);o.push({t:'ring',x,ny});o.push({t:'star',x:x+100,ny});x+=rand(380,520);lastNy=ny;}
  else if(k===2){const ny=rand(0.12,0.88);o.push({t:'char',k:cast[(Math.random()*cast.length)|0],x:x+100,ny,cy:ny,ph:rand(0,TAU)});

   else if(Math.random()<0.3){const ny2=ny>0.5?ny-0.32:ny+0.32;for(let i=0;i<2;i++)o.push({t:'star',x:x+60+i*70,ny:ny2});}
   x+=Math.max(300,rand(420,600)/Math.sqrt(dens));}
  else if(k===3){const ny=rand(0.22,0.78);o.push({t:'gust',x,w:800,ny,h:0.3});for(let i=0;i<2;i++)o.push({t:'star',x:x+250+i*300,ny});x+=980;}

function raceUpdate(dt){
 const p=R.p,sh=SHAPES[save.shape],D=DIFFS[R.d];
 if(R.paused)return;
 R.t+=dt;R.shake=Math.max(0,R.shake-dt);
 if(R.count>-1){R.count-=dt;const c=Math.ceil(R.count);if(c!==R.lastCount){R.lastCount=c;if(c>0&&c<=3)Snd.beep(0);else if(c===0){Snd.beep(1);tilt.neutral=tilt.raw;}}}
 const going=R.count<=0;
 let u=0;
 if(!p.fin){
  if(held('up')||keys.up)u-=1;if(held('down')||keys.down)u+=1;
  const sy=steerY();
  if(sy!=null){const ny=(sy/V.scale-V.top)/V.bandH;u=clamp((ny-p.ny)*7,-1,1);}
  else if(u===0&&save.tilt&&tilt.ok){u=clamp(-tilt.v/16,-1,1);if(Math.abs(u)<0.1)u=0;}
 }
 p.vny+=(u*sh.steer-p.vny)*Math.min(1,dt*7);
 const objs=R.objs;while(R.oi<objs.length&&objs[R.oi].x+(objs[R.oi].w||0)<R.cam-500)R.oi++;

     if(dd<54){o.gone=true;p.stars++;R.collected++;Snd.star();sparkle(o.x,sy,6);if(Math.random()<0.3)birdSay(0);}
     else if(going&&!p.fin&&dd<D.magnet){if(!o.mag){o.mag=true;o.wy=sy;}const k=Math.min(1,dt*8);o.x+=(p.x+24-o.x)*k;o.wy+=(py-o.wy)*k;}}break;
   case 'ring':if(!o.done&&p.x>=o.x){o.done=true;if(Math.abs(py-wy(o.ny))<62+(R.d===0?18:0)){o.hit=R.t;p.stars++;p.boost=Math.max(p.boost,1.3);Snd.ring();sparkle(o.x,wy(o.ny),12,'#ff8fd8');birdSay(2);}}break;
   case 'gust':if(p.x>o.x&&p.x<o.x+o.w&&Math.abs(p.ny-o.ny)<o.h/2){inGust=true;if(!o.hit){o.hit=1;Snd.whoosh();}}break;
   case 'fan':if(p.x>o.x-20&&p.x<o.x+o.w+20){if(going)p.vny-=2.4*dt*sh.lift;p.boost=Math.max(p.boost,0.4);if(!o.hit){o.hit=1;Snd.whoosh();birdSay(2);}}break;
   case 'char':{
    if(o.hitT!=null){o.x+=o.kvx*dt;o.cy+=o.kvy*dt/V.bandH;break;}
    const C=CHARS[o.k],tt=R.t+o.ph;
    if(going&&C.mv==='fly')o.x-=C.spd*dt;else if(going&&C.mv==='drift')o.x-=18*dt;
    if(C.mv==='bounce')o.cy=o.ny+0.07-Math.abs(Math.sin(tt*2.6))*0.14;
    else if(C.mv==='pulse')o.cy=o.ny+Math.sin(tt*1.6)*0.07;
    else if(C.mv==='hic')o.cy=o.ny+Math.sin(tt)*0.03;
    else o.cy=o.ny+Math.sin(tt*1.3)*0.035;
    if(going&&!p.fin&&p.inv<=0&&p.loop<=0&&Math.hypot(p.x+8-o.x,py-wy(o.cy))<charRad(o)*1.2+12)bonk(o);
   }}
 }
 p.gust=inGust;
 p.ny+=p.vny*dt;if(p.ny<0){p.ny=0;p.vny=Math.max(0,p.vny);}if(p.ny>1){p.ny=1;p.vny=Math.min(0,p.vny);}
 p.ang=lerp(p.ang,clamp(p.vny*0.45,-0.5,0.5),Math.min(1,dt*8));
 p.spin=Math.max(0,p.spin-dt*1.4);p.loop=Math.max(0,p.loop-dt);
 if(going){
  p.boost=Math.max(0,p.boost-dt);p.bonk=Math.max(0,p.bonk-dt);p.inv=Math.max(0,p.inv-dt);p.loopCd=Math.max(0,p.loopCd-dt);
  let mul=D.speed*sh.speed*(1+(p.boost>0?0.45:0)+(inGust?0.4*sh.lift:0));if(p.bonk>0)mul*=0.45;if(p.fin)mul=0.9;
  p.spd=lerp(p.spd,BASE*mul,Math.min(1,dt*3));p.x+=p.spd*dt-p.bounce*dt;p.bounce=Math.max(0,p.bounce-900*dt);
  const lp=loopOffset(p);spawnTrail(save.trail,p.x-42+lp.x,py+lp.y,dt);
  if(p.boost>0&&Math.random()<0.5)addPart(wparts,{x:p.x-40,y:py+rand(-10,10),vx:-120,vy:0,life:0.35,max:0.35,size:rand(5,9),col:'rgba(255,255,255,.9)',type:0,g:0,rot:0,vr:0});
 }
 R.histT+=dt;if(R.histT>0.03){R.histT=0;const lp=loopOffset(p);R.hist.push([p.x-40+lp.x,py+lp.y]);if(R.hist.length>22)R.hist.shift();}
 for(const r of R.rivals){

  if(D.boost){r.bT-=dt;if(r.bT<=0){r.bst=1.4;r.bT=rand(6,10);}r.bst=Math.max(0,r.bst-dt);}

 }

function rollSticker(src){

 const missing=ALL_STK.filter(s=>!save.stk[s.id]),opened=save.boxes|0,w=R?R.w:save.world;
 let rar=pickOdds(odds),pool;
 if(opened===0)rar=1;
 if((save.dry|0)>=20)rar=3; // pity: a golden sticker at least every 21 boxes
 if(opened<8&&missing.length){ // early boxes: always a new sticker
  pool=missing.filter(s=>s.rar===rar);if(!pool.length)pool=missing.filter(s=>s.rar<=Math.max(rar,1));if(!pool.length)pool=missing;
 }else{const inR=ALL_STK.filter(s=>s.rar===rar),miss=inR.filter(s=>!save.stk[s.id]);pool=(miss.length&&Math.random()<0.6)?miss:inR;}
 const here=pool.filter(s=>s.world===w);if(here.length&&Math.random()<0.65)pool=here;

 save.coins+=coins;save.boxes=opened+1;save.dry=s.rar===3?0:(save.dry|0)+1;save.pending=Math.max(0,save.pending-1);persist();

}

 roundBtn('openbox',cx,by-Math.abs(Math.sin(T*4))*6*UI,bR*1.25,PAL.K,r=>{ctx.rotate(gj);drawIcon('gift',0,0,r*1.15);},()=>openBox('race'));
 drawParts(sparts);
}
// ================= mystery box =================
function drawGiftBox(x,y,s,lidUp,glow,col){
 ctx.save();ctx.translate(x,y);
 if(glow>0){ctx.globalAlpha=glow;const g=ctx.createRadialGradient(0,0,s*0.2,0,0,s*1.6);g.addColorStop(0,col);g.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=g;circ(0,0,s*1.6);ctx.fill();ctx.globalAlpha=1;}
 ctx.strokeStyle=INK;ctx.lineWidth=Math.max(3,s*0.04);ctx.lineJoin='round';
 rr(-s*0.62,-s*0.25,s*1.24,s*0.95,s*0.08);ctx.fillStyle='#b57bff';ctx.fill();ctx.stroke();
 ctx.fillStyle='rgba(255,255,255,.25)';for(let k=0;k<4;k++){circ(-s*0.4+k*s*0.27,s*0.15+(k%2)*s*0.25,s*0.07);ctx.fill();}
 ctx.fillStyle='#ffd93d';ctx.fillRect(-s*0.1,-s*0.25,s*0.2,s*0.95);ctx.strokeRect(-s*0.1,-s*0.25,s*0.2,s*0.95);
 ctx.save();ctx.translate(0,-s*0.25-lidUp*s*1.6);ctx.rotate(lidUp*-1.2);
 rr(-s*0.7,-s*0.28,s*1.4,s*0.3,s*0.06);ctx.fillStyle='#c99bff';ctx.fill();ctx.stroke();ctx.fillStyle='#ffd93d';ctx.fillRect(-s*0.1,-s*0.28,s*0.2,s*0.3);ctx.strokeRect(-s*0.1,-s*0.28,s*0.2,s*0.3);
 ctx.beginPath();ctx.ellipse(-s*0.2,-s*0.38,s*0.22,s*0.13,0.5,0,TAU);ctx.fill();ctx.stroke();ctx.beginPath();ctx.ellipse(s*0.2,-s*0.38,s*0.22,s*0.13,-0.5,0,TAU);ctx.fill();ctx.stroke();circ(0,-s*0.3,s*0.08);ctx.fill();ctx.stroke();
 ctx.restore();ctx.restore();}
function drawBoxScene(){
 const B=BOX,res=B.res,rc=RAR_COL[res.rar][1];
 const g=ctx.createRadialGradient(W/2,H*0.45,10,W/2,H*0.45,Math.max(W,H)*0.8);g.addColorStop(0,B.phase==='shake'?'#6a3fc9':'#8f5af0');g.addColorStop(1,'#1d0f4f');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 for(let k=0;k<40;k++){ctx.globalAlpha=0.3+0.5*Math.abs(Math.sin(T*2+k));ctx.fillStyle='#fff';starPath(hash(k)*W,hash(k+7)*H,2+hash(k*3)*4,1+hash(k*3)*1.5);ctx.fill();}ctx.globalAlpha=1;
 const m=12*UI,s=Math.min(W*0.36,H*0.3),cx=W/2,cy=H*0.5;
 const ph=40*UI;pill(W-SAFE.r-m,SAFE.t+m,ph,save.coins,'right','coin',B.coinPop>0);
 if(B.phase==='shake'){
  const k=B.taps/B.need,idle=Math.sin(T*(6+k*8))*(0.05+k*0.08),j=B.jolt;
  ctx.save();ctx.translate(cx+Math.sin(T*50)*j*14*UI,cy);ctx.rotate(idle+Math.sin(T*40)*j*0.3);ctx.scale(1+j*0.12+k*0.08,1-j*0.06+k*0.08);
  drawGiftBox(0,0,s,k*0.06+j*0.05,k*0.9,rc);ctx.restore();
  buttons.push({id:'box',x:cx,y:cy,r:s*1.1,circle:true,down:true,onTap:()=>{B.taps++;B.jolt=1;B.idle=0;Snd.shake(B.taps);sparkle(0,0,0);
   for(let i=0;i<8+B.taps*4;i++){const a=rand(0,TAU),v=rand(150,380)*UI;addPart(sparts,{x:cx,y:cy-s*0.3,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:0.7,max:0.7,size:rand(6,12)*UI,col:B.taps>=B.need-1?rc:['#fff27a','#ffffff','#ff9de2'][i%3],type:1,g:300,rot:0,vr:rand(-6,6)});}
   if(B.taps>=B.need){B.phase='open';B.t=0;Snd.boxOpen();confetti(140,0,W,-20);}}});
  for(let i=0;i<B.need;i++){circ(cx+(i-(B.need-1)/2)*26*UI,cy+s*1.0,9*UI);fillStroke(i<B.taps?'#ffd93d':'rgba(255,255,255,.3)','#fff',2);}
  if(B.idle>1.2){const a=(T*2)%1,hx=cx+s*0.55,hy=cy+s*0.45+(a<0.5?-a:a-1)*20*UI;ctx.save();ctx.translate(hx,hy);ctx.rotate(-0.5);
   ctx.fillStyle='#ffe0c2';ctx.strokeStyle=INK;ctx.lineWidth=3;rr(-12*UI,-34*UI,14*UI,40*UI,7*UI);ctx.fill();ctx.stroke();rr(-16*UI,0,32*UI,30*UI,10*UI);ctx.fill();ctx.stroke();ctx.restore();
   ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=3;circ(cx+s*0.42,cy+s*0.1,(10+a*24)*UI);ctx.globalAlpha=1-a;ctx.stroke();ctx.globalAlpha=1;}
 }else{
  const ot=B.t,lid=Math.min(1,ot*2.2);
  // light rays
  ctx.save();ctx.translate(cx,cy);ctx.rotate(T*0.6);ctx.globalAlpha=Math.min(0.55,ot);ctx.fillStyle=res.rar===3?'#ffe066':rc;for(let i=0;i<12;i++){ctx.rotate(TAU/12);poly([[-s*0.12,0],[s*0.12,0],[0,-Math.max(W,H)]]);ctx.fill();}ctx.restore();ctx.globalAlpha=1;
  if(ot<1.2){ctx.globalAlpha=1-Math.max(0,ot-0.6)/0.6;drawGiftBox(cx,cy+s*0.2+ot*s*0.8,s,lid,1,rc);ctx.globalAlpha=1;}
  const rv=clamp((ot-0.45)/0.6,0,1),e=rv<1?Math.sin(rv*Math.PI/2)*1.15:1+Math.sin(T*3)*0.03,ss=s*1.25;
  if(rv>0){ctx.save();ctx.translate(cx,cy-s*0.15-rv*s*0.15);ctx.scale(e,e);ctx.rotate((1-rv)*3+Math.sin(T*2)*0.05);drawStickerId(res.id,0,0,ss,true,res.count);ctx.restore();
   if(rv>=1&&!B.revealed){B.revealed=true;Snd.reveal(res.rar);confetti(res.rar>=2?160:80,0,W,-20);if(res.coins){B.coinPop=1.5;for(let i=0;i<Math.min(10,res.coins/5);i++)setTimeout(()=>Snd.coin(),300+i*90);}}
   if(B.revealed){const by=cy-s*0.15+ss*0.62,bh=Math.min(ss*0.22,40*UI*1.4),bw=bh*5.4;
    ctx.save();ctx.translate(cx,by);ctx.rotate(Math.sin(T*3)*0.03);ctx.fillStyle=rc;poly([[-bw/2-bh*0.5,bh*0.1],[-bw/2,-bh/2],[bw/2,-bh/2],[bw/2+bh*0.5,bh*0.1],[bw/2,bh/2],[-bw/2,bh/2]]);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.stroke();
    for(let i=0;i<=res.rar;i++){const gx=-bw/2+bh*0.55+i*bh*0.45;ctx.fillStyle='#fff';poly([[gx,-bh*0.25],[gx+bh*0.15,0],[gx,bh*0.25],[gx-bh*0.15,0]]);ctx.fill();}
    text(RAR_NAME[res.rar],bh*0.5,0,bh*0.55,'#fff',null,INK,bh*0.12);ctx.restore();
    const tagY=cy-s*0.15-ss*0.62;
    if(res.isNew)text('NEW!',cx,tagY,s*0.22*(1+Math.sin(T*6)*0.06),'#ffd93d',null,INK);
    else{drawIcon('coin',cx-s*0.22,tagY,s*0.28);text('+'+res.coins,cx+s*0.08,tagY,s*0.2,'#ffd93d','left',INK);}
    if(B.bonus){drawIcon('gift',SAFE.l+m+20*UI,SAFE.t+m+20*UI,20*UI);drawIcon('coin',SAFE.l+m+52*UI,SAFE.t+m+20*UI,22*UI);text('+'+B.bonus,SAFE.l+m+68*UI,SAFE.t+m+21*UI,18*UI,'#ffd93d','left',INK);}
    // buttons
    const bR=clamp(Math.min(W,H)*0.095,38,74),yb=H-SAFE.b-m-bR,sp=bR*2.5;
    if(B.src==='race'&&R){const idx=R.w*3+R.lvl,nx=Math.min(idx+1,NLV-1),hasNext=idx+1<NLV;
     if(hasNext)roundBtn('bnext',cx,yb,bR*1.15,PAL.G,'next',()=>{const w=(nx/3)|0,l=nx%3;startLevel(w,l);});
     else roundBtn('bagain',cx,yb,bR*1.15,PAL.G,'replay',()=>startLevel());
     roundBtn('bmap',cx-sp,yb,bR*0.85,PAL.B,'map',()=>{R=null;mapPage=-1;go('map');});
     roundBtn('balbum',cx+sp,yb,bR*0.85,PAL.P,'book',()=>{albumPage=STK_BY_ID[res.id].world;R=null;go('album');});}
    else{roundBtn('bhome',cx-sp*0.6,yb,bR*0.9,PAL.Y,'home',()=>go('menu'));
     roundBtn('balbum',cx+sp*0.6,yb,bR*0.9,PAL.P,'book',()=>{albumPage=STK_BY_ID[res.id].world;go('album');});
     if(save.pending>0)roundBtn('bmore',W-SAFE.r-m-bR,yb,bR*0.85,PAL.K,r=>drawIcon('gift',0,0,r),()=>openBox('pending'));}
   }}
 }
 drawParts(sparts);
}

// ================= main loop =================
function update(dt){
 T+=dt;sceneT+=dt;coinFlash=Math.max(0,coinFlash-dt);
 if(scene==='race'&&R)raceUpdate(dt);
 if(scene==='box'&&BOX){BOX.t+=dt;BOX.jolt=Math.max(0,BOX.jolt-dt*4);BOX.idle+=dt;if(BOX.coinPop)BOX.coinPop=Math.max(0,BOX.coinPop-dt);}
 updParts(wparts,dt);updParts(sparts,dt);
 if(scene==='finish'&&sceneT<3&&Math.random()<dt*10)confetti(4,0,W,-10);
 if(scene==='finish'&&R&&R.reward){for(let k=0;k<R.reward.ls;k++){const tk=0.4+k*0.45;if(sceneT>=tk&&sceneT-dt<tk)Snd.tone(880+k*220,0.25,'triangle',0.2);}}
 for(const k in wig)wig[k]=Math.max(0,wig[k]-dt*1.5);
}
function draw(){
 buttons=[];ctx.setTransform(DPR,0,0,DPR,0,0);ctx.lineJoin='round';ctx.lineCap='round';
 if(scene==='race'&&R)drawRace();
 else if(scene==='finish'&&R)drawFinish();
 else if(scene==='box'&&BOX)drawBoxScene();
 else if(scene==='map')drawMap();
 else if(scene==='diff')drawDiff();
 else if(scene==='hangar')drawHangar();
 else if(scene==='album')drawAlbum();
 else if(scene==='shop')drawShop();
 else drawMenu();
}
let last=performance.now(),fpsAcc=0,fpsN=0,fps=60,errors=0,frameMs=0;
function frame(now){
 requestAnimationFrame(frame);
 let dt=(now-last)/1000;last=now;if(!(dt>0))dt=0;if(dt>0.1)dt=0.1;
 fpsAcc+=dt;fpsN++;if(fpsAcc>=1){fps=fpsN/fpsAcc;fpsAcc=0;fpsN=0;}
 if(window.innerWidth!==W||window.innerHeight!==H)resize();
 const t0=performance.now();
 try{let rem=dt*TS;while(rem>1e-6){const s=Math.min(rem,1/50);update(s);rem-=s;}
  Music.update();draw();}catch(e){errors++;if(errors<5)console.error(e);}
 frameMs=frameMs*0.95+(performance.now()-t0)*0.05;
}
['resize','orientationchange','fullscreenchange','webkitfullscreenchange'].forEach(n=>window.addEventListener(n,()=>{resize();},{passive:true}));
if(window.visualViewport)window.visualViewport.addEventListener('resize',()=>resize(),{passive:true});
if(screen.orientation&&screen.orientation.addEventListener)screen.orientation.addEventListener('change',()=>{resize();tilt.neutral=null;});
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(R&&scene==='race'&&!R.p.fin)R.paused=true;if(Snd.ac)Snd.ac.suspend().catch(()=>{});}else if(Snd.ac)Snd.ac.resume().catch(()=>{});});
resize();go('menu');requestAnimationFrame(frame);
if('serviceWorker' in navigator&&location.protocol!=='file:'){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}
// test / debug hook (harmless, local only)
window.__sky={get scene(){return scene;},get race(){return R;},get save(){return save;},get fps(){return fps;},get frameMs(){return frameMs;},get V(){return V;},get BOX(){return BOX;},get keys(){return keys;},
 set timeScale(v){TS=clamp(+v||1,0.1,20);},get timeScale(){return TS;},
 buttons(){return buttons.map(b=>({id:b.id,x:b.circle?b.x:b.x+b.w/2,y:b.circle?b.y:b.y+b.h/2}));},
 startLevel,startRace,go,doLoop,openBox,rollSticker,setPage(p){mapPage=p;albumPage=p;},
 skipTo(f){if(R){R.p.x=R.L*f;for(const r of R.rivals)r.x=R.L*f+(Math.random()*400-300);R.oi=0;}}};
})();
