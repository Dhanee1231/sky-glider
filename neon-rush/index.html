<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#1a0b2e"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg">
<title>Neon Rush</title>
<style>
:root{--u:min(1vw,1vh);--btn:max(60px,calc(var(--u)*13));--pad:max(10px,env(safe-area-inset-left))}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#140a24;color:#fff;font-family:"Baloo 2","Nunito","Arial Rounded MT Bold",system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
#stage canvas{position:fixed;inset:0;width:100vw!important;height:100vh!important;display:block}
.layer{position:fixed;inset:0}
#tapLayer{z-index:1}
.hud{z-index:2;pointer-events:none}
.hud>*{position:absolute}
.place{left:max(14px,env(safe-area-inset-left));top:10px;font-size:clamp(40px,calc(var(--u)*11),72px);font-weight:900;line-height:1;text-shadow:0 0 12px #ff3fd8,0 4px 0 #6a1b9a}
.place sup{font-size:.45em}
.lapbox{right:max(14px,env(safe-area-inset-right));top:10px;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.lap{font-size:clamp(26px,calc(var(--u)*6.5),40px);font-weight:900;padding:2px 16px;border-radius:20px;background:rgba(30,10,60,.6);border:3px solid #35f2ff;text-shadow:0 0 8px #35f2ff;white-space:nowrap}
.timer{font-size:clamp(18px,calc(var(--u)*4),26px);font-weight:800;opacity:.9;padding-right:8px}
.portraits{left:max(14px,env(safe-area-inset-left));top:calc(10px + clamp(44px,calc(var(--u)*12),78px));display:flex;flex-direction:column;gap:6px}
.pt{width:clamp(40px,calc(var(--u)*9),56px);height:clamp(40px,calc(var(--u)*9),56px);border-radius:50%;border:3px solid #fff;display:grid;place-items:center;box-shadow:0 0 10px currentColor}
.pt svg{width:60%;height:60%}
.rb{pointer-events:auto;border:3px solid #fff;background:rgba(30,10,60,.65);color:#fff;border-radius:50%;width:var(--btn);height:var(--btn);display:grid;place-items:center;padding:0;cursor:pointer;touch-action:manipulation}
.rb svg{width:46%;height:46%}
#btnPause{margin-top:2px}
.steer{pointer-events:auto;bottom:max(12px,env(safe-area-inset-bottom));width:clamp(84px,calc(var(--u)*22),132px);height:clamp(84px,calc(var(--u)*22),132px);border-radius:30px;background:rgba(255,255,255,.12);border:3px solid rgba(255,255,255,.55);display:grid;place-items:center;touch-action:none}
.steer.on{background:rgba(53,242,255,.35);border-color:#35f2ff}
.steer svg{width:55%;height:55%}
#steerL{left:max(14px,env(safe-area-inset-left))}#steerR{right:max(14px,env(safe-area-inset-right))}
.item{right:calc(max(14px,env(safe-area-inset-right)) + clamp(84px,calc(var(--u)*22),132px) + 22px);bottom:calc(max(12px,env(safe-area-inset-bottom)) + 10px);width:clamp(64px,calc(var(--u)*15),92px);height:clamp(64px,calc(var(--u)*15),92px);transform:rotate(45deg);border-radius:18px;background:rgba(80,60,20,.5);border:4px dashed rgba(255,225,77,.7);display:grid;place-items:center}
.item svg{transform:rotate(-45deg);width:50%;height:50%;opacity:.55}
.pop{left:50%;top:20%;transform:translateX(-50%) rotate(-3deg) scale(.6);opacity:0;font-size:clamp(26px,calc(var(--u)*8),44px);font-weight:900;white-space:nowrap;padding:4px 22px;border-radius:24px;background:linear-gradient(90deg,#ff3fd8,#8a5cff);box-shadow:0 0 20px #ff3fd8;transition:transform .25s cubic-bezier(.3,1.6,.5,1),opacity .2s}
.pop.show{opacity:1;transform:translateX(-50%) rotate(-3deg) scale(1)}
.tap{left:50%;top:38%;transform:translate(-50%,-50%) scale(.5);opacity:0;font-size:clamp(48px,calc(var(--u)*16),110px);font-weight:900;color:#ffe14d;text-shadow:0 0 18px #ff9a00,0 6px 0 #7a3a00;transition:.15s}
.tap.show{opacity:1;transform:translate(-50%,-50%) scale(1);animation:blink .5s infinite alternate}
@keyframes blink{to{transform:translate(-50%,-50%) scale(1.15)}}
.count{left:50%;top:42%;transform:translate(-50%,-50%);font-size:clamp(80px,calc(var(--u)*30),200px);font-weight:900;color:#fff;text-shadow:0 0 30px #35f2ff,0 8px 0 #2a1060;opacity:0}
.count.show{opacity:1}.count.pulse{animation:pulse .8s ease-out}
@keyframes pulse{from{transform:translate(-50%,-50%) scale(1.8);opacity:.2}30%{opacity:1}to{transform:translate(-50%,-50%) scale(1)}}
.toast{left:50%;bottom:30%;transform:translateX(-50%);padding:6px 18px;border-radius:16px;background:rgba(20,8,40,.8);font-size:20px;font-weight:800;opacity:0;transition:.3s}.toast.show{opacity:1}
/* panels */
.panel{z-index:5;display:none;align-items:center;justify-content:center;background:rgba(16,6,34,.72);backdrop-filter:blur(3px);padding:max(10px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));overflow:auto}
.panel.show{display:flex}
.card{display:flex;flex-direction:column;align-items:center;gap:clamp(8px,calc(var(--u)*2.5),20px);max-width:100%;max-height:100%;text-align:center}
h1,h2{margin:0;font-weight:900;line-height:1}
h1{font-size:clamp(46px,calc(var(--u)*15),110px);background:linear-gradient(180deg,#fff,#ff8ae0 55%,#a35cff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px #ff3fd8);letter-spacing:1px}
h2{font-size:clamp(34px,calc(var(--u)*10),68px);text-shadow:0 0 14px #ff3fd8}
h2 sup{font-size:.5em}
.sub{font-size:clamp(18px,calc(var(--u)*4.5),28px);font-weight:700;opacity:.92}
.row{display:flex;gap:clamp(10px,calc(var(--u)*3),24px);align-items:center;justify-content:center;flex-wrap:wrap}
.big{pointer-events:auto;display:flex;align-items:center;gap:12px;font:inherit;font-size:clamp(24px,calc(var(--u)*6.5),40px);font-weight:900;color:#2b1055;background:linear-gradient(180deg,#fff27a,#ffb000);border:4px solid #fff;border-radius:999px;padding:clamp(8px,calc(var(--u)*2),16px) clamp(22px,calc(var(--u)*6),44px);box-shadow:0 0 22px #ffb000,0 6px 0 #a35a00;cursor:pointer;white-space:nowrap;min-height:64px;touch-action:manipulation}
.big svg{width:1.1em;height:1.1em}
.lbtn{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:clamp(15px,calc(var(--u)*3.6),20px);font-weight:800;color:#fff;text-decoration:none}
.lbtn .rb{width:clamp(64px,calc(var(--u)*15),88px);height:clamp(64px,calc(var(--u)*15),88px)}
.stats{display:flex;gap:22px;font-size:clamp(18px,calc(var(--u)*4.4),26px);font-weight:800}
.stats b{color:#35f2ff}
.setgrid{display:grid;grid-template-columns:repeat(2,minmax(0,auto));gap:clamp(8px,calc(var(--u)*2.4),18px) clamp(12px,calc(var(--u)*4),28px);align-items:center}
.tg{pointer-events:auto;display:flex;align-items:center;gap:10px;font:inherit;font-size:clamp(18px,calc(var(--u)*4.4),24px);font-weight:800;color:#fff;background:rgba(255,255,255,.1);border:3px solid rgba(255,255,255,.5);border-radius:18px;padding:8px 16px;min-height:60px;min-width:150px;cursor:pointer;touch-action:manipulation}
.tg svg{width:30px;height:30px;flex:none}
.tg[aria-pressed="true"]{background:rgba(53,242,255,.3);border-color:#35f2ff}
.tg[aria-pressed="false"] .onl{opacity:.35}
.seg{display:flex;gap:6px}.seg .tg{min-width:0;padding:8px 12px}
.lbl{font-size:clamp(16px,calc(var(--u)*4),22px);font-weight:800;text-align:right;opacity:.9}
#rotate{z-index:9;flex-direction:column;gap:16px;font-size:clamp(26px,7vw,40px);font-weight:900}
#rotate svg{width:min(40vw,170px);height:min(40vw,170px)}
#fps{position:fixed;left:4px;bottom:4px;z-index:8;white-space:pre;font:12px/1.3 ui-monospace,monospace;color:#7dff6a;background:rgba(0,0,0,.6);padding:3px 6px;border-radius:6px;display:none;pointer-events:none}
#fps.show{display:block}
#title .card{gap:clamp(10px,calc(var(--u)*3),26px)}
.loading{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:#140a24;font-size:28px;font-weight:900}
@media (max-height:430px){.portraits{display:none}}
</style></head><body>
<div id="stage"></div>
<div id="tapLayer" class="layer"></div>
<div class="layer hud" id="hud">
 <div class="place" id="place">2<sup>nd</sup></div>
 <div class="lapbox"><div class="lap" id="lap">LAP 1/3</div><div class="timer" id="timer">0:00.0</div><button class="rb" id="btnPause" aria-label="Pause"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="5" height="18" rx="2" fill="#fff"/><rect x="14" y="3" width="5" height="18" rx="2" fill="#fff"/></svg></button></div>
 <div class="portraits"><div class="pt" id="ptHero" style="background:#e8287a;color:#e8287a"><svg viewBox="0 0 24 24"><circle cx="12" cy="11" r="8" fill="#fff"/><rect x="5" y="9" width="14" height="5" rx="2.5" fill="#101828"/></svg></div>
  <div class="pt" id="ptPip" style="background:#ff7a1a;color:#ff7a1a"><svg viewBox="0 0 24 24"><path d="M4 3l5 6h6l5-6-1 10-7 8-7-8z" fill="#fff"/><circle cx="9.5" cy="12" r="1.3" fill="#1a1214"/><circle cx="14.5" cy="12" r="1.3" fill="#1a1214"/></svg></div></div>
 <div class="pop" id="pop"></div>
 <div class="tap" id="tapPrompt">TAP!</div>
 <div class="count" id="count">3</div>
 <div class="toast" id="toast"></div>
 <div class="steer" id="steerL" aria-label="Steer left"><svg viewBox="0 0 24 24"><path d="M16 3 6 12l10 9z" fill="#fff"/></svg></div>
 <div class="item" aria-label="Item (coming soon)"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3" fill="none" stroke="#ffe14d" stroke-width="2.5"/><path d="M10 9a2 2 0 1 1 3 1.7c-.8.5-1 1-1 2M12 16v.5" stroke="#ffe14d" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg></div>
 <div class="steer" id="steerR" aria-label="Steer right"><svg viewBox="0 0 24 24"><path d="M8 3l10 9-10 9z" fill="#fff"/></svg></div>
</div>

<div class="layer panel show" id="title"><div class="card">
 <h1>Neon Rush</h1><div class="sub">Race Pip the fox through Neon Sky City!</div>
 <button class="big" id="btnStart"><svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z" fill="#2b1055"/></svg>Tap to race!</button>
 <div class="row"><a class="lbtn" href="../home/" id="btnHomeTitle"><span class="rb"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z" fill="#fff"/></svg></span>Home</a>
  <div class="lbtn"><button class="rb" id="btnSetTitle" aria-label="Settings"><svg viewBox="0 0 24 24"><path fill="#fff" d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.6 7.6 0 0 0-1.7-1L15 3h-4l-.4 2.9a7.6 7.6 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.5 7.5 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.6 7.6 0 0 0 1.7 1L11 21h4l.4-2.9a7.6 7.6 0 0 0 1.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg></button>Settings</div></div>
</div></div>

<div class="layer panel" id="pauseMenu"><div class="card">
 <h2>Paused</h2>
 <button class="big" id="btnResume"><svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z" fill="#2b1055"/></svg>Keep racing</button>
 <div class="row">
  <div class="lbtn"><button class="rb" id="btnRestart" aria-label="Restart"><svg viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z" fill="#fff"/></svg></button>Restart</div>
  <a class="lbtn" href="../home/" id="btnHomePause"><span class="rb"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z" fill="#fff"/></svg></span>Home</a>
  <div class="lbtn"><button class="rb" id="btnSetPause" aria-label="Settings"><svg viewBox="0 0 24 24"><path fill="#fff" d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.6 7.6 0 0 0-1.7-1L15 3h-4l-.4 2.9a7.6 7.6 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.5 7.5 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.6 7.6 0 0 0 1.7 1L11 21h4l.4-2.9a7.6 7.6 0 0 0 1.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg></button>Settings</div>
 </div></div></div>

<div class="layer panel" id="finish"><div class="card">
 <h2 id="finTitle">1<sup>st</sup> place!</h2><div class="sub" id="finSub">You beat Pip!</div>
 <div class="stats"><span>Time <b id="finTime">0:00.0</b></span><span>Best lap <b id="finBest">0:00.0</b></span></div>
 <div class="row">
  <button class="big" id="btnAgain"><svg viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z" fill="#2b1055"/></svg>Race again</button>
  <a class="lbtn" href="../home/" id="btnHomeFinish"><span class="rb"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z" fill="#fff"/></svg></span>Home</a>
  <div class="lbtn"><button class="rb" id="btnSetFinish" aria-label="Settings"><svg viewBox="0 0 24 24"><path fill="#fff" d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.6 7.6 0 0 0-1.7-1L15 3h-4l-.4 2.9a7.6 7.6 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.5 7.5 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.6 7.6 0 0 0 1.7 1L11 21h4l.4-2.9a7.6 7.6 0 0 0 1.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg></button>Settings</div>
 </div></div></div>

<div class="layer panel" id="settings" style="z-index:7"><div class="card">
 <h2>Settings</h2>
 <div class="setgrid">
  <button class="tg" id="tSound"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#fff"/><path class="onl" d="M16 8a5 5 0 0 1 0 8M18.5 5.5a8.5 8.5 0 0 1 0 13" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg>Sound</button>
  <button class="tg" id="tVoice"><svg viewBox="0 0 24 24"><circle cx="10" cy="8" r="4" fill="#fff"/><path d="M3 21a7 7 0 0 1 14 0z" fill="#fff"/><path class="onl" d="M18 6a4 4 0 0 1 0 6M20.5 3.5a7.5 7.5 0 0 1 0 11" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg>Voice</button>
  <div class="lbl">Look</div>
  <div class="seg"><button class="tg" id="q_auto">Auto</button><button class="tg" id="q_high">Shiny</button><button class="tg" id="q_low">Smooth</button></div>
  <button class="tg" id="tFps"><svg viewBox="0 0 24 24"><path d="M3 18a9 9 0 0 1 18 0" stroke="#fff" stroke-width="2.4" fill="none"/><path d="M12 18l5-6" stroke="#7dff6a" stroke-width="2.6" stroke-linecap="round"/></svg>FPS meter</button>
  <button class="big" id="btnSetClose" style="font-size:clamp(20px,calc(var(--u)*5),30px);min-height:60px"><svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10" stroke="#2b1055" stroke-width="3.4" fill="none" stroke-linecap="round"/></svg>Done</button>
 </div></div></div>

<div class="layer panel" id="rotate"><svg viewBox="0 0 100 100"><rect x="30" y="14" width="40" height="72" rx="8" fill="none" stroke="#35f2ff" stroke-width="6"/><path d="M80 40a30 30 0 0 1-10 34" fill="none" stroke="#ff3fd8" stroke-width="6"/><path d="M64 70l8 6 2-10z" fill="#ff3fd8"/></svg>Turn your phone sideways!</div>
<div id="fps"></div>
<script type="module" src="game.js"></script>
</body></html>
