.steer{pointer-events:auto;bottom:max(12px,env(safe-area-inset-bottom));width:clamp(84px,calc(var(--u)*22),132px);height:clamp(84px,calc(var(--u)*22),132px);border-radius:30px;background:rgba(255,255,255,.12);border:3px solid rgba(255,255,255,.55);display:grid;place-items:center;touch-action:none}

#steerL{left:max(14px,env(safe-area-inset-left))}#steerR{right:max(14px,env(safe-area-inset-right))}
.item{right:calc(max(14px,env(safe-area-inset-right)) + clamp(84px,calc(var(--u)*22),132px) + 22px);bottom:calc(max(12px,env(safe-area-inset-bottom)) + 10px);width:clamp(64px,calc(var(--u)*15),92px);height:clamp(64px,calc(var(--u)*15),92px);transform:rotate(45deg);border-radius:18px;background:rgba(80,60,20,.5);border:4px dashed rgba(255,225,77,.7);display:grid;place-items:center}

.pop{left:50%;top:20%;transform:translateX(-50%) rotate(-3deg) scale(.6);opacity:0;font-size:clamp(26px,calc(var(--u)*8),44px);font-weight:900;white-space:nowrap;padding:4px 22px;border-radius:24px;background:linear-gradient(90deg,#ff3fd8,#8a5cff);box-shadow:0 0 20px #ff3fd8;transition:transform .25s cubic-bezier(.3,1.6,.5,1),opacity .2s}

.tap{left:50%;top:38%;transform:translate(-50%,-50%) scale(.5);opacity:0;font-size:clamp(48px,calc(var(--u)*16),110px);font-weight:900;color:#ffe14d;text-shadow:0 0 18px #ff9a00,0 6px 0 #7a3a00;transition:.15s}

@keyframes pulse{from{transform:translate(-50%,-50%) scale(1.8);opacity:.2}30%{opacity:1}to{transform:translate(-50%,-50%) scale(1)}}
.toast{left:50%;bottom:30%;transform:translateX(-50%);padding:6px 18px;border-radius:16px;background:rgba(20,8,40,.8);font-size:20px;font-weight:800;opacity:0;transition:.3s}.toast.show{opacity:1}
/* panels */
.panel{z-index:5;display:none;align-items:center;justify-content:center;background:rgba(16,6,34,.72);backdrop-filter:blur(3px);padding:max(10px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));overflow:auto}

.lbtn .rb{width:clamp(64px,calc(var(--u)*15),88px);height:clamp(64px,calc(var(--u)*15),88px)}
.stats{display:flex;gap:22px;font-size:clamp(18px,calc(var(--u)*4.4),26px);font-weight:800}
.stats b{color:#35f2ff}
.setgrid{display:grid;grid-template-columns:repeat(2,minmax(0,auto));gap:clamp(8px,calc(var(--u)*2.4),18px) clamp(12px,calc(var(--u)*4),28px);align-items:center}

.seg{display:flex;gap:6px}.seg .tg{min-width:0;padding:8px 12px}

/* B:css (Track B adds HUD/item styles below) */
.portraits{gap:3px}
