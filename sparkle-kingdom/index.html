<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#ff5fae"><title>Sparkle Kingdom</title>
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon-192.png">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:"Baloo 2","Comic Sans MS","Trebuchet MS",system-ui,sans-serif;color:#fff;background:#ffb6dc;user-select:none;-webkit-user-select:none;touch-action:none}
#app{position:fixed;inset:0;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
[hidden]{display:none!important}
button,a.rb{font:inherit;cursor:pointer;border:3px solid #fff;color:#fff;touch-action:manipulation}
.rb{display:grid;place-items:center;width:var(--b,52px);height:var(--b,52px);border-radius:50%;background:linear-gradient(145deg,#ff8fd0,#d6339f);box-shadow:0 3px 0 rgba(120,0,90,.55),0 6px 12px rgba(80,0,70,.3);text-decoration:none;flex:none;padding:0}
.rb.si{background:linear-gradient(145deg,#fff,#d8d8e8);border-color:#e9e9f5;box-shadow:0 3px 0 #9a8fb0}
.rb:active{transform:scale(.92)}
.rb svg{width:62%;height:62%;display:block}
html.fz-big .rb{--b:64px}
/* ---- in-level HUD ---- */
#hud{position:absolute;inset:0;pointer-events:none;padding:max(8px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) 0 max(10px,env(safe-area-inset-left))}
#hud .row{display:flex;align-items:center;gap:10px;justify-content:space-between}
html.fz-lefty #hud .row{flex-direction:row-reverse}
.plate{display:flex;align-items:center;gap:6px;background:rgba(120,0,100,.35);border:2px solid rgba(255,255,255,.7);border-radius:99px;padding:3px 10px;font-size:clamp(18px,3.2vmin,26px);font-weight:900;text-shadow:0 2px 0 rgba(90,0,70,.5)}
#hearts{display:flex;gap:2px}#hearts i,.plate .ic{display:block;width:clamp(24px,4.4vmin,34px);aspect-ratio:1}
#hearts i svg,.plate .ic svg{width:100%;height:100%;display:block}
#hearts i.off{opacity:.45;transform:scale(.85)}
#hud .rb{pointer-events:auto}
#hud .row2{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:6px}
#crowns{gap:2px;padding:2px 8px}#crowns i,#resCrowns i{display:block;width:clamp(20px,3.6vmin,28px);aspect-ratio:1}#crowns svg,#resCrowns svg{width:100%;height:100%;display:block}
#resCrowns i{width:clamp(26px,5vmin,40px)}
#gemPlate{transform-origin:50% 50%}
#prog{position:relative;height:10px;width:min(40vw,300px);border-radius:9px;background:rgba(255,255,255,.45);border:2px solid rgba(255,255,255,.8)}
#progDot{position:absolute;top:50%;left:0;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;background:#a8ff9e;border:3px solid #2f9a55}
/* ---- big hint ---- */
#hint{position:absolute;left:50%;bottom:14%;transform:translateX(-50%);pointer-events:none;text-align:center}
#hint .h{display:block;width:clamp(90px,16vmin,140px);margin:0 auto;animation:tap 1.1s ease-in-out infinite}#hint .h svg{width:100%;display:block}
@keyframes tap{0%,100%{transform:scale(1)}40%{transform:scale(.84)}}
html.fz-calm #hint .h{animation:none}
@media (prefers-reduced-motion:reduce){#hint .h{animation:none}}
/* ---- level banner + heart wipe ---- */
#banner{position:absolute;left:50%;top:32%;transform:translate(-50%,-50%);pointer-events:none;width:clamp(96px,22vmin,170px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;
background:radial-gradient(circle at 35% 30%,#fff,#ffd1ec 55%,#ff8fd0);border:5px solid #f5c542;box-shadow:0 0 0 6px rgba(255,255,255,.55),0 10px 24px rgba(120,0,90,.35)}
#banner span{display:block;width:68%}#banner svg{width:100%;display:block}
#banner.go{animation:bannerIn 2.3s cubic-bezier(.2,1.4,.4,1) both}
@keyframes bannerIn{0%{transform:translate(-50%,-50%) scale(0) rotate(-30deg);opacity:0}18%{transform:translate(-50%,-50%) scale(1.08) rotate(4deg);opacity:1}28%{transform:translate(-50%,-50%) scale(1) rotate(0)}80%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-62%) scale(.9)}}
html.fz-calm #banner.go{animation:fadeIO 2.3s both}@media (prefers-reduced-motion:reduce){#banner.go{animation:fadeIO 2.3s both}}
@keyframes fadeIO{0%,100%{opacity:0}15%,80%{opacity:1}}
#wipe{position:absolute;inset:0;z-index:20;pointer-events:none;display:grid;place-items:center;overflow:hidden}
#wipe svg{width:40px;height:40px;transform:scale(0)}
#wipe.in svg{animation:wipeIn .38s cubic-bezier(.5,0,.8,.6) both}#wipe.out{animation:wipeOut .4s ease-out both}#wipe.out svg{transform:scale(60)}
@keyframes wipeIn{to{transform:scale(60)}}@keyframes wipeOut{to{opacity:0}}
html.fz-calm #wipe.in svg{animation-duration:.15s}@media (prefers-reduced-motion:reduce){#wipe.in svg{animation-duration:.15s}}
/* ---- map ---- */
#map{position:absolute;inset:0;display:flex;flex-direction:column;padding:max(8px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));gap:6px}
#map .top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex:none}
h1{flex:1;min-width:0;text-align:center;font-size:clamp(22px,5.4vmin,46px);line-height:1;letter-spacing:1px;white-space:nowrap;
background:linear-gradient(90deg,#fff6c4,#f5c542,#fff,#e8e8f2,#f5c542,#fff6c4);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s linear infinite;filter:drop-shadow(0 2px 0 #b0106e) drop-shadow(0 0 6px rgba(255,255,255,.5))}
@keyframes shine{to{background-position:300% 0}}
html.fz-calm h1{animation:none}@media (prefers-reduced-motion:reduce){h1{animation:none}}
#map .mid{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(4px,2vmin,18px)}
#hero{height:clamp(70px,24vmin,230px);width:auto;max-width:60vw;object-fit:contain;filter:drop-shadow(0 4px 0 rgba(150,0,110,.35));animation:bob 3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
html.fz-calm #hero{animation:none}@media (prefers-reduced-motion:reduce){#hero{animation:none}}
#nodes{display:flex;flex-wrap:wrap;gap:clamp(14px,3vmin,22px) clamp(6px,1.6vmin,16px);align-items:flex-end;justify-content:center;width:100%;padding-top:26px}
.node{position:relative;flex:0 1 auto;width:clamp(64px,min(27vw,24vh),130px);aspect-ratio:1/1.25;border-radius:26%;border:4px solid transparent;background:linear-gradient(160deg,#ffd9ee,#ff8acb) padding-box,linear-gradient(135deg,#fff8d0,#f5c542,#fff,#c0c0d0,#f5c542) border-box;box-shadow:0 5px 0 rgba(120,0,90,.45);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;color:#fff}
.node.boss{background:linear-gradient(160deg,#eef0f8,#a9afc8) padding-box,linear-gradient(135deg,#fff8d0,#f5c542,#fff,#c0c0d0,#f5c542) border-box}
.node.lock{filter:saturate(.4) brightness(.9)}
.node .ni{display:block;width:70%;aspect-ratio:1}.node .ni svg{width:100%;height:100%;display:block}
.node.lock .ni{opacity:.35}.node .nl{position:absolute;inset:auto 0 8% 0;display:grid;place-items:center}.node .nl svg{width:40%}
.node .ns{display:flex;gap:1px;width:80%;justify-content:center;margin-top:2px}.node .ns i{width:30%;display:block}.node .ns svg{width:100%;display:block}
.node .me{position:absolute;left:50%;bottom:100%;width:80%;transform:translateX(-50%);margin-bottom:-6px;animation:bob 1.6s ease-in-out infinite;pointer-events:none}
html.fz-calm .node .me{animation:none}
.node .nc{position:absolute;top:5%;right:5%;display:flex;flex-direction:column;gap:1px;padding:2px;border-radius:10px;background:rgba(160,30,120,.25)}.node .nc i{display:block;width:clamp(13px,2.6vmin,20px);aspect-ratio:1}.node .nc svg{width:100%;height:100%;display:block}
.node.cur{animation:glowN 1.8s ease-in-out infinite}@keyframes glowN{0%,100%{box-shadow:0 5px 0 rgba(120,0,90,.45),0 0 0 0 rgba(255,255,255,0)}50%{box-shadow:0 5px 0 rgba(120,0,90,.45),0 0 18px 6px rgba(255,246,196,.9)}}
html.fz-calm .node.cur{animation:none}@media (prefers-reduced-motion:reduce){.node.cur,.node .me{animation:none}}
#stkBar i.gold{box-shadow:0 0 0 3px #ffd84a,0 0 10px 3px rgba(255,216,74,.8)}#resStk.gold svg{filter:drop-shadow(0 0 6px #ffd84a) drop-shadow(0 0 2px #ffd84a)}
.node:active:not(:disabled){transform:scale(.94)}
#map .bot{display:flex;align-items:center;justify-content:center;gap:clamp(8px,2vmin,22px);flex:none;flex-wrap:nowrap}
#stkBar{display:flex;gap:4px}#stkBar i{display:block;width:clamp(30px,6vmin,46px);aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.28);border:2px dashed rgba(255,255,255,.7)}
#stkBar i.on{border:none;background:none}#stkBar i svg{width:100%;height:100%;display:block}
.plate .ic.pl{width:clamp(26px,4.6vmin,36px)}
/* ---- pause + results ---- */
.ov{position:absolute;inset:0;display:grid;place-items:center;background:rgba(80,0,70,.55);padding:12px}
.panel{display:flex;flex-direction:column;align-items:center;gap:clamp(8px,2.4vmin,18px);padding:clamp(12px,3vmin,26px);border-radius:28px;border:4px solid #f5c542;background:linear-gradient(160deg,#ff9ed6cc,#a64fd6cc);box-shadow:0 8px 0 rgba(80,0,70,.4);max-width:92vw;max-height:94vh}
.btns{display:flex;gap:clamp(10px,2.4vmin,22px)}
.btns .rb{--b:clamp(60px,12vmin,96px)}
html.fz-big .btns .rb{--b:clamp(72px,14vmin,110px)}
#resStars{display:flex;gap:6px}#resStars i{width:clamp(50px,11vmin,90px);display:block;transform:scale(.7);opacity:.35}#resStars i svg{width:100%;display:block}
#resStars i.on{opacity:1;animation:starIn .5s ease-out both}
@keyframes starIn{0%{transform:scale(.2) rotate(-40deg)}70%{transform:scale(1.25) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
html.fz-calm #resStars i.on{animation:none;transform:none}@media (prefers-reduced-motion:reduce){#resStars i.on{animation:none;transform:none}}
.resRow{display:flex;align-items:center;gap:14px}
#resStk{width:clamp(56px,12vmin,90px);display:block}#resStk svg{width:100%;display:block}
@media (max-height:520px){.panel{flex-direction:row;flex-wrap:wrap;justify-content:center;gap:8px 16px}#hero{height:clamp(60px,26vh,120px)}}
/* ---- v4: labeled Home / Next / Map / Settings buttons + Settings panel ---- */
.lb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:clamp(76px,15vmin,110px);min-height:clamp(64px,12vmin,92px);padding:6px 10px;border-radius:22px;background:linear-gradient(145deg,#ff8fd0,#d6339f);box-shadow:0 3px 0 rgba(120,0,90,.55),0 6px 12px rgba(80,0,70,.3);text-decoration:none;flex:none;font-weight:900;font-size:clamp(15px,2.8vmin,20px);line-height:1;text-shadow:0 2px 0 rgba(90,0,70,.5)}
.lb.si{background:linear-gradient(145deg,#fff,#d8d8e8);border-color:#e9e9f5;box-shadow:0 3px 0 #9a8fb0;color:#a0207a;text-shadow:none}
.lb:active{transform:scale(.92)}.lb svg{width:clamp(28px,5.6vmin,44px);height:clamp(28px,5.6vmin,44px);display:block}
.nav{display:flex;gap:clamp(8px,2vmin,18px);flex-wrap:wrap;justify-content:center}
#setM{z-index:15}#setM .panel{min-width:min(340px,88vw)}
.srow{display:flex;align-items:center;gap:12px;font-weight:900;font-size:clamp(18px,3.4vmin,26px)}
.srow .ic{width:40px;height:40px;display:block}.srow .ic svg{width:100%;height:100%}
#volBar{display:flex;gap:4px}#volBar i{display:block;width:clamp(16px,3.4vmin,24px);height:clamp(22px,4.4vmin,32px);border-radius:6px;background:rgba(255,255,255,.3);border:2px solid #fff}#volBar i.on{background:#ffe37a}
.tg{min-width:96px;min-height:52px;border-radius:99px;background:#9a8fb0;font-weight:900;font-size:18px}.tg.on{background:#2fbf6b}
.sb{width:52px;height:52px;border-radius:50%;background:linear-gradient(145deg,#fff,#d8d8e8);color:#a0207a;font-weight:900;font-size:30px;line-height:1}
@media (max-height:520px){.lb{min-height:56px;min-width:72px}.srow{font-size:18px}}
</style></head><body>
<div id="app">
<canvas id="cv"></canvas>
<div id="hud" hidden>
 <div class="row"><div class="plate" id="hearts" aria-label="Hearts"></div><div class="plate" id="gemPlate" aria-label="Gems"><span class="ic" id="gemIc"></span><span id="gemc">0</span></div><button class="rb si" id="bPause" aria-label="Pause"></button></div>
 <div class="row2"><div id="prog"><div id="progDot"></div></div><div class="plate" id="crowns" aria-label="Crowns"></div></div>
</div>
<div id="hint" hidden><span class="h" id="hintTap"></span></div>
<div id="banner" hidden></div>
<section id="map">
 <div class="top"><a class="rb si" id="bHome" href="../home/" aria-label="Home"></a><h1>Sparkle Kingdom</h1><button class="rb si" id="bMute" aria-label="Sound"></button><button class="rb si" id="bSet" aria-label="Settings"></button></div>
 <div class="mid"><img id="hero" alt="Glimmer"><div id="nodes"></div></div>
 <div class="bot"><div class="plate" aria-label="Gems"><span class="ic" id="gemIc2"></span><span id="gemTotal">0</span></div><div id="stkBar" aria-label="My stickers"></div><div class="plate" aria-label="Sky Glider stickers"><span class="ic pl" id="skIc"></span><span id="skN">0</span></div></div>
</section>
<section class="ov" id="pauseM" hidden><div class="panel"><div class="btns"><button class="rb" id="bResume" aria-label="Keep playing"></button><button class="rb si" id="bRestart" aria-label="Start again"></button><button class="rb si" id="bMap" aria-label="Map"></button></div><div class="nav"><a class="lb si" id="pHome" href="../home/" aria-label="Home"></a><button class="lb si" id="pSet" aria-label="Settings"></button></div></div></section>
<section class="ov" id="resM" hidden><div class="panel"><div id="resStars"></div><div class="resRow"><div class="plate"><span class="ic" id="gemIc3"></span><span id="resGems">0</span></div><div class="plate" id="resCrowns" aria-label="Crowns"></div><div id="resStk" hidden></div></div><div class="btns"><button class="rb" id="bNext" aria-label="Next level"></button><button class="rb si" id="bAgain" aria-label="Play again"></button><button class="rb si" id="bMap2" aria-label="Map"></button></div><div class="nav"><a class="lb si" id="rHome" href="../home/" aria-label="Home"></a><button class="lb" id="rGo" aria-label="Next level"></button><button class="lb si" id="rSet" aria-label="Settings"></button></div></div></section>
<section class="ov" id="setM" hidden><div class="panel" role="dialog" aria-label="Settings"><div class="srow"><span class="ic" id="sVolIc"></span><button class="sb" id="sDown" aria-label="Quieter">&minus;</button><div id="volBar"><i></i><i></i><i></i><i></i></div><button class="sb" id="sUp" aria-label="Louder">+</button></div><div class="srow"><span>Music</span><button class="tg" id="sMus" aria-label="Music"></button></div><div class="srow"><span>Voice</span><button class="tg" id="sVoice" aria-label="Voice"></button></div><button class="lb" id="sDone" aria-label="Done"></button></div></section>
<div id="wipe" hidden><svg viewBox="0 0 100 100" aria-hidden="true"><path d="M50 88 C10 58 12 22 34 20 C44 19 50 28 50 34 C50 28 56 19 66 20 C88 22 90 58 50 88Z" fill="#ff8fd0" stroke="#fff" stroke-width="3"/></svg></div>
</div>
<script src="funzone.js"></script>
<script src="save.js"></script>
<script src="art.js"></script>
<script src="levels.js"></script>
<script src="audio.js"></script>
<script src="game.js"></script>
<script>
if('serviceWorker' in navigator){addEventListener('load',()=>{
 const had=!!navigator.serviceWorker.controller;let reloaded=false;
 navigator.serviceWorker.register('./sw.js').catch(()=>{});
 // one guarded reload when a new version takes over, only from the map (never mid-level)
 navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!had||reloaded)return;
  const go=()=>{if(window.SKTest&&(SKTest.state==='map')){if(Date.now()-(+sessionStorage.getItem('sk.swr')||0)<30000)return;try{sessionStorage.setItem('sk.swr',Date.now());}catch(e){}reloaded=true;location.reload();}else setTimeout(go,1500);};go();});
});}
</script>
</body></html>
