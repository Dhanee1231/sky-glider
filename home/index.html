<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}

border:4px solid transparent;background:var(--bg) padding-box,linear-gradient(135deg,#fff8d0,#f5c542,#fff,#c0c0d0,#f5c542) border-box;

a.card.pop{animation:pop .35s ease}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(.9)}100%{transform:scale(1.06)}}

<script>
(()=>{
const LS={get:(k,d)=>{try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const nm=document.getElementById('nm'),dlg=document.getElementById('dlg'),inp=document.getElementById('nmIn'),mute=document.getElementById('mute');
let name=LS.get('funzone-name','Superstar');nm.textContent=name;
let muted=LS.get('funzone-muted','0')==='1';const setM=()=>mute.textContent=muted?'🔇':'🔊';setM();
let ac=null;
function chime(){if(muted)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const t=ac.currentTime;
[880,1320,1760].forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,t+i*.06);g.gain.linearRampToValueAtTime(.12,t+i*.06+.01);g.gain.exponentialRampToValueAtTime(.0005,t+i*.06+.35);o.connect(g).connect(ac.destination);o.start(t+i*.06);o.stop(t+i*.06+.4);});}catch(e){}}

document.getElementById('cancel').onclick=close;inp.onkeydown=e=>{if(e.key==='Enter')document.getElementById('ok').click()};

const fsb=document.getElementById('fs'),de=document.documentElement,isFS=()=>!!(document.fullscreenElement||document.webkitFullscreenElement);

 IC_OUT='<svg viewBox="0 0 24 24" fill="none" stroke="#7a1066" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>';

if(canFS){fsb.hidden=false;fsIcon();
 fsb.onclick=()=>{const on=!isFS();LS.set('funzone-fs',on?'1':'0');fsGo(on);chime();setTimeout(fsIcon,300);};
 ['fullscreenchange','webkitfullscreenchange'].forEach(n=>document.addEventListener(n,()=>{if(!isFS()&&!leaving)LS.set('funzone-fs','0');fsIcon();}));
 let tried=false;const back=e=>{if(tried||e.target.closest('a.card,#fs,dialog'))return;tried=true;if(fsWant()&&!isFS())fsGo(true);};
 ['pointerup','touchend','click'].forEach(n=>document.addEventListener(n,back,true));}

const c=document.getElementById('sky'),x=c.getContext('2d');let W,H,D,P=[],B=[];

const cols=['#fff','#fff3a8','#f5c542','#ffd1ec','#e8e8f5'];
for(let i=0;i<40;i++)P.push({x:Math.random(),y:Math.random(),s:2+Math.random()*4,p:Math.random()*6.28,v:.3+Math.random()*.7,c:cols[i%5],h:i%7===0});

x.globalAlpha=1}
let raf=0,last=0;
function f(t){raf=0;if(document.hidden)return;
 if(t-last>=32){const dt=last?Math.min(.1,(t-last)/1000):0;last=t;draw(t/1000,dt);}
 if(!red||B.length)raf=requestAnimationFrame(f);}
function kick(){if(!raf&&!document.hidden){last=0;raf=requestAnimationFrame(f);}}
rs();addEventListener('resize',rs);
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(raf)cancelAnimationFrame(raf);raf=0;}else kick();});
if(red)draw(0);else kick();
// ask the browser to keep this site's saves (all apps share it) even when storage runs low (v3)
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persisted().then(p=>p||navigator.storage.persist()).catch(()=>{});}catch(e){}
// ---------- treasure shelf: READ-ONLY view of each game's records store (never written here) ----------
const J=k=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}};
const isO=v=>!!v&&typeof v==='object'&&!Array.isArray(v);
const NF=new Intl.NumberFormat('en-US');
const GAMES=[{id:'SG',key:'skyglider.records.v1',name:'Sky Glider',best:b=>b.n+' · '+(b.st|0)+' ⭐'},
 {id:'CC',key:'crystalcave.records.v1',name:'Crystal Cave',best:b=>b.n+' · '+(b.s|0)+'%'},
 {id:'GT',key:'gemtiles.records.v1',name:'Gem Tiles',best:b=>b.n+' · '+NF.format(b.s|0)}];
function recInfo(g){const d=J(g.key),o={cups:0,stars:0,best:null};if(!isO(d))return o;
 if(isO(d.top))for(const k in d.top){const l=d.top[k];if(Array.isArray(l)&&isO(l[0])){o.cups++;o.stars+=Math.max(0,Math.min(3,l[0].st|0));}}
 if(isO(d.best))o.best=d.best;return o;}
const esc=t=>String(t).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
function learnInfo(){try{return window.FunLearn?FunLearn.summary():null}catch(e){return null}}
function shelf(){for(const g of GAMES){const i=recInfo(g),el=document.getElementById('p'+g.id);
  el.querySelector('.a').textContent='🏆 '+i.cups;el.querySelector('.b').textContent='⭐ '+i.stars;el.classList.toggle('dim',!i.cups);}
 const L=learnInfo(),el=document.getElementById('pLN');el.querySelector('.a').textContent=String(L?L.mastered.length:0);el.classList.toggle('dim',!(L&&L.mastered.length));}
shelf();addEventListener('pageshow',shelf);document.addEventListener('visibilitychange',()=>{if(!document.hidden)shelf();});
const tdlg=document.getElementById('tdlg'),show=d=>{d.showModal?d.showModal():d.setAttribute('open','')},hide=d=>{d.close?d.close():d.removeAttribute('open')};
function openShelf(){let h='';for(const g of GAMES){const i=recInfo(g),ic=document.getElementById('p'+g.id).querySelector('svg').outerHTML;
  h+='<div class="trow">'+ic+'<div><b>🏆 '+i.cups+' &nbsp; ⭐ '+i.stars+'</b><small>'+esc(g.name)+(i.best?' · Best: '+esc(g.best(i.best)):'')+'</small></div></div>';}
 const L=learnInfo();h+='<div class="trow">'+document.getElementById('pLN').querySelector('svg').outerHTML+'<div><b>✔ '+(L?L.mastered.length:0)+'</b><small>Things I know by heart</small></div></div>';
 document.getElementById('tlist').innerHTML=h;show(tdlg);chime();}
document.querySelectorAll('.plq').forEach(b=>b.addEventListener('click',e=>{burst(e.clientX,e.clientY);openShelf();}));
document.getElementById('tok').onclick=()=>hide(tdlg);
// ---------- grown-ups: hold the gear 3 s, then a 2-digit × 2-digit question ----------
const gear=document.getElementById('gear'),gdlg=document.getElementById('gdlg'),gb=document.getElementById('gbody');let hT=0;
const hEnd=()=>{clearTimeout(hT);gear.classList.remove('hold');};
gear.addEventListener('pointerdown',e=>{e.preventDefault();gear.classList.add('hold');hT=setTimeout(()=>{hEnd();gate();},3000);});
['pointerup','pointercancel','pointerleave'].forEach(n=>gear.addEventListener(n,hEnd));
gear.addEventListener('contextmenu',e=>e.preventDefault());
function gate(){const a=12+Math.floor(Math.random()*17),b=12+Math.floor(Math.random()*17);
 gb.innerHTML='<p style="text-align:center">For grown-ups: what is '+a+' × '+b+'?</p><input id="gans" inputmode="numeric" maxlength="4" autocomplete="off"><div class="row"><button id="gok">OK</button><button id="gno" style="background:#c0c0d0">Cancel</button></div>';
 show(gdlg);const inp=document.getElementById('gans');setTimeout(()=>inp.focus(),50);
 const ok=()=>{if(+inp.value===a*b)grown();else hide(gdlg);};document.getElementById('gok').onclick=ok;inp.onkeydown=e=>{if(e.key==='Enter')ok()};document.getElementById('gno').onclick=()=>hide(gdlg);}
function lname(k){const m=/^(mul|add|sub|div):(.*)$/.exec(k);if(!m)return k.replace(':',' ');return m[2].replace('x','×').replace('/','÷');}
async function grown(msg){let per='unknown';try{if(navigator.storage&&navigator.storage.persisted)per=(await navigator.storage.persisted())?'yes':'not yet (the browser decides; it usually agrees once the app is used often or installed)';}catch(e){}
 const L=learnInfo();
 gb.innerHTML=(msg?'<p style="text-align:center;font-weight:800">'+msg+'</p>':'')+
 '<p><b>Family backup</b>: one file with every game save on this phone (Sky Glider, Crystal Cave, Gem Tiles with custom songs, the hub, records and the learning record). Keep it somewhere safe.</p>'+
 '<div class="row"><button id="bExp">💾 Save backup file</button><button id="bImp">📂 Restore from file</button></div>'+
 '<p style="font-size:13px">Restoring only <b>adds</b>: anything missing comes back, counts keep the larger number, and nothing on this phone is deleted. Each changed save is first copied to <code>&lt;key&gt;.pre-restore</code>.</p>'+
 '<p>Saves protected from automatic clean-up: <b>'+per+'</b></p>'+
 (L?'<p><b>Learning record</b>: '+L.practised+' things practised on '+L.days+' days.</p><p class="lst">✔ Mastered ('+L.mastered.length+'): '+esc(L.mastered.slice(0,60).map(lname).join(', ')||'none yet')+'</p><p class="lst">💭 Still tricky ('+L.tricky.length+'): '+esc(L.tricky.slice(0,60).map(lname).join(', ')||'none')+'</p>':'')+
 '<div class="row foot"><button id="bClose" style="background:#c0c0d0">Close</button></div>';
 if(!gdlg.open)show(gdlg);
 document.getElementById('bClose').onclick=()=>hide(gdlg);
 document.getElementById('bExp').onclick=()=>exportAll().then(n=>grown('Backup saved ✔ ('+n+')')).catch(e=>grown('Backup failed: '+esc(e&&e.message||e)));
 document.getElementById('bImp').onclick=()=>{const f=document.getElementById('rfile');f.value='';f.click();};}
document.getElementById('rfile').onchange=e=>{const f=e.target.files&&e.target.files[0];if(!f)return;
 f.text().then(t=>importAll(JSON.parse(t))).then(r=>grown('Restored ✔ '+r)).catch(err=>grown('Could not restore: '+esc(err&&err.message||err)));};
// --- backup format: {app:'funzone-backup',v:1,made,ls:{key:string},idb:{gemtiles:{songs:[…]}}}; typed arrays / blobs become tagged base64
const b64=buf=>{const u=new Uint8Array(buf);let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s);};
const unb64=s=>{const r=atob(s),u=new Uint8Array(r.length);for(let i=0;i<r.length;i++)u[i]=r.charCodeAt(i);return u.buffer;};
const TA=['Float32Array','Float64Array','Int8Array','Int16Array','Int32Array','Uint8Array','Uint16Array','Uint32Array','Uint8ClampedArray'];
async function enc(v){if(v instanceof Blob)return{__blob:v.type||'',b64:b64(await v.arrayBuffer())};
 if(v instanceof ArrayBuffer)return{__ab:1,b64:b64(v)};
 if(ArrayBuffer.isView(v)){const n=v.constructor.name;return{__ta:n,b64:b64(v.buffer.slice(v.byteOffset,v.byteOffset+v.byteLength))};}
 if(Array.isArray(v)){const o=[];for(const e of v)o.push(await enc(e));return o;}
 if(isO(v)){const o={};for(const k in v)o[k]=await enc(v[k]);return o;}return v;}
function dec(v){if(Array.isArray(v))return v.map(dec);if(!isO(v))return v;
 if(typeof v.__blob==='string'&&typeof v.b64==='string')return new Blob([unb64(v.b64)],{type:v.__blob});
 if(v.__ab&&typeof v.b64==='string')return unb64(v.b64);
 if(TA.includes(v.__ta)&&typeof v.b64==='string')return new self[v.__ta](unb64(v.b64));
 const o={};for(const k in v)o[k]=dec(v[k]);return o;}
// Gem Tiles' IndexedDB, opened exactly like Gem Tiles opens it (same name, version and store)
const gtDB=()=>new Promise((res,rej)=>{const r=indexedDB.open('gemtiles',1);r.onupgradeneeded=()=>r.result.createObjectStore('songs',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});
const idbAll=db=>new Promise((res,rej)=>{const q=db.transaction('songs','readonly').objectStore('songs').getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>rej(q.error);});
const idbHas=(db,id)=>new Promise(res=>{const q=db.transaction('songs','readonly').objectStore('songs').getKey(id);q.onsuccess=()=>res(q.result!==undefined);q.onerror=()=>res(true);});
const idbPut=(db,o)=>new Promise((res,rej)=>{const t=db.transaction('songs','readwrite');t.objectStore('songs').add(o);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);});
async function exportAll(){const ls={};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k!=null)ls[k]=localStorage.getItem(k);}
 let songs=[];try{if(window.indexedDB){const db=await gtDB();songs=await enc(await idbAll(db));db.close();}}catch(e){}
 const out={app:'funzone-backup',v:1,made:new Date().toISOString(),ls,idb:{gemtiles:{songs}}};
 const blob=new Blob([JSON.stringify(out)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');
 const d=new Date(),ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
 a.href=u;a.download='funzone-backup-'+ds+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),30000);
 const ns=Object.keys(ls).length;return ns+(ns===1?' save, ':' saves, ')+songs.length+(songs.length===1?' custom song':' custom songs');}
// additive merge of one save: missing fields are added, numbers keep the larger value, true wins, lists gain missing entries;
// choices (settings, difficulty, name, outfit…) always stay as they are on this phone
const KEEP=new Set(['v','set','settings','diff','muted','tilt','pad','name','lang','theme','active','eq','color','shape','pattern','trail','hat','decal','lastWorld','tut','sound','calm','fs','swr','parent','world','level']);
function mergeVal(a,b,k){if(a===undefined)return b;if(KEEP.has(k))return a;
 if(typeof a==='number'&&typeof b==='number')return Math.max(a,b);
 if(typeof a==='boolean'&&typeof b==='boolean')return a||b;
 if(Array.isArray(a)&&Array.isArray(b)){const seen=new Set(a.map(e=>JSON.stringify(e))),o=a.slice();for(const e of b)if(!seen.has(JSON.stringify(e)))o.push(e);return o;}
 if(isO(a)&&isO(b)){const o=Object.assign({},a);for(const kk in b)o[kk]=mergeVal(a[kk],b[kk],kk);return o;}
 return a;}
// records stores: past runs are combined; a podium only fills where this phone has none (so its order stays right)
function mergeRec(a,b){const o=Object.assign({},b,a);const seen=new Set((a.runs||[]).map(e=>JSON.stringify(e)));o.runs=(a.runs||[]).slice();
 for(const e of (b.runs||[]))if(!seen.has(JSON.stringify(e)))o.runs.push(e);o.runs.sort((x,y)=>(x.t||0)-(y.t||0));if(o.runs.length>200)o.runs=o.runs.slice(-200);
 o.top=Object.assign({},isO(b.top)?b.top:{},isO(a.top)?a.top:{});if(!isO(a.best))o.best=b.best;return o;}
async function importAll(d){if(!isO(d)||d.app!=='funzone-backup'||!isO(d.ls))throw new Error('this is not a Fun Zone backup file');
 let added=0,merged=0,same=0,songs=0;
 for(const k in d.ls){const bv=d.ls[k];if(typeof bv!=='string')continue;if(/\.(pre-restore|bad\d*)$/.test(k)&&localStorage.getItem(k)!=null)continue;
  const av=localStorage.getItem(k);
  if(av===null){try{localStorage.setItem(k,bv);added++;}catch(e){}continue;}
  if(av===bv||/^yogaCoach/.test(k)){same++;continue;}  // Coach Sunny's saves are only ever added back when missing, never merged
  if(k===(window.FunLearn&&FunLearn.KEY)){try{localStorage.setItem(k+'.pre-restore',av);}catch(e){}try{FunLearn.merge(JSON.parse(bv));merged++;}catch(e){}continue;}
  let A,B;try{A=JSON.parse(av);B=JSON.parse(bv);}catch(e){continue;}  // plain values (name, mute…) stay as they are here
  if(!isO(A)||!isO(B))continue;
  const out=/\.records\.v\d+$/.test(k)?mergeRec(A,B):k==='skyglider.ghost.v1'?Object.assign({},B,A,{g:Object.assign({},isO(B.g)?B.g:{},isO(A.g)?A.g:{})}):mergeVal(A,B,'');const s2=JSON.stringify(out);if(s2===av){same++;continue;}
  try{localStorage.setItem(k+'.pre-restore',av);localStorage.setItem(k,s2);merged++;}catch(e){}}
 const list=d.idb&&d.idb.gemtiles&&Array.isArray(d.idb.gemtiles.songs)?d.idb.gemtiles.songs:[];
 if(list.length&&window.indexedDB){const db=await gtDB();for(const s of list){if(!isO(s)||typeof s.id!=='string'&&typeof s.id!=='number')continue;
  if(await idbHas(db,s.id))continue;try{await idbPut(db,dec(s));songs++;}catch(e){}}db.close();}
 shelf();return added+' added, '+merged+' merged, '+same+' already here, '+songs+(songs===1?' song':' songs')+' added';}
if('serviceWorker' in navigator&&location.protocol!=='file:'){const sw=navigator.serviceWorker,had=!!sw.controller;
 // a new version: reload once (only if a worker already ran this page, never twice within 30 s)
 sw.addEventListener('controllerchange',()=>{if(!had)return;let t=0;try{t=+sessionStorage.getItem('fz.swr')||0;}catch(e){}if(Date.now()-t<30000)return;try{sessionStorage.setItem('fz.swr',String(Date.now()));}catch(e){}location.reload();});
 addEventListener('load',()=>sw.register('sw.js',{scope:'./'}).catch(()=>{}));}
})();
