<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2a1458">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Crystal Cave Quest - a sparkly times tables adventure for kids">
<title>Crystal Cave Quest</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
:root{--st:env(safe-area-inset-top,0px);--sr:env(safe-area-inset-right,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);
 --ink:#2b1257;--font:"Arial Rounded MT Bold","Nunito","Baloo 2","Comic Sans MS","Trebuchet MS",Roboto,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#2a1458;color:#fff;font-family:var(--font);
 -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
 touch-action:manipulation;overscroll-behavior:none;position:fixed;inset:0}
#bg{position:fixed;inset:0;z-index:0;overflow:hidden;
 background:radial-gradient(ellipse at 50% 115%,rgba(255,110,210,.45) 0,transparent 55%),
  radial-gradient(ellipse at 8% 0%,rgba(60,220,255,.32) 0,transparent 45%),
  radial-gradient(ellipse at 95% 10%,rgba(190,120,255,.35) 0,transparent 45%),
  linear-gradient(180deg,#25104f 0%,#3c1c7c 45%,#1f3f86 100%)}
#bg svg{position:absolute;pointer-events:none}
#bg .cl{bottom:-2px;width:min(46vmin,330px);height:min(46vmin,330px);filter:drop-shadow(0 0 10px rgba(255,170,255,.55))}
#bg .cl{transition:opacity .4s}body:not(.s-welcome) #bg .cl{opacity:.4}
#bg .cl.l{left:-14px}#bg .cl.r{right:-14px;transform:scaleX(-1)}
#bg .stal{top:0;left:0;width:100%;height:12vmin}
#fx{position:fixed;inset:0;pointer-events:none;z-index:60}
.screen{position:fixed;inset:0;z-index:5;display:none;flex-direction:column;
 padding:calc(var(--st) + 10px) calc(var(--sr) + 12px) calc(var(--sb) + 10px) calc(var(--sl) + 12px)}
.screen.on{display:flex;animation:fadeIn .35s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
button{font-family:inherit}
.btn{appearance:none;border:0;font-weight:900;color:#fff;min-height:60px;min-width:60px;border-radius:22px;padding:8px 20px;font-size:22px;
 --c1:#ff86cf;--c2:#e2409b;--sh:#a3226b;background:linear-gradient(var(--c1),var(--c2));
 box-shadow:0 6px 0 var(--sh),0 10px 18px rgba(0,0,0,.3),inset 0 3px 0 rgba(255,255,255,.45);
 text-shadow:0 2px 0 rgba(0,0,0,.25);cursor:pointer;position:relative;transition:transform .08s,box-shadow .08s,opacity .2s;
 display:inline-flex;align-items:center;justify-content:center;gap:8px;line-height:1.1;touch-action:manipulation}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--sh),0 4px 8px rgba(0,0,0,.3),inset 0 3px 0 rgba(255,255,255,.45)}
.btn.teal{--c1:#5ef0e6;--c2:#14a9bb;--sh:#0c6c7a}
.btn.gold{--c1:#ffe873;--c2:#ffad1a;--sh:#b56a00;color:#5a2a00;text-shadow:0 1px 0 rgba(255,255,255,.6)}
.btn.purple{--c1:#c29cff;--c2:#7a45e6;--sh:#4a2296}
.btn.blue{--c1:#7cc4ff;--c2:#3a7bf0;--sh:#1f4ca6}
.btn.green{--c1:#8cf27f;--c2:#29b85a;--sh:#167237}
.btn.gray{--c1:#b7b0d0;--c2:#857ca8;--sh:#565078}
.btn.red{--c1:#ff8a8a;--c2:#e2405a;--sh:#9c1f33}
.ibtn{width:60px;height:60px;padding:0;border-radius:50%;flex:none}
.ibtn svg{width:34px;height:34px;pointer-events:none}
.badge{position:absolute;top:-8px;right:-10px;min-width:30px;height:28px;border-radius:14px;background:#ff3d7a;border:3px solid #fff;
 font-size:15px;display:grid;place-items:center;padding:0 5px;color:#fff;text-shadow:none}
.bump{animation:bump .35s ease}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
.row{display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap}
h1,h2,h3{margin:0}
.panelTitle{font-size:clamp(22px,5vmin,36px);text-shadow:0 3px 0 var(--ink),0 0 18px rgba(255,180,255,.7);text-align:center;flex:1;min-width:0;line-height:1.05}
.topbar{display:flex;align-items:center;gap:10px;flex:none;min-height:64px}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;-webkit-overflow-scrolling:touch;padding:6px 4px 20px}
/* welcome */
#welcome .wTop{display:flex;justify-content:flex-end;gap:12px;flex:none}
.wMain{flex:1;display:flex;align-items:center;justify-content:center;gap:4vmin;min-height:0}
.wLantern{width:min(34vmin,230px);flex:none;animation:bob 3s ease-in-out infinite;filter:drop-shadow(0 0 28px #ffd84a) drop-shadow(0 0 60px rgba(255,200,80,.6))}
.wLantern svg{width:100%;height:auto;display:block}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-12px) rotate(3deg)}}
.wText{display:flex;flex-direction:column;align-items:center;gap:14px;max-width:520px}
.title{font-size:clamp(40px,10vmin,84px);line-height:.95;text-align:center;letter-spacing:1px}
.title span{display:inline-block;background:linear-gradient(180deg,#fff 0%,#ffe9ff 30%,#ff9ee6 60%,#a58bff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
 filter:drop-shadow(0 4px 0 var(--ink)) drop-shadow(0 0 14px rgba(255,160,255,.8));animation:shine 3s ease-in-out infinite}
.title span:nth-child(2){animation-delay:.3s;background-image:linear-gradient(180deg,#fff 0%,#d9fbff 30%,#6be7ff 65%,#6f8cff 100%)}
.title span:nth-child(3){animation-delay:.6s;background-image:linear-gradient(180deg,#fff 0%,#fff6c7 30%,#ffd34a 65%,#ff9a3d 100%)}
@keyframes shine{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.sub{margin:0;font-size:clamp(17px,3.6vmin,24px);text-align:center;text-shadow:0 2px 0 var(--ink)}
.nameBox{display:flex;flex-direction:column;gap:6px;align-items:center;font-size:17px;opacity:.95}
.nameBox input{font:inherit;font-size:22px;font-weight:900;min-height:60px;width:min(78vw,340px);border-radius:20px;border:4px solid #fff;
 background:rgba(255,255,255,.18);color:#fff;text-align:center;padding:6px 14px;outline:none;-webkit-user-select:text;user-select:text}
.nameBox input::placeholder{color:rgba(255,255,255,.65)}
.big{font-size:clamp(22px,5vmin,32px);min-height:72px;padding:10px 30px;border-radius:28px}
.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@media (min-aspect-ratio:1/1){.wMain{flex-direction:row}}
@media (max-aspect-ratio:1/1){.wMain{flex-direction:column}.wLantern{width:min(28vh,40vw,230px)}}
@media (max-height:460px){.title{font-size:clamp(34px,9vh,60px)}.wText{gap:8px}.big{min-height:62px}.nameBox input{min-height:56px}.sub{font-size:16px}.nameBox span{display:none}}
/* map */
#mapArea{position:relative;flex:1;overflow-y:auto;overflow-x:hidden;touch-action:pan-y}
#mapInner{position:relative;width:100%}
#mapInner svg.path{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.node{position:absolute;appearance:none;border:0;background:none;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;color:#fff}
.node .gemWrap{position:relative;display:grid;place-items:center;border-radius:50%;
 background:radial-gradient(circle,rgba(255,255,255,.3) 0,rgba(255,255,255,.08) 55%,transparent 70%)}
.node .gemWrap svg.gem{filter:drop-shadow(0 4px 0 rgba(30,10,70,.5))}
.node .tbl{position:absolute;font-size:var(--fs);font-weight:900;text-shadow:0 3px 0 var(--ink),0 0 6px var(--ink),0 0 2px var(--ink)}
.node .nm{font-size:15px;margin-top:2px;text-shadow:0 2px 0 var(--ink);white-space:nowrap}
.node .stars{display:flex;gap:2px;margin-top:2px}
.node .stars svg{width:20px;height:20px}
.node.locked .gemWrap{opacity:.8}
.node .lock{position:absolute;right:-4px;bottom:-2px;width:38%;height:38%}
.node .lock svg{width:100%;height:100%}
.node.cur .gemWrap{animation:nodePulse 1.3s ease-in-out infinite}
@keyframes nodePulse{0%,100%{box-shadow:0 0 24px 6px rgba(255,230,120,.6)}50%{box-shadow:0 0 0 8px rgba(255,255,255,.25),0 0 40px 14px rgba(255,230,120,.85)}}
.node.mast .gemWrap{box-shadow:0 0 0 5px #ffd84a,0 0 26px 6px rgba(255,216,74,.7)}
.node .crown{position:absolute;top:-14%;right:-14%;width:44%;transform:rotate(22deg)}
.node .crown svg{width:100%;height:auto}
.node .lanternMini{position:absolute;top:8%;left:-40%;width:40%;animation:bob 2.4s ease-in-out infinite;filter:drop-shadow(0 0 10px #ffd84a)}
.node .lanternMini svg{width:100%;height:auto}
.zoneTag{position:absolute;font-size:13px;padding:3px 10px;border-radius:12px;background:rgba(30,10,70,.6);border:2px solid rgba(255,255,255,.4);white-space:nowrap;transform:translateX(-50%);pointer-events:none}
.mapStats{display:flex;align-items:center;gap:6px;font-size:22px;font-weight:900;background:rgba(30,10,70,.45);border:3px solid rgba(255,255,255,.5);border-radius:30px;padding:2px 14px 2px 6px;text-shadow:0 2px 0 var(--ink);flex:none}
.mapStats svg{width:36px;height:36px}
#tunnelBtn{position:fixed;z-index:8;right:calc(var(--sr) + 14px);bottom:calc(var(--sb) + 14px)}
#tunnelBtn svg{width:40px;height:40px}
@media (max-width:480px){#map .panelTitle{display:none}}
.mapStats{margin-left:auto}
/* play */
.streak{flex:1;min-width:0;height:60px;display:flex;align-items:center;gap:6px;background:rgba(30,10,70,.5);border:3px solid rgba(255,255,255,.5);border-radius:30px;padding:0 10px 0 6px;transition:background .3s,border-color .3s,box-shadow .3s}
.streak .sIcon{width:40px;height:40px;flex:none}
.streak .sIcon svg,.streak .sNext svg{width:100%;height:100%;display:block}
.streak .sNum{font-size:28px;font-weight:900;text-shadow:0 2px 0 var(--ink);min-width:26px;text-align:center;line-height:1}
.streak .sLbl{font-size:12px;opacity:.9;line-height:1}
.streak .sBar{flex:1;min-width:20px;height:14px;border-radius:7px;background:rgba(255,255,255,.2);overflow:hidden;border:2px solid rgba(255,255,255,.5)}
.streak .sBar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff9ee6,#ffe873);border-radius:5px;transition:width .4s}
.streak .sNext{width:34px;height:40px;flex:none}
.streak.hot{background:rgba(255,160,40,.35);border-color:#ffe873;box-shadow:0 0 18px rgba(255,220,100,.7)}
.streak.rest{background:rgba(90,160,255,.45);border-color:#bfe2ff}
.main{flex:1;min-height:0;display:grid;gap:10px;margin-top:8px}
@media (min-aspect-ratio:1/1){.main{grid-template-columns:1.2fr 1fr;grid-template-rows:minmax(0,1fr)}}
@media (max-aspect-ratio:1/1){.main{grid-template-rows:minmax(0,1fr) auto}}
.stage{position:relative;min-height:0;min-width:0;border-radius:28px;overflow:hidden;
 background:radial-gradient(ellipse at 50% 45%,rgba(20,5,50,.85) 0,rgba(40,15,90,.55) 35%,rgba(70,30,140,.25) 70%,transparent 100%)}
.stageHead{position:absolute;top:4px;left:68px;right:68px;text-align:center;z-index:2}
.secName{font-size:17px;font-weight:900;text-shadow:0 2px 0 var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{display:flex;gap:5px;justify-content:center;margin-top:4px;flex-wrap:wrap}
.dots i{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.25);border:2px solid rgba(255,255,255,.6)}
.dots i.done{background:#ffe873;border-color:#fff}
.dots i.now{background:#ff86cf;border-color:#fff;transform:scale(1.3)}
.dots i.boss{border-radius:3px;transform:rotate(45deg);background:rgba(255,120,200,.35)}
.dots i.boss.now{background:#ff86cf;transform:rotate(45deg) scale(1.3)}
.doorBox{position:absolute;left:0;right:0;top:56px;bottom:4px;display:grid;place-items:center}
.door{position:relative;transform-origin:50% 90%}
.door svg.dsvg{width:100%;height:100%;display:block;overflow:visible}
.door .q{position:absolute;left:0;right:0;top:44%;transform:translateY(-50%);text-align:center;font-weight:900;color:#fff;white-space:nowrap;
 text-shadow:0 3px 0 #4a1f8f,0 0 10px #4a1f8f,0 0 3px #4a1f8f;line-height:1;transition:opacity .2s}
.door.boss .q{top:58%}
.door .q .eq{display:block;font-size:.62em;margin-top:.18em}
.door .q .eq b{display:inline-block;min-width:1.6em;border-bottom:4px dashed rgba(255,255,255,.8)}
.door .tag{position:absolute;left:50%;top:15%;transform:translateX(-50%);font-size:14px;background:#ffe873;color:#5a2a00;padding:3px 10px;border-radius:12px;white-space:nowrap;font-weight:900;z-index:2}
.door.boss .tag{top:-2%}
.door.enter{animation:doorIn .55s cubic-bezier(.2,1.4,.4,1)}
@keyframes doorIn{from{transform:scale(.55);opacity:0}to{transform:scale(1);opacity:1}}
.door.wobble{animation:wobble .6s ease}
@keyframes wobble{0%,100%{transform:rotate(0)}20%{transform:rotate(-4deg)}40%{transform:rotate(4deg)}60%{transform:rotate(-2.5deg)}80%{transform:rotate(2deg)}}
.door.broken .slab,.door.broken .q,.door.broken .fac,.door.broken .tag{opacity:0;transition:opacity .08s}
.door .lockGem{transition:transform .4s,opacity .4s;transform-box:fill-box;transform-origin:center}
.door .lockGem.pop{transform:translateY(-30px) scale(1.6);opacity:0}
.shard{position:fixed;left:0;top:0;pointer-events:none;z-index:40;background:linear-gradient(135deg,#d9f9ff,#b79bff 50%,#ff9fe0)}
.shard.gold{background:linear-gradient(135deg,#fff6c4,#ffcf3a 50%,#ff9d2e)}
.flyGem{position:fixed;left:0;top:0;pointer-events:none;z-index:55;will-change:transform}
.lantern{position:absolute;left:6px;bottom:4px;z-index:3;pointer-events:none;transition:filter .5s;filter:drop-shadow(0 0 10px rgba(255,216,74,.7))}
.lantern svg{width:100%;height:auto;display:block}
.lantern.l1{filter:drop-shadow(0 0 16px #ffe873) drop-shadow(0 0 34px rgba(255,200,80,.9))}
.lantern.l2{filter:drop-shadow(0 0 18px #ffb3ef) drop-shadow(0 0 40px rgba(170,140,255,.95))}
.lantern.l3{filter:drop-shadow(0 0 20px #fff27a) drop-shadow(0 0 54px rgba(255,190,40,1))}
.lantern.l1 svg,.lantern.l2 svg,.lantern.l3 svg{animation:bob 1.6s ease-in-out infinite}
.bubble{position:absolute;z-index:7;left:8px;bottom:calc(var(--lh,90px) + 8px);max-width:min(80%,330px);background:#fff;color:var(--ink);font-size:17px;font-weight:900;
 border-radius:18px;padding:8px 14px;box-shadow:0 4px 0 rgba(30,10,70,.4);opacity:0;transform:translateY(8px) scale(.9);transition:opacity .25s,transform .25s;pointer-events:none}
.bubble.on{opacity:1;transform:none}
.bubble:after{content:"";position:absolute;left:28px;bottom:-10px;border:10px solid transparent;border-top-color:#fff;border-bottom:0}
.padT{position:absolute;top:4px;right:4px;z-index:8;font-size:17px}
.answers{min-height:0;display:flex;align-items:center;justify-content:center}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%;max-width:560px;padding:4px 4px 10px}
.choices .btn{font-size:clamp(32px,7.5vmin,52px);min-height:clamp(72px,14vmin,118px);border-radius:26px}
.choices .btn:nth-child(2){--c1:#5ef0e6;--c2:#14a9bb;--sh:#0c6c7a}
.choices .btn:nth-child(3){--c1:#c29cff;--c2:#7a45e6;--sh:#4a2296}
.choices .btn:nth-child(4){--c1:#7cc4ff;--c2:#3a7bf0;--sh:#1f4ca6}
.choices .btn.nope,.btn.nope{--c1:#b7b0d0;--c2:#857ca8;--sh:#565078;opacity:.55;animation:nopeShake .45s ease}
@keyframes nopeShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.choices .btn.yes{--c1:#ffe873;--c2:#ffad1a;--sh:#b56a00;color:#5a2a00;animation:pulse .5s ease}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:420px;padding:4px 4px 10px}
.pad .btn{font-size:clamp(26px,5.5vmin,38px);min-height:clamp(58px,9vmin,80px);border-radius:20px;padding:0}
.pad .go{--c1:#8cf27f;--c2:#29b85a;--sh:#167237}
.pad .del{--c1:#ffb37c;--c2:#f0703a;--sh:#a6431c}
@media (min-aspect-ratio:1/1) and (max-height:520px){.pad{gap:8px;padding-bottom:6px}.pad .btn{min-height:58px}.choices{gap:12px}.choices .btn{min-height:min(118px,calc((100vh - 130px)/2))}}
/* hint */
.hint{position:absolute;inset:0;z-index:9;background:linear-gradient(180deg,#2a0f60,#1a0a46);border-radius:28px;border:3px solid rgba(160,255,170,.7);
 display:flex;flex-direction:column;padding:10px;gap:6px;animation:fadeIn .3s}
.hint[hidden]{display:none}
.hint.wide{flex-direction:row}
.hint .hl{display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center;flex:none}
.hint.wide .hl{width:42%}
.hint .hTop{display:flex;align-items:center;gap:8px}
.hint.wide .hTop{flex-direction:column}
.hint .worm{width:88px;flex:none;animation:wiggle 1.6s ease-in-out infinite}
.hint .worm svg{width:100%;height:auto;display:block}
@keyframes wiggle{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg) translateY(-3px)}}
.hint .say{background:#fff;color:var(--ink);font-size:16px;font-weight:900;border-radius:16px;padding:6px 12px;line-height:1.2}
.hint .hq{font-size:28px;font-weight:900;text-shadow:0 2px 0 var(--ink);text-align:center;white-space:nowrap}
.hint .hq b{color:#ffe873}
.hint .gridBox{flex:1;min-height:0;min-width:0;display:flex;align-items:center;justify-content:center}
.hgrid{display:flex;flex-direction:column;gap:var(--gap)}
.hrow{display:flex;align-items:center;gap:var(--gap);border-radius:12px;padding:1px 4px;cursor:pointer;transition:background .2s}
.hrow .gems{display:flex;gap:var(--gap)}
.hrow .gems span{width:var(--g);height:var(--g);display:block;opacity:.5;transition:opacity .2s,transform .2s}
.hrow .gems span svg{width:100%;height:100%;display:block}
.hrow.lit{background:rgba(255,255,255,.16)}
.hrow.lit .gems span{opacity:1;transform:scale(1.08)}
.hrow .lbl{min-width:2.2em;font-weight:900;font-size:max(15px,calc(var(--g) * .75));color:#ffe873;text-shadow:0 2px 0 var(--ink);opacity:0;transition:opacity .2s}
.hrow.lit .lbl{opacity:1}
.hint .countBtn{font-size:19px;min-height:58px;padding:6px 16px}
/* overlays */
#modal{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;background:rgba(15,5,40,.72);padding:calc(var(--st) + 10px) calc(var(--sr) + 10px) calc(var(--sb) + 10px) calc(var(--sl) + 10px)}
#modal.on{display:flex;animation:fadeIn .25s}
.card{background:linear-gradient(180deg,#5b2eb0,#3a1a84);border:4px solid #fff;border-radius:30px;padding:14px 20px;max-width:min(580px,96vw);max-height:100%;overflow:auto;
 text-align:center;box-shadow:0 12px 0 rgba(20,5,50,.6),0 0 50px rgba(255,170,255,.5);animation:pop .45s cubic-bezier(.2,1.5,.4,1);display:flex;flex-direction:column;align-items:center;gap:10px}
.card.goldC{background:linear-gradient(180deg,#ffd75e,#ff9a1f);color:#5a2a00;border-color:#fff6c4}
.card.goldC h2{text-shadow:0 2px 0 rgba(255,255,255,.7)}
.card h2{font-size:clamp(26px,6vmin,40px);text-shadow:0 3px 0 var(--ink)}
.card p{margin:0;font-size:clamp(17px,3.6vmin,22px)}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
.card .art{width:min(26vmin,160px);height:min(26vmin,160px);position:relative;display:grid;place-items:center;flex:none}
.card .art svg{width:100%;height:100%;position:relative}
.rays{position:absolute;inset:-30%;background:repeating-conic-gradient(rgba(255,255,255,.6) 0 10deg,transparent 10deg 30deg);border-radius:50%;
 -webkit-mask:radial-gradient(circle,#000 30%,transparent 70%);mask:radial-gradient(circle,#000 30%,transparent 70%);animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.bigStars{display:flex;gap:8px}

<script>
(function(){

const $=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s));
const rand=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}
let SPEED=1;const wait=ms=>new Promise(r=>setTimeout(r,ms*SPEED));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cleanName=v=>String(v||'').replace(/[^\p{L}\p{N} '\-]/gu,'').trim().slice(0,14);

// ================= data =================
const TABLES=[1,2,5,10,3,4,6,7,8,9];
const ZONES=[{from:0,name:'Sparkle Shallows'},{from:4,name:'Amethyst Hollow'},{from:6,name:'Deep Crystal Caverns'}];
const GEMS={
 1:{name:'Moon Quartz',c:'#c8b4ff',cut:'oval'},2:{name:'Ruby',c:'#ff2d55',cut:'heart'},5:{name:'Citrine',c:'#ffc400',cut:'trillion'},
 10:{name:'Peridot',c:'#8be43c',cut:'hex'},3:{name:'Sapphire',c:'#2f6bff',cut:'round'},4:{name:'Emerald',c:'#10c47a',cut:'emerald'},
 6:{name:'Amethyst',c:'#a347ff',cut:'pear'},7:{name:'Aquamarine',c:'#2fd8e8',cut:'marquise'},8:{name:'Pink Tourmaline',c:'#ff6fcf',cut:'cushion'},
 9:{name:'Diamond',c:'#dff4ff',cut:'diamond'}};
const RARES=[
 {id:'opal',name:'Rainbow Opal',grad:['#ffd6f0','#b9f0ff','#e3c8ff','#c8ffe0'],cut:'round'},
 {id:'moon',name:'Moonstone',grad:['#ffffff','#a9c8ff','#e8f0ff'],cut:'oval'},
 {id:'aurora',name:'Aurora Crystal',grad:['#7b2cff','#21e6c1','#ff5ad9'],cut:'diamond'},
 {id:'fire',name:'Fire Opal',grad:['#ff3d00','#ffb300','#ff4fa0'],cut:'heart'},
 {id:'galaxy',name:'Galaxy Gem',grad:['#1a1170','#5b2bd6','#ff6ad5'],cut:'hex',dots:1},
 {id:'rose',name:'Rose Quartz',grad:['#ffe1ec','#ff8fb8'],cut:'cushion'},
 {id:'unicorn',name:'Unicorn Gem',grad:['#ff9de6','#c79bff','#8ee8ff','#fff59b'],cut:'pear'},
 {id:'star',name:'Star Sapphire',grad:['#0b3bd9','#6aa2ff','#2a5cff'],cut:'round',dots:1}];

const TREASURES=[{id:'crown',name:'Crystal Crown'},{id:'geode',name:'Rainbow Geode'},{id:'wand',name:'Star Wand'},{id:'egg',name:'Dragon Egg'},{id:'locket',name:'Heart Locket'},{id:'castle',name:'Crystal Castle'}];
const PRAISE=['Sparkly!','You got it!','Crystal clear!','Gem-tastic!','Brilliant!','Shiny work!','Wow, super!','Dazzling!','Amazing!'];

// ================= save =================
const KEY='crystalcave.v1';
const DEF={v:1,name:'',muted:false,pad:false,sec:{},facts:{},gems:{},rare:{},golden:0,keys:0,treasures:[],streak:0,best:0,run:0,correct:0,answered:0,started:false};
function load(){let d=null;try{d=JSON.parse(localStorage.getItem(KEY)||'null');}catch(e){}
 const s=JSON.parse(JSON.stringify(DEF));if(d&&typeof d==='object')for(const k in DEF){if(d[k]!=null&&typeof d[k]===typeof DEF[k])s[k]=d[k];}
 if(!Array.isArray(s.treasures))s.treasures=[];return s;}
let save=load();
function persist(){try{localStorage.setItem(KEY,JSON.stringify(save));}catch(e){}}
const secRec=t=>save.sec[t]||{stars:0,done:false,plays:0};
const unlocked=i=>i===0||!!(save.sec[TABLES[i-1]]&&save.sec[TABLES[i-1]].done);
const gemCount=t=>{const g=save.gems[t];return g?(g.b|0)+(g.s|0):0;};
function totalGems(){let n=0;for(const t of TABLES)n+=gemCount(t);for(const k in save.rare)n+=save.rare[k]|0;return n+(save.golden|0);}
function addGem(t,big,n){n=n||1;const g=save.gems[t]||(save.gems[t]={b:0,s:0});if(big)g.b+=n;else g.s+=n;}

// ================= art =================
function shade(hex,f){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
 const m=v=>Math.round(f>=1?v+(255-v)*(f-1):v*f);return 'rgb('+m(r)+','+m(g)+','+m(b)+')';}
const P=pts=>pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
const LX=-0.6,LY=-0.8;
function stepCut(outer,k,dy){k=k||0.55;dy=dy==null?-3:dy;let cx=0,cy=0;outer.forEach(p=>{cx+=p[0];cy+=p[1];});cx/=outer.length;cy/=outer.length;
 const inner=outer.map(p=>[cx+(p[0]-cx)*k,cy+(p[1]-cy)*k+dy]);const facets=[];
 for(let i=0;i<outer.length;i++){const j=(i+1)%outer.length;const mx=(outer[i][0]+outer[j][0])/2-cx,my=(outer[i][1]+outer[j][1])/2-cy;const l=Math.hypot(mx,my)||1;
  facets.push([[outer[i],outer[j],inner[j],inner[i]],1+0.42*((mx/l)*LX+(my/l)*LY)]);}
 facets.push([inner,1.2]);return {outline:outer,facets};}
const ring=(n,fx,fy,a0)=>{const o=[];for(let i=0;i<n;i++){const a=(a0||0)+i*Math.PI*2/n;o.push([fx(a),fy(a)]);}return o;};
const SHAPES={};
SHAPES.oval=stepCut(ring(16,a=>38*Math.cos(a),a=>46*Math.sin(a)));
SHAPES.heart=stepCut(ring(22,a=>2.75*16*Math.pow(Math.sin(a),3),a=>-2.75*(13*Math.cos(a)-5*Math.cos(2*a)-2*Math.cos(3*a)-Math.cos(4*a))+4),0.5,2);
SHAPES.trillion=stepCut([[0,-46],[25,-6],[47,38],[0,43],[-47,38],[-25,-6]],0.5,6);
SHAPES.hex=stepCut(ring(6,a=>46*Math.cos(a),a=>46*Math.sin(a),Math.PI/6),0.55);
SHAPES.emerald=stepCut([[-28,-44],[28,-44],[40,-32],[40,32],[28,44],[-28,44],[-40,32],[-40,-32]],0.58);
SHAPES.pear=stepCut((function(){const o=[[0,-48]];for(let i=0;i<=12;i++){const a=-Math.PI*0.22+i*(Math.PI*1.44/12);o.push([34*Math.cos(a),12+34*Math.sin(a)]);}return o;})(),0.52,4);
SHAPES.marquise=stepCut((function(){const r=48.1,c=14.1,o=[];for(let i=0;i<=8;i++){const a=-1.27+i*2.54/8;o.push([-c+r*Math.cos(a),r*Math.sin(a)]);}for(let i=1;i<8;i++){const a=-1.27+i*2.54/8;o.push([c-r*Math.cos(a),-r*Math.sin(a)]);}return o;})(),0.5,0);
SHAPES.cushion=stepCut(ring(16,a=>{const c=Math.cos(a);return 44*Math.sign(c)*Math.pow(Math.abs(c),0.5);},a=>{const s=Math.sin(a);return 44*Math.sign(s)*Math.pow(Math.abs(s),0.5);}),0.56);
SHAPES.round=(function(){const c16=ring(16,a=>46*Math.cos(a),a=>46*Math.sin(a)),inn=ring(8,a=>22*Math.cos(a),a=>22*Math.sin(a)-2),f=[];
 for(let i=0;i<8;i++){const a=(i+0.5)*Math.PI/4,d=Math.cos(a)*LX+Math.sin(a)*LY,n=(i+1)%8;
  f.push([[inn[i],c16[2*i],c16[2*i+1]],1+0.38*d+0.08]);f.push([[inn[i],c16[2*i+1],c16[(2*i+2)%16],inn[n]],1+0.38*d-0.08]);}
 f.push([inn,1.22]);return {outline:c16,facets:f};})();
SHAPES.diamond={outline:[[-46,-12],[-26,-36],[26,-36],[46,-12],[0,44]],facets:[
 [[[-46,-12],[-26,-36],[-15,-12]],1.18],[[[-26,-36],[0,-36],[-15,-12]],1.38],[[[0,-36],[-15,-12],[15,-12]],1.05],[[[0,-36],[26,-36],[15,-12]],1.3],[[[26,-36],[46,-12],[15,-12]],0.95],
 [[[-46,-12],[-15,-12],[0,44]],0.82],[[[-15,-12],[15,-12],[0,44]],1.06],[[[15,-12],[46,-12],[0,44]],0.66]]};
let uid=0;
function gradDef(id,cols,vert){return '<linearGradient id="'+id+'" x1="0" y1="0" x2="'+(vert?0:1)+'" y2="1">'+cols.map((c,i)=>'<stop offset="'+(i/(cols.length-1)).toFixed(2)+'" stop-color="'+c+'"/>').join('')+'</linearGradient>';}
function facetSVG(sh){let s='';for(const ft of sh.facets){const f=ft[1],col=f>=1?'#fff':'#16053a',op=f>=1?Math.min(.7,(f-1)*1.15):(1-f)*0.95;

  if(g.dots)for(let i=0;i<6;i++){const a=i*1.7,r=10+i*5;s+='<circle cx="'+(Math.cos(a)*r*0.7).toFixed(1)+'" cy="'+(Math.sin(a)*r*0.7).toFixed(1)+'" r="'+(i%2?1.6:2.4)+'" fill="#fff"/>';}
  if(!o.gray)s+='<path d="M-19,-30 l3,-9 l3,9 l9,3 l-9,3 l-3,9 l-3,-9 l-9,-3z" fill="#fff" opacity=".95"/>';}
 return s+'</svg>';}
function goldenSVG(size){const id='u'+(++uid);
 const prism=(x,y,w,h,r)=>'<g transform="translate('+x+','+y+') rotate('+r+')"><polygon points="'+P([[-w/2,0],[-w/2,-h*0.72],[0,-h],[w/2,-h*0.72],[w/2,0]])+'" fill="url(#'+id+')" stroke="#b56a00" stroke-width="3" stroke-linejoin="round"/><polygon points="'+P([[-w/2,0],[-w/2,-h*0.72],[0,-h],[0,0]])+'" fill="#fff" fill-opacity=".35"/></g>';

  prism(-24,44,24,62,-22)+prism(26,44,24,58,22)+prism(0,48,34,100,0)+'<path d="M-6,-40 l3,-9 l3,9 l9,3 l-9,3 l-3,9 l-3,-9 l-9,-3z" fill="#fff"/></svg>';}

function lanternSVG(){const id='u'+(++uid);
 return '<svg viewBox="0 0 100 130" aria-hidden="true"><defs><radialGradient id="'+id+'" cx="50%" cy="55%" r="60%"><stop offset="0" stop-color="#fffde0"/><stop offset=".55" stop-color="#ffd84a"/><stop offset="1" stop-color="#ff9d2e"/></radialGradient></defs>'+
 '<path d="M30 24 Q50 -4 70 24" fill="none" stroke="#7a4bd6" stroke-width="6" stroke-linecap="round"/>'+

 '<path d="M28 44 Q24 70 30 96" stroke="#fff" stroke-opacity=".7" stroke-width="5" fill="none" stroke-linecap="round"/>'+
 '<ellipse cx="40" cy="64" rx="5.5" ry="7.5" fill="#3a1d6e"/><ellipse cx="60" cy="64" rx="5.5" ry="7.5" fill="#3a1d6e"/>'+
 '<circle cx="42" cy="61" r="2.2" fill="#fff"/><circle cx="62" cy="61" r="2.2" fill="#fff"/>'+
 '<ellipse cx="32" cy="77" rx="5.5" ry="3.5" fill="#ff7aa8" opacity=".75"/><ellipse cx="68" cy="77" rx="5.5" ry="3.5" fill="#ff7aa8" opacity=".75"/>'+
 '<path d="M42 77 Q50 86 58 77" stroke="#3a1d6e" stroke-width="3.5" fill="none" stroke-linecap="round"/>'+
 '<rect x="23" y="104" width="54" height="15" rx="6" fill="#a77bff" stroke="#4b2a99" stroke-width="3"/>'+

const Snd={c:null,
 init(){if(!this.c){const AC=window.AudioContext||window.webkitAudioContext;if(AC){try{this.c=new AC();}catch(e){}}}if(this.c&&this.c.state==='suspended'){try{this.c.resume().catch(()=>{});}catch(e){}}},

  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.15,t+0.015);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+0.05);}catch(e){}},
 noise(d,v,hp){if(save.muted||!this.c)return;try{const c=this.c,n=Math.floor(c.sampleRate*d),buf=c.createBuffer(1,n,c.sampleRate),a=buf.getChannelData(0);
  for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);const s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();
  s.buffer=buf;f.type='highpass';f.frequency.value=hp||2500;g.gain.value=v||0.2;s.connect(f);f.connect(g);g.connect(c.destination);s.start();}catch(e){}},
 tap(){this.tone(700,0.07,'triangle',0.1);},
 correct(){[0,4,7,12].forEach((s,i)=>this.tone(784*Math.pow(2,s/12),0.28,'triangle',0.15,i*0.07));},
 shatter(){this.noise(0.4,0.18,2600);for(let i=0;i<7;i++)this.tone(rand(1800,3800),0.2,'sine',0.05,0.02+i*0.045);},
 gem(i){i=i||0;this.tone(1320*Math.pow(2,(i%8)/12),0.16,'sine',0.13);this.tone(2640*Math.pow(2,(i%8)/12),0.1,'sine',0.04,0.03);},
 soft(){this.tone(523,0.2,'sine',0.11,0,440);this.tone(440,0.26,'sine',0.09,0.17,392);},
 count(i){this.tone(523*Math.pow(2,Math.min(i,16)/12),0.16,'triangle',0.13);},

  else{const d=box$('.door');if(d){d.classList.remove('enter','wobble');void d.offsetWidth;d.classList.add('wobble');}await flyGem(gemSVG(GEMS[t],first?gw:sm),lf,first?gw:sm,0);Snd.gem(0);}
  bagUpd();}
 else{shatter(false);addGem(t,first,1);s.earned[t]=(s.earned[t]||0)+1;persist();
  await flyGem(gemSVG(GEMS[t],first?gw:sm),from,first?gw:sm,100);Snd.gem(first?0:4);bagUpd();}
 if(S!==s)return;
 if(s.mode==='tunnel'||!s.boss)s.idx++;
 if(first)await milestones(s);
 if(S!==s)return;
 await wait(200);if(S!==s)return;s.busy=false;nextQ();}
async function milestones(s){const n=save.streak;
 if(n===3){Snd.streak();cele(lanternSVG()+'<span>3 in a row! Your lantern is sparkling!</span>',1900);await wait(450);}
 else if(n%10===5){Snd.streak();const own=RARES.filter(r=>!save.rare[r.id]);const g=own.length?own[0]:pick(RARES);save.rare[g.id]=(save.rare[g.id]|0)+1;persist();
  cele(gemSVG(g,48)+'<span>'+n+' in a row! You found a rare <b>'+g.name+'</b>!</span>',2600);
  await flyGem(gemSVG(g,72),centerOf($('#pLantern')),72,150);bagUpd();}
 else if(n%10===0&&n>0){save.golden++;persist();Snd.golden();bagUpd();
  if(s.mode==='tunnel'){save.keys++;persist();cele(goldenSVG(48)+'<span>'+n+' in a row! Another Golden Crystal, saved for later!</span>',2600);await wait(600);return;}
  await goldenModal(n);}}
function goldenModal(n){return new Promise(res=>{const c=modal('<div class="art"><div class="rays"></div>'+goldenSVG(160)+'</div><h2>Golden Crystal!</h2><p>'+n+' in a row! Your golden crystal opened a <b>secret side tunnel</b>!</p>'+
  '<div class="row"><button class="btn gold big" id="gNow" style="--c1:#fff6c4;--c2:#ffd84a">Explore it now!</button><button class="btn purple" id="gLater">Save it for later</button></div>','goldC');
 setTimeout(()=>{const r=c.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height*0.3,60,['#fff','#fff27a','#ffcf3a'],380);},120);
 on('#gNow',()=>{tapSnd();closeModal();tunnelResolve=res;startTunnel(S);});
 on('#gLater',()=>{tapSnd();save.keys++;persist();closeModal();cele(goldenSVG(48)+'<span>Saved! Find the Secret Tunnel on the cave map.</span>',2400);res();});});}
function tunnelDone(){S.busy=true;const reward=TREASURES.find(x=>save.treasures.indexOf(x.id)<0);
 modal('<h2>Treasure Chest!</h2><p id="chP">Tap the chest to open it!</p><div class="chest" id="chest" role="button" aria-label="Treasure chest">'+chestSVG()+'<div class="treasure">'+(reward?treasureSVG(reward.id):gemSVG(RARES[0],120))+'</div></div><div id="chOut" class="row" style="min-height:72px"></div>');
 let taps=0;const ch=$('#chest');
 ch.addEventListener('click',()=>{if(ch.classList.contains('open'))return;taps++;Snd.init();
  if(taps<2){ch.classList.remove('shake');void ch.offsetWidth;ch.classList.add('shake');Snd.tone(300+taps*120,0.15,'triangle',0.15);$('#chP').textContent='It wiggled! One more tap!';return;}
  ch.classList.add('open');Snd.chest();const r=ch.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height*0.3,70,null,420);
  if(reward)save.treasures.push(reward.id);const bonus=TABLES.filter((t,i)=>unlocked(i));for(let k=0;k<5;k++)addGem(pick(bonus),true,1);persist();
  $('#chP').innerHTML=reward?'You found the <b>'+reward.name+'</b>! Plus 5 bonus gems!':'You found a giant gem pile! Plus 5 bonus gems!';
  $('#chOut').innerHTML='<button class="btn gold big" id="chBack">'+(S&&S.ret?'Back to my tunnel':'Back to the map')+'</button>';
  on('#chBack',()=>{tapSnd();closeModal();if(S&&S.ret){S=S.ret;S.doorDirty=true;setupPlay();const r2=tunnelResolve;tunnelResolve=null;if(r2)r2();}else{S=null;show('map');}});});}
function onWrong(v,btn){const s=S,q=s.q;Snd.soft();
 if(!s.wrong){s.wrong=true;record(q,false);
  if(s.mode==='sec'&&!s.boss&&!s.requeued[qKey(q)]){s.requeued[qKey(q)]=1;const at=Math.min(s.queue.length,s.idx+3);s.queue.splice(at,0,{a:q.a,b:q.b,review:true});renderDots();}
  const old=save.streak;save.streak=Math.floor(old/2);persist();updateStreak(old>=2);
  $('#bubble').classList.remove('on');if(old>=2)cele(IC.flame+'<span>Streak resting at '+save.streak+'. You can build it back up!</span>',2600);}
 s.tried.push(v);if(btn){btn.classList.add('nope');btn.disabled=true;}else{s.typed='';updateQ();}
 const d=box$('.door');if(d){d.classList.remove('enter','wobble');void d.offsetWidth;d.classList.add('wobble');}
 if($('#hint').hidden)showHint();else{const w=$('#hint .worm');if(w){w.style.animation='none';void w.offsetWidth;w.style.animation='';}$('#say').textContent='Let\'s count every row together!';autoCount();}}
// ---------- glow-worm hint ----------
function showHint(){const q=S.q,rows=q.swap?q.b:q.a,cols=q.swap?q.a:q.b,g=GEMS[q.a],h=$('#hint');
 let rh='';for(let r=0;r<rows;r++){rh+='<div class="hrow" data-r="'+r+'"><div class="gems">';for(let c=0;c<cols;c++)rh+='<span>'+gemSVG(g,24)+'</span>';rh+='</div><span class="lbl">'+((r+1)*cols)+'</span></div>';}
 h.innerHTML='<div class="hl"><div class="hTop"><div class="worm">'+wormSVG()+'</div><div class="say" id="say">Almost! I\'m Glimmer! '+rows+' row'+(rows>1?'s':'')+' of '+cols+' gem'+(cols>1?'s':'')+'. Tap each row to count!</div></div>'+
  '<div class="hq">'+qText(q)+' = <b>?</b></div><button class="btn gold countBtn" id="countBtn">Count with me!</button></div><div class="gridBox"><div class="hgrid" id="hgrid">'+rh+'</div></div>';
 h.hidden=false;S.hintRows=0;
 h.querySelectorAll('.hrow').forEach(r=>r.addEventListener('click',()=>{if(!S.counting)countRow();}));on('#countBtn',()=>{Snd.init();autoCount();});sizeHint();}
function sizeHint(){const h=$('#hint'),q=S.q;if(!q||h.hidden)return;const rows=q.swap?q.b:q.a,cols=q.swap?q.a:q.b;const r=h.getBoundingClientRect();if(!r.width)return;
 h.classList.toggle('wide',r.width>r.height*1.15);const gb=h.querySelector('.gridBox').getBoundingClientRect();
 const gap=Math.max(2,Math.min(6,gb.width/cols*0.08));const g=Math.max(13,Math.min(46,(gb.width-60-gap*(cols+2))/cols,(gb.height-6-gap*(rows+1))/rows-4));
 h.style.setProperty('--g',g.toFixed(1)+'px');h.style.setProperty('--gap',gap.toFixed(1)+'px');}
function countRow(){if(!S||$('#hint').hidden)return;const rows=$$('#hgrid .hrow');if(!rows.length)return;if(S.hintRows>=rows.length){rows.forEach(r=>r.classList.remove('lit'));S.hintRows=0;}
 const r=rows[S.hintRows];r.classList.add('lit');S.hintRows++;Snd.count(S.hintRows*2);const c=centerOf(r);burst(c[0],c[1],6);
 const q=S.q,cols=q.swap?q.a:q.b,seq=[];for(let i=1;i<=S.hintRows;i++)seq.push(i*cols);
 $('#say').textContent=seq.join(', ')+(S.hintRows===rows.length?'! That\'s '+seq[seq.length-1]+(seq[seq.length-1]===1?' gem!':' gems!'):'...');}
async function autoCount(){if(!S||S.counting)return;const s=S,q=s.q;s.counting=true;$$('#hgrid .hrow').forEach(r=>r.classList.remove('lit'));s.hintRows=0;const n=$$('#hgrid .hrow').length;
 for(let i=0;i<n;i++){if(S!==s||s.q!==q||$('#hint').hidden)break;countRow();await wait(430);}s.counting=false;}
function hideHint(){const h=$('#hint');h.hidden=true;h.innerHTML='';}
// ---------- section done ----------
function sectionDone(){const s=S;s.busy=true;const t=s.t,i=s.i,ratio=s.total?s.first/s.total:1,stars=ratio>=0.9?3:ratio>=0.7?2:1,rec=secRec(t);
 const wasM=rec.stars>=3;rec.stars=Math.max(rec.stars,stars);rec.done=true;rec.plays=(rec.plays|0)+1;save.sec[t]=rec;persist();
 const nextI=i+1<TABLES.length?i+1:-1;
 let earned='';for(const k in s.earned)earned+='<span class="e">'+gemSVG(GEMS[k],40)+'×'+s.earned[k]+'</span>';
 const c=modal('<h2>Tunnel Cleared!</h2><div class="bigStars">'+[0,1,2].map(()=>starSVG(true)).join('')+'</div>'+
  '<p>'+(stars===3&&!wasM?'You <b>mastered</b> the '+t+'s! ':'')+(stars<3?'Play again to earn more stars!':'Amazing work'+(save.name?', '+esc(save.name):'')+'!')+(nextI>=0&&!secRec(TABLES[nextI]).done?' A new tunnel is open!':'')+'</p>'+
  '<div class="earned">'+earned+'</div><div class="row"><button class="btn purple" id="dMap">Map</button><button class="btn teal" id="dAgain">Play again</button>'+(nextI>=0?'<button class="btn gold big" id="dNext">Next tunnel &#8594;</button>':'')+'</div>');
 c.querySelectorAll('.bigStars svg').forEach((el,k)=>setTimeout(()=>{if(k<stars){el.classList.add('on');Snd.tone(880*(1+k*0.25),0.25,'triangle',0.15);const r=el.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,18,['#fff27a','#ffcf3a','#fff']);}},(300+k*350)*SPEED));
 Snd.golden();on('#dMap',()=>{tapSnd();closeModal();S=null;show('map');});on('#dAgain',()=>{tapSnd();closeModal();startSection(i);});
 if(nextI>=0)on('#dNext',()=>{tapSnd();closeModal();startSection(nextI);});}
// ---------- backpack ----------
let bagFrom='map';
$('#bBack').innerHTML=IC.back;$('#sBack').innerHTML=IC.back;
on('#bBack',()=>{tapSnd();if(bagFrom==='play'&&S)show('play');else show('map');});on('#sBack',()=>{tapSnd();show('map');});
function renderBag(){let h='<div class="summary"><div class="s">'+gemSVG(GEMS[2],38)+totalGems()+' gems</div><div class="s">'+goldenSVG(38)+(save.golden|0)+' golden</div><div class="s">'+IC.flame+'Best streak '+save.best+'</div></div>';
 h+='<div class="secH">Cave Gems</div><div class="tiles">';
 TABLES.forEach(t=>{const g=save.gems[t]||{b:0,s:0},has=(g.b+g.s)>0;h+='<div class="tile'+(has?'':' no')+'">'+gemSVG(GEMS[t],56,{sil:!has})+'<div class="n">'+GEMS[t].name+'</div><div class="c">'+g.b+(g.s?' <small>+'+g.s+' little</small>':'')+'</div></div>';});
 h+='</div><div class="secH">Rare Gems <small style="font-size:15px;opacity:.85">(get 5 in a row!)</small></div><div class="tiles">';
 RARES.forEach(r=>{const n=save.rare[r.id]|0;h+='<div class="tile'+(n?'':' no')+'">'+gemSVG(r,56,{sil:!n})+'<div class="n">'+(n?r.name:'???')+'</div><div class="c">'+(n?'×'+n:'&nbsp;')+'</div></div>';});
 h+='</div><div class="secH">Treasures <small style="font-size:15px;opacity:.85">(10 in a row opens a secret tunnel!)</small></div><div class="tiles">';
 TREASURES.forEach(r=>{const has=save.treasures.indexOf(r.id)>=0;h+='<div class="tile'+(has?'':' no')+'"><div style="width:62px;height:62px'+(has?'':';filter:grayscale(1) brightness(.6)')+'">'+treasureSVG(r.id)+'</div><div class="n">'+(has?r.name:'???')+'</div></div>';});
 h+='</div><div class="secH">Times Tables</div><div class="tbls">';
 TABLES.forEach((t,i)=>{const rec=secRec(t);let c=0,n=0;for(let b=1;b<=10;b++){const f=save.facts[t+'x'+b];if(f){c+=f.c;n+=f.n;}}
  h+='<div class="tbl'+(rec.stars>=3?' m':'')+'"><span class="t">×'+t+'</span><div><div class="st">'+[0,1,2].map(k=>starSVG(k<rec.stars)).join('')+'</div><div class="acc">'+(rec.stars>=3?'Mastered! ':'')+(n?Math.round(c/n*100)+'% first try':(unlocked(i)?'Ready to explore':'Locked'))+'</div></div></div>';});
 h+='</div>';
 const tricky=Object.keys(save.facts).filter(k=>{const f=save.facts[k];return f.w>0&&f.box<2;}).sort((a,b)=>save.facts[b].w-save.facts[a].w).slice(0,10);
 if(tricky.length)h+='<div class="secH">Glimmer is helping with</div><div class="chips">'+tricky.map(k=>'<span>'+k.replace('x',' × ')+'</span>').join('')+'</div>';
 $('#bagBody').innerHTML=h;}
// ---------- settings ----------
function renderSettings(){const b=$('#setBody');
 b.innerHTML='<div class="setRow"><span class="lbl">'+IC.sndOn+'Sound</span><button class="btn tog '+(save.muted?'gray':'green')+'" id="tSnd">'+(save.muted?'Off':'On')+'</button></div>'+
 '<div class="setRow"><span class="lbl"><span style="font-size:24px">123</span>Number pad</span><button class="btn tog '+(save.pad?'green':'gray')+'" id="tPad">'+(save.pad?'On':'Off')+'</button></div>'+
 '<div class="setRow"><span class="lbl">Explorer name</span><input id="sName" maxlength="14" value="'+esc(save.name)+'" placeholder="Name" autocomplete="off"></div>'+
 (fsEnabled?'<div class="setRow"><span class="lbl">'+IC.fs+'Full screen</span><button class="btn tog blue" id="tFs">'+(isFS()?'Exit':'Go')+'</button></div>':'')+
 '<div class="setRow"><span class="lbl">Start over</span><button class="btn tog red" id="tReset">Reset</button></div>'+
 '<p class="note">Progress is saved on this device. No ads, no links, no purchases. Missed facts come back later for extra practice.</p>';
 on('#tSnd',()=>{toggleMute();renderSettings();});on('#tPad',()=>{tapSnd();save.pad=!save.pad;persist();renderSettings();});
 if(fsEnabled)on('#tFs',()=>{tapSnd();toggleFS();setTimeout(renderSettings,400);});
 $('#sName').addEventListener('change',e=>{save.name=cleanName(e.target.value);persist();});
 on('#tReset',()=>{tapSnd();modal('<h2>Start over?</h2><p>This erases all gems, stars and treasures on this device.</p><div class="row"><button class="btn green big" id="rKeep">Keep my gems</button><button class="btn red" id="rYes">Yes, erase</button></div>');
  on('#rKeep',()=>{tapSnd();closeModal();});on('#rYes',()=>{const m=save.muted;save=JSON.parse(JSON.stringify(DEF));save.muted=m;persist();closeModal();S=null;show('welcome');});});}
// ================= boot =================
document.addEventListener('visibilitychange',()=>{if(document.hidden)persist();});
show('welcome');
if('serviceWorker' in navigator&&location.protocol!=='file:'){window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(()=>{});});}
window.__cc={get save(){return save;},get S(){return S;},speed(v){SPEED=v;},show,startSection,TABLES};
})();
</script>
