<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2a1458">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Crystal Cave Quest - a sparkly maths adventure for kids: adding, taking away, times tables and sharing">
<title>Crystal Cave Quest</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
:root{--st:env(safe-area-inset-top,0px);--sr:env(safe-area-inset-right,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);
 --ink:#2b1257;--font:"Arial Rounded MT Bold","Nunito","Baloo 2","Comic Sans MS","Trebuchet MS",Roboto,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#2a1458;color:#fff;font-family:var(--font);
 -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
 touch-action:manipulation;overscroll-behavior:none;position:fixed;inset:0}
#bg{position:fixed;inset:0;z-index:0;overflow:hidden;
 background:radial-gradient(ellipse at 50% 115%,rgba(255,110,210,.45) 0,transparent 55%),
  radial-gradient(ellipse at 8% 0%,rgba(60,220,255,.32) 0,transparent 45%),
  radial-gradient(ellipse at 95% 10%,rgba(190,120,255,.35) 0,transparent 45%),
  linear-gradient(180deg,#25104f 0%,#3c1c7c 45%,#1f3f86 100%)}
#bg svg{position:absolute;pointer-events:none}
#bg .cl{bottom:-2px;width:min(46vmin,330px);height:min(46vmin,330px);filter:drop-shadow(0 0 10px rgba(255,170,255,.55))}
#bg .cl{transition:opacity .4s}body:not(.s-welcome) #bg .cl{opacity:.4}
#bg .cl.l{left:-14px}#bg .cl.r{right:-14px;transform:scaleX(-1)}
#bg .stal{top:0;left:0;width:100%;height:12vmin}
#fx{position:fixed;inset:0;pointer-events:none;z-index:60}
.screen{position:fixed;inset:0;z-index:5;display:none;flex-direction:column;
 padding:calc(var(--st) + 10px) calc(var(--sr) + 12px) calc(var(--sb) + 10px) calc(var(--sl) + 12px)}
.screen.on{display:flex;animation:fadeIn .35s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
button{font-family:inherit}
.btn{appearance:none;border:0;font-weight:900;color:#fff;min-height:60px;min-width:60px;border-radius:22px;padding:8px 20px;font-size:22px;
 --c1:#ff86cf;--c2:#e2409b;--sh:#a3226b;background:linear-gradient(var(--c1),var(--c2));
 box-shadow:0 6px 0 var(--sh),0 10px 18px rgba(0,0,0,.3),inset 0 3px 0 rgba(255,255,255,.45);
 text-shadow:0 2px 0 rgba(0,0,0,.25);cursor:pointer;position:relative;transition:transform .08s,box-shadow .08s,opacity .2s;
 display:inline-flex;align-items:center;justify-content:center;gap:8px;line-height:1.1;touch-action:manipulation}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--sh),0 4px 8px rgba(0,0,0,.3),inset 0 3px 0 rgba(255,255,255,.45)}
.btn.teal{--c1:#5ef0e6;--c2:#14a9bb;--sh:#0c6c7a}
.btn.gold{--c1:#ffe873;--c2:#ffad1a;--sh:#b56a00;color:#5a2a00;text-shadow:0 1px 0 rgba(255,255,255,.6)}
.btn.purple{--c1:#c29cff;--c2:#7a45e6;--sh:#4a2296}
.btn.blue{--c1:#7cc4ff;--c2:#3a7bf0;--sh:#1f4ca6}
.btn.green{--c1:#8cf27f;--c2:#29b85a;--sh:#167237}
.btn.gray{--c1:#b7b0d0;--c2:#857ca8;--sh:#565078}
.btn.red{--c1:#ff8a8a;--c2:#e2405a;--sh:#9c1f33}
.ibtn{width:60px;height:60px;padding:0;border-radius:50%;flex:none}
.ibtn svg{width:34px;height:34px;pointer-events:none}
.badge{position:absolute;top:-8px;right:-10px;min-width:30px;height:28px;border-radius:14px;background:#ff3d7a;border:3px solid #fff;
 font-size:15px;display:grid;place-items:center;padding:0 5px;color:#fff;text-shadow:none}
.bump{animation:bump .35s ease}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
.row{display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap}
h1,h2,h3{margin:0}
.panelTitle{font-size:clamp(22px,5vmin,36px);text-shadow:0 3px 0 var(--ink),0 0 18px rgba(255,180,255,.7);text-align:center;flex:1;min-width:0;line-height:1.05}
.topbar{display:flex;align-items:center;gap:10px;flex:none;min-height:64px}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;-webkit-overflow-scrolling:touch;padding:6px 4px 20px}
/* welcome */
#welcome .wTop{display:flex;justify-content:flex-end;gap:12px;flex:none}
.wMain{flex:1;display:flex;align-items:center;justify-content:center;gap:4vmin;min-height:0}
.wLantern{width:min(34vmin,230px);flex:none;animation:bob 3s ease-in-out infinite;filter:drop-shadow(0 0 28px #ffd84a) drop-shadow(0 0 60px rgba(255,200,80,.6))}
.wLantern svg{width:100%;height:auto;display:block}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-12px) rotate(3deg)}}
.wText{display:flex;flex-direction:column;align-items:center;gap:14px;max-width:520px}
.title{font-size:clamp(40px,10vmin,84px);line-height:.95;text-align:center;letter-spacing:1px}
.title span{display:inline-block;background:linear-gradient(180deg,#fff 0%,#ffe9ff 30%,#ff9ee6 60%,#a58bff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
 filter:drop-shadow(0 4px 0 var(--ink)) drop-shadow(0 0 14px rgba(255,160,255,.8));animation:shine 3s ease-in-out infinite}
.title span:nth-child(2){animation-delay:.3s;background-image:linear-gradient(180deg,#fff 0%,#d9fbff 30%,#6be7ff 65%,#6f8cff 100%)}
.title span:nth-child(3){animation-delay:.6s;background-image:linear-gradient(180deg,#fff 0%,#fff6c7 30%,#ffd34a 65%,#ff9a3d 100%)}
@keyframes shine{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.sub{margin:0;font-size:clamp(17px,3.6vmin,24px);text-align:center;text-shadow:0 2px 0 var(--ink)}
.nameBox{display:flex;flex-direction:column;gap:6px;align-items:center;font-size:17px;opacity:.95}
.nameBox input{font:inherit;font-size:22px;font-weight:900;min-height:60px;width:min(78vw,340px);border-radius:20px;border:4px solid #fff;
 background:rgba(255,255,255,.18);color:#fff;text-align:center;padding:6px 14px;outline:none;-webkit-user-select:text;user-select:text}
.nameBox input::placeholder{color:rgba(255,255,255,.65)}
.big{font-size:clamp(22px,5vmin,32px);min-height:72px;padding:10px 30px;border-radius:28px}
.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@media (min-aspect-ratio:1/1){.wMain{flex-direction:row}}
@media (max-aspect-ratio:1/1){.wMain{flex-direction:column}.wLantern{width:min(28vh,40vw,230px)}}
@media (max-height:460px){.title{font-size:clamp(34px,9vh,60px)}.wText{gap:8px}.big{min-height:62px}.nameBox input{min-height:56px}.sub{font-size:16px}.nameBox span{display:none}}
/* map */
#mapArea{position:relative;flex:1;overflow-y:auto;overflow-x:hidden;touch-action:pan-y}
#mapInner{position:relative;width:100%}
#mapInner svg.path{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.node{position:absolute;appearance:none;border:0;background:none;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;color:#fff}
.node .gemWrap{position:relative;display:grid;place-items:center;border-radius:50%;
 background:radial-gradient(circle,rgba(255,255,255,.3) 0,rgba(255,255,255,.08) 55%,transparent 70%)}
.node .gemWrap svg.gem{filter:drop-shadow(0 4px 0 rgba(30,10,70,.5))}
.node .tbl{position:absolute;font-size:var(--fs);font-weight:900;text-shadow:0 3px 0 var(--ink),0 0 6px var(--ink),0 0 2px var(--ink)}
.node .nm{font-size:15px;margin-top:2px;text-shadow:0 2px 0 var(--ink);white-space:nowrap}
.node .stars{display:flex;gap:2px;margin-top:2px}
.node .stars svg{width:20px;height:20px}
.node.locked .gemWrap{opacity:.8}
.node .lock{position:absolute;right:-4px;bottom:-2px;width:38%;height:38%}
.node .lock svg{width:100%;height:100%}
.node.cur .gemWrap{animation:nodePulse 1.3s ease-in-out infinite}
@keyframes nodePulse{0%,100%{box-shadow:0 0 24px 6px rgba(255,230,120,.6)}50%{box-shadow:0 0 0 8px rgba(255,255,255,.25),0 0 40px 14px rgba(255,230,120,.85)}}
.node.mast .gemWrap{box-shadow:0 0 0 5px #ffd84a,0 0 26px 6px rgba(255,216,74,.7)}
.node .crown{position:absolute;top:-14%;right:-14%;width:44%;transform:rotate(22deg)}
.node .crown svg{width:100%;height:auto}
.node .lanternMini{position:absolute;top:8%;left:-40%;width:40%;animation:bob 2.4s ease-in-out infinite;filter:drop-shadow(0 0 10px #ffd84a)}
.node .lanternMini svg{width:100%;height:auto}
.zoneTag{position:absolute;font-size:13px;padding:3px 10px;border-radius:12px;background:rgba(30,10,70,.6);border:2px solid rgba(255,255,255,.4);white-space:nowrap;transform:translateX(-50%);pointer-events:none}
.mapStats{display:flex;align-items:center;gap:6px;font-size:22px;font-weight:900;background:rgba(30,10,70,.45);border:3px solid rgba(255,255,255,.5);border-radius:30px;padding:2px 14px 2px 6px;text-shadow:0 2px 0 var(--ink);flex:none}
.mapStats svg{width:36px;height:36px}
#tunnelBtn{position:fixed;z-index:8;right:calc(var(--sr) + 14px);bottom:calc(var(--sb) + 14px)}
#tunnelBtn svg{width:40px;height:40px}
@media (max-width:480px){#map .panelTitle{display:none}}
.mapStats{margin-left:auto}
/* play */
.streak{flex:1;min-width:0;height:60px;display:flex;align-items:center;gap:6px;background:rgba(30,10,70,.5);border:3px solid rgba(255,255,255,.5);border-radius:30px;padding:0 10px 0 6px;transition:background .3s,border-color .3s,box-shadow .3s}
.streak .sIcon{width:40px;height:40px;flex:none}
.streak .sIcon svg,.streak .sNext svg{width:100%;height:100%;display:block}
.streak .sNum{font-size:28px;font-weight:900;text-shadow:0 2px 0 var(--ink);min-width:26px;text-align:center;line-height:1}
.streak .sLbl{font-size:12px;opacity:.9;line-height:1}
.streak .sBar{flex:1;min-width:20px;height:14px;border-radius:7px;background:rgba(255,255,255,.2);overflow:hidden;border:2px solid rgba(255,255,255,.5)}
.streak .sBar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff9ee6,#ffe873);border-radius:5px;transition:width .4s}
.streak .sNext{width:34px;height:40px;flex:none}
.streak.hot{background:rgba(255,160,40,.35);border-color:#ffe873;box-shadow:0 0 18px rgba(255,220,100,.7)}
.streak.rest{background:rgba(90,160,255,.45);border-color:#bfe2ff}
.main{flex:1;min-height:0;display:grid;gap:10px;margin-top:8px}
@media (min-aspect-ratio:1/1){.main{grid-template-columns:1.2fr 1fr;grid-template-rows:minmax(0,1fr)}}
@media (max-aspect-ratio:1/1){.main{grid-template-rows:minmax(0,1fr) auto}}
.stage{position:relative;min-height:0;min-width:0;border-radius:28px;overflow:hidden;
 background:radial-gradient(ellipse at 50% 45%,rgba(20,5,50,.85) 0,rgba(40,15,90,.55) 35%,rgba(70,30,140,.25) 70%,transparent 100%)}
.stageHead{position:absolute;top:4px;left:68px;right:68px;text-align:center;z-index:2}
.secName{font-size:17px;font-weight:900;text-shadow:0 2px 0 var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{display:flex;gap:5px;justify-content:center;margin-top:4px;flex-wrap:wrap}
.dots i{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.25);border:2px solid rgba(255,255,255,.6)}
.dots i.done{background:#ffe873;border-color:#fff}
.dots i.now{background:#ff86cf;border-color:#fff;transform:scale(1.3)}
.dots i.boss{border-radius:3px;transform:rotate(45deg);background:rgba(255,120,200,.35)}
.dots i.boss.now{background:#ff86cf;transform:rotate(45deg) scale(1.3)}
.doorBox{position:absolute;left:0;right:0;top:56px;bottom:4px;display:grid;place-items:center}
.door{position:relative;transform-origin:50% 90%}
.door svg.dsvg{width:100%;height:100%;display:block;overflow:visible}
.door .q{position:absolute;left:0;right:0;top:44%;transform:translateY(-50%);text-align:center;font-weight:900;color:#fff;white-space:nowrap;
 text-shadow:0 3px 0 #4a1f8f,0 0 10px #4a1f8f,0 0 3px #4a1f8f;line-height:1;transition:opacity .2s}
.door.boss .q{top:58%}
.door .q .eq{display:block;font-size:.62em;margin-top:.18em}
.door .q .eq b{display:inline-block;min-width:1.6em;border-bottom:4px dashed rgba(255,255,255,.8)}
.door .tag{position:absolute;left:50%;top:15%;transform:translateX(-50%);font-size:14px;background:#ffe873;color:#5a2a00;padding:3px 10px;border-radius:12px;white-space:nowrap;font-weight:900;z-index:2}
.door.boss .tag{top:-2%}
.door.enter{animation:doorIn .55s cubic-bezier(.2,1.4,.4,1)}
@keyframes doorIn{from{transform:scale(.55);opacity:0}to{transform:scale(1);opacity:1}}
.door.wobble{animation:wobble .6s ease}
@keyframes wobble{0%,100%{transform:rotate(0)}20%{transform:rotate(-4deg)}40%{transform:rotate(4deg)}60%{transform:rotate(-2.5deg)}80%{transform:rotate(2deg)}}
.door.broken .slab,.door.broken .q,.door.broken .fac,.door.broken .tag{opacity:0;transition:opacity .08s}
.door .lockGem{transition:transform .4s,opacity .4s;transform-box:fill-box;transform-origin:center}
.door .lockGem.pop{transform:translateY(-30px) scale(1.6);opacity:0}
.shard{position:fixed;left:0;top:0;pointer-events:none;z-index:40;background:linear-gradient(135deg,#d9f9ff,#b79bff 50%,#ff9fe0)}
.shard.gold{background:linear-gradient(135deg,#fff6c4,#ffcf3a 50%,#ff9d2e)}
.flyGem{position:fixed;left:0;top:0;pointer-events:none;z-index:55;will-change:transform}
.lantern{position:absolute;left:6px;bottom:4px;z-index:3;pointer-events:none;transition:filter .5s;filter:drop-shadow(0 0 10px rgba(255,216,74,.7))}
.lantern svg{width:100%;height:auto;display:block}
.lantern.l1{filter:drop-shadow(0 0 16px #ffe873) drop-shadow(0 0 34px rgba(255,200,80,.9))}
.lantern.l2{filter:drop-shadow(0 0 18px #ffb3ef) drop-shadow(0 0 40px rgba(170,140,255,.95))}
.lantern.l3{filter:drop-shadow(0 0 20px #fff27a) drop-shadow(0 0 54px rgba(255,190,40,1))}
.lantern.l1 svg,.lantern.l2 svg,.lantern.l3 svg{animation:bob 1.6s ease-in-out infinite}
.bubble{position:absolute;z-index:7;left:8px;bottom:calc(var(--lh,90px) + 8px);max-width:min(80%,330px);background:#fff;color:var(--ink);font-size:17px;font-weight:900;
 border-radius:18px;padding:8px 14px;box-shadow:0 4px 0 rgba(30,10,70,.4);opacity:0;transform:translateY(8px) scale(.9);transition:opacity .25s,transform .25s;pointer-events:none}
.bubble.on{opacity:1;transform:none}
.bubble:after{content:"";position:absolute;left:28px;bottom:-10px;border:10px solid transparent;border-top-color:#fff;border-bottom:0}
.padT{position:absolute;top:4px;right:4px;z-index:8;font-size:17px}
.answers{min-height:0;display:flex;align-items:center;justify-content:center}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%;max-width:560px;padding:4px 4px 10px}
.choices .btn{font-size:clamp(32px,7.5vmin,52px);min-height:clamp(72px,14vmin,118px);border-radius:26px}
.choices .btn:nth-child(2){--c1:#5ef0e6;--c2:#14a9bb;--sh:#0c6c7a}
.choices .btn:nth-child(3){--c1:#c29cff;--c2:#7a45e6;--sh:#4a2296}
.choices .btn:nth-child(4){--c1:#7cc4ff;--c2:#3a7bf0;--sh:#1f4ca6}
.choices .btn.nope,.btn.nope{--c1:#b7b0d0;--c2:#857ca8;--sh:#565078;opacity:.55;animation:nopeShake .45s ease}
@keyframes nopeShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.choices .btn.yes{--c1:#ffe873;--c2:#ffad1a;--sh:#b56a00;color:#5a2a00;animation:pulse .5s ease}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:420px;padding:4px 4px 10px}
.pad .btn{font-size:clamp(26px,5.5vmin,38px);min-height:clamp(58px,9vmin,80px);border-radius:20px;padding:0}
.pad .go{--c1:#8cf27f;--c2:#29b85a;--sh:#167237}
.pad .del{--c1:#ffb37c;--c2:#f0703a;--sh:#a6431c}
@media (min-aspect-ratio:1/1) and (max-height:520px){.pad{gap:8px;padding-bottom:6px}.pad .btn{min-height:58px}.choices{gap:12px}.choices .btn{min-height:min(118px,calc((100vh - 130px)/2))}}
/* hint */
.hint{position:absolute;inset:0;z-index:9;background:linear-gradient(180deg,#2a0f60,#1a0a46);border-radius:28px;border:3px solid rgba(160,255,170,.7);
 display:flex;flex-direction:column;padding:10px;gap:6px;animation:fadeIn .3s}
.hint[hidden]{display:none!important}
.hint.wide{flex-direction:row}
.hint .hl{display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center;flex:none}
.hint.wide .hl{width:42%}
.hint .hTop{display:flex;align-items:center;gap:8px}
.hint.wide .hTop{flex-direction:column}
.hint .worm{width:88px;flex:none;animation:wiggle 1.6s ease-in-out infinite}
.hint .worm svg{width:100%;height:auto;display:block}
@keyframes wiggle{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg) translateY(-3px)}}
.hint .say{background:#fff;color:var(--ink);font-size:16px;font-weight:900;border-radius:16px;padding:6px 12px;line-height:1.2}
.hint .hq{font-size:28px;font-weight:900;text-shadow:0 2px 0 var(--ink);text-align:center;white-space:nowrap}
.hint .hq b{color:#ffe873}
.hint .gridBox{flex:1;min-height:0;min-width:0;display:flex;align-items:center;justify-content:center}
.hgrid{display:flex;flex-direction:column;gap:var(--gap)}
.hrow{display:flex;align-items:center;gap:var(--gap);border-radius:12px;padding:1px 4px;cursor:pointer;transition:background .2s}
.hrow .gems{display:flex;gap:var(--gap)}
.hrow .gems span{width:var(--g);height:var(--g);display:block;opacity:.5;transition:opacity .2s,transform .2s}
.hrow .gems span svg{width:100%;height:100%;display:block}
.hrow.lit{background:rgba(255,255,255,.16)}
.hrow.lit .gems span{opacity:1;transform:scale(1.08)}
.hrow .lbl{min-width:2.2em;font-weight:900;font-size:max(15px,calc(var(--g) * .75));color:#ffe873;text-shadow:0 2px 0 var(--ink);opacity:0;transition:opacity .2s}
.hrow.lit .lbl{opacity:1}
.hint .countBtn{font-size:19px;min-height:58px;padding:6px 16px}
/* overlays */
#modal{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;background:rgba(15,5,40,.72);padding:calc(var(--st) + 10px) calc(var(--sr) + 10px) calc(var(--sb) + 10px) calc(var(--sl) + 10px)}
#modal.on{display:flex;animation:fadeIn .25s}
.card{background:linear-gradient(180deg,#5b2eb0,#3a1a84);border:4px solid #fff;border-radius:30px;padding:14px 20px;max-width:min(580px,96vw);max-height:100%;overflow:auto;
 text-align:center;box-shadow:0 12px 0 rgba(20,5,50,.6),0 0 50px rgba(255,170,255,.5);animation:pop .45s cubic-bezier(.2,1.5,.4,1);display:flex;flex-direction:column;align-items:center;gap:10px}
.card.goldC{background:linear-gradient(180deg,#ffd75e,#ff9a1f);color:#5a2a00;border-color:#fff6c4}
.card.goldC h2{text-shadow:0 2px 0 rgba(255,255,255,.7)}
.card h2{font-size:clamp(26px,6vmin,40px);text-shadow:0 3px 0 var(--ink)}
.card p{margin:0;font-size:clamp(17px,3.6vmin,22px)}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
.card .art{width:min(26vmin,160px);height:min(26vmin,160px);position:relative;display:grid;place-items:center;flex:none}
.card .art svg{width:100%;height:100%;position:relative}
.rays{position:absolute;inset:-30%;background:repeating-conic-gradient(rgba(255,255,255,.6) 0 10deg,transparent 10deg 30deg);border-radius:50%;
 -webkit-mask:radial-gradient(circle,#000 30%,transparent 70%);mask:radial-gradient(circle,#000 30%,transparent 70%);animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.bigStars{display:flex;gap:8px}

function merge(def,d){const o=JSON.parse(JSON.stringify(def));if(!isObj(d))return o;
 for(const k in d){const dv=d[k];if(!(k in def)){o[k]=dv;continue;}const fv=def[k];
  if(Array.isArray(fv)){if(Array.isArray(dv))o[k]=dv;}
  else if(isObj(fv)){if(isObj(dv))o[k]=Object.keys(fv).length?merge(fv,dv):dv;}
  else if(dv!=null&&typeof dv===typeof fv)o[k]=dv;}
 return o;}
function load(){const ls=k=>{try{return localStorage.getItem(k);}catch(e){return null;}},put=(k,v)=>{try{localStorage.setItem(k,v);}catch(e){}};
 const raw=ls(KEY);let d=null,s;
 if(raw!=null){try{d=JSON.parse(raw);}catch(e){d=null;}
  // a save we can't read is copied aside BEFORE anything can overwrite it
  if(!isObj(d)){d=null;put(ls(KEY+'.bad')==null?KEY+'.bad':KEY+'.bad2',raw);}}
 if(d){if((d.v|0)<3&&ls(KEY+'.pre-v3')==null)put(KEY+'.pre-v3',raw); // one-time copy of the v2 save before the v3 upgrade
  s=merge(DEF,d);}
 else{s=merge(DEF,{});let o=null;try{o=JSON.parse(ls(V1KEY)||'null');}catch(e){}
  if(isObj(o)){for(const k in DEF){if(k!=='v'&&o[k]!=null&&typeof o[k]===typeof DEF[k]&&Array.isArray(o[k])===Array.isArray(DEF[k]))s[k]=o[k];}s.migrated=1;s.seenV2=false;
   // every finished v1 table becomes a finished Learn level (stars kept), so Practice opens right away
   const sec=isObj(o.sec)?o.sec:{};
   TABLES.forEach(t=>{const r=sec[t];if(r&&r.done)s.lv['t'+t+'-0']={stars:Math.max(1,Math.min(3,r.stars|0)),done:true,plays:r.plays|0};});
   put(KEY,JSON.stringify(s));}}
 s.v=3;if(!(s.diff>=0&&s.diff<=2))s.diff=0;
 const p=s.parent;['add','sub'].forEach(k=>{if([20,100,1000].indexOf(p.max[k])<0)p.max[k]=1000;});if(p.divT!=='easy')p.divT='all';
 if(!SEC_ORDER.some(k=>p.on[k]))p.on.mul=true;
 return s;}

function stageVisible(st){const p=save.parent;if(st.sec==='add'||st.sec==='sub')return !st.lim||st.lim<=p.max[st.sec];if(st.sec==='div'&&st.t&&p.divT==='easy')return [2,5,10].indexOf(st.t)>=0;return true;}

function asModel(q){const a=q.a,b=q.b,r=resOf(q),m=q.miss|0;let op,X,Y,R;
 if(q.op==='add'){if(m===1){op='sub';X=r;Y=b;R=a;}else if(m===2){op='sub';X=r;Y=a;R=b;}else{op='add';X=a;Y=b;R=r;}}
 else{if(m===1){op='add';X=r;Y=b;R=a;}else if(m===2){op='sub';X=a;Y=r;R=b;}else{op='sub';X=a;Y=b;R=r;}}
 const o={qop:q.op,miss:m,a,b,r,op,X,Y,R,think:m?'Think: '+X+(op==='add'?' + ':' − ')+Y+'! ':''};

function tenModel(m){const {qop,miss,a,b,r}=m,cells=[],steps=[],P=(t,lit,x)=>cells.push({t,lit:!!lit,x:!!x}),run=arr=>arr.slice(-6).join(', ');let intro;
 if(qop==='add'){
  if(miss===1){for(let i=0;i<a;i++)P('p');for(let i=0;i<b;i++)P('t',1);intro=r+' gems in all, and '+b+' are blue. How many pink? Count them!';
   for(let j=1;j<=a;j++)steps.push({i:j-1,txt:run(range(1,j))+(j===a?'! There are '+a+' pink gems!':'...')});}
  else if(miss===2){for(let i=0;i<a;i++)P('p',1);for(let i=0;i<b;i++)P('t');intro='Start at '+a+' and count on until you reach '+r+'!';
   for(let j=1;j<=b;j++)steps.push({i:a+j-1,txt:run(range(a+1,a+j))+(j===b?'! We counted on '+b+'!':'...')});}
  else{for(let i=0;i<a;i++)P('p',1);for(let i=0;i<b;i++)P('t');intro=a+' pink gems and '+b+' blue gems. Start at '+a+' and count on!';
   for(let j=1;j<=b;j++)steps.push({i:a+j-1,txt:run(range(a+1,a+j))+(j===b?'! That makes '+r+'!':'...')});}}
 else{
  if(miss===1){for(let i=0;i<r;i++)P('p');for(let i=0;i<b;i++)P('p',0,1);intro=r+' gems were left after '+b+' were taken away. Count them all!';
   for(let j=1;j<=a;j++)steps.push({i:j-1,txt:run(range(1,j))+(j===a?'! There were '+a+' gems!':'...')});}
  else if(miss===2){for(let i=0;i<a;i++)P('p',1);intro='Start with '+a+'. Take gems away until '+r+' are left!';
   for(let j=1;j<=b;j++)steps.push({i:a-j,x:1,txt:'Take away '+j+'... '+(a-j)+' left'+(j===b?'. We took away '+b+'!':'')});}
  else{for(let i=0;i<a;i++)P('p',1);intro='Start with '+a+' gems. Take away '+b+'. Count back!';
   for(let j=1;j<=b;j++)steps.push({i:a-j,x:1,txt:run(range(a-j,a-1).reverse())+(j===b?'! '+r+' left!':'...')});}}
 return {kind:'ten',cells,steps,intro};}
function colModel(m){const {op,X,Y,R}=m,nd=Math.max(2,nDig(Math.max(X,Y,R))),xd=[],yd=[],rd=[],steps=[];
 for(let c=0;c<nd;c++){xd.push(dg(X,c));yd.push(dg(Y,c));}
 const xw=xd.slice();let carry=0;
 for(let c=0;c<nd;c++){const st={c,carryTo:-1,txt:''};
  if(op==='add'){const s=xd[c]+yd[c]+carry;rd[c]=s%10;
   st.txt=PLC[c]+': '+xd[c]+' + '+yd[c]+(carry?' + 1 carried':'')+' = '+s+'.'+(s>=10?' Keep '+(s%10)+', carry 1 ten to the '+PLN[c+1]+'!':'');
   if(s>=10)st.carryTo=c+1;carry=s>=10?1:0;}
  else{let note='';
   if(xw[c]<yd[c]){let j=c+1;while(j<nd-1&&xw[j]===0)j++;
    note=(j>c+1?xw[c]+' − '+yd[c]+'? Not enough, and no '+PLN[c+1]+'! Break 1 of the '+PLN[j]+' first. ':xw[c]+' − '+yd[c]+'? Not enough! Break 1 of the '+PLN[c+1]+' into 10 '+PLN[c]+'. ');
    xw[j]--;for(let k=j-1;k>c;k--)xw[k]+=9;xw[c]+=10;}
   rd[c]=xw[c]-yd[c];st.txt=PLC[c]+': '+note+xw[c]+' − '+yd[c]+' = '+rd[c]+'.';}
  st.xs=xw.slice();steps.push(st);}
 steps[nd-1].txt+=(m.miss?' So the missing number is ':' The answer is ')+R+'!';
 return {kind:'col',nd,X,Y,R,op,xd,yd,rd,steps,intro:m.think+'Let\'s do it column by column. Start with the ones!'};}
