<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3aa59a">
<meta name="description" content="Coach Sunny: a friendly beginner yoga and stretching coach for grown-ups and kids.">
<title>Yoga Coach · Coach Sunny</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="stylesheet" href="./style.css">
</head>
<body class="theme-calm">
<header id="top">
  <button class="iconbtn" id="homeBtn" aria-label="Home"><span class="sun">🌞</span></button>
  <div class="ttl" id="ttl">Yoga Coach</div>
  <button class="pill" id="profBtn" aria-label="Switch profile"></button>
  <button class="iconbtn" id="muteBtn" aria-label="Voice on/off">🔊</button>
  <button class="iconbtn" id="fsBtn" aria-label="Fullscreen">⛶</button>
  <button class="iconbtn" id="setBtn" aria-label="Settings">⚙️</button>
</header>
<main id="main" tabindex="-1"></main>
<nav id="tabs">
  <button data-go="home" class="on"><span>🏠</span>Home</button>
  <button data-go="journey"><span>🗺️</span>Journey</button>
  <button data-go="learn"><span>📖</span>Poses</button>
  <button data-go="family"><span>👨‍👧</span>Family</button>
  <button data-go="progress"><span>📈</span>Progress</button>
</nav>
<div id="caption" aria-live="polite"></div>
<div id="toast" role="status"></div>
<div id="modal" hidden></div>
<noscript>Please enable JavaScript to use Yoga Coach.</noscript>
<script type="module" src="./app.js"></script>
</body>
</html>
