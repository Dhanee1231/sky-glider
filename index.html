<script>
(function(){
'use strict';
// ================= core =================
const cv=document.getElementById('c');
const ctx=cv.getContext('2d',{alpha:false});
const safeEl=document.getElementById('safe');
let W=1,H=1,DPR=1,UI=1,SAFE={t:0,r:0,b:0,l:0};
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t, rand=(a,b)=>a+Math.random()*(b-a);
const hash=n=>{const s=Math.sin(n*127.1+311.7)*43758.5453;return s-Math.floor(s);};
const FONT='"Arial Rounded MT Bold","Nunito","Baloo 2","Comic Sans MS","Trebuchet MS",Roboto,sans-serif';
const INK='#2b2b55';
let T=0, TS=1; // global time, time-scale (test hook)

// ================= save =================
const KEY='skyglider.v1';
const save={total:0,races:0,stickers:0,color:4,shape:1,pattern:0,muted:false,tilt:false,world:0,wins:0,best:{}};
try{Object.assign(save,JSON.parse(localStorage.getItem(KEY)||'{}'));}catch(e){}
if(!save.best||typeof save.best!=='object')save.best={};
function persist(){try{localStorage.setItem(KEY,JSON.stringify(save));}catch(e){}}

// ================= data =================
const COLORS=[
 {c:'#ff5a6e',d:'#cf3850'},{c:'#ff9f1c',d:'#d27a00'},{c:'#ffd93d',d:'#d9ac00'},
 {c:'#4cd07d',d:'#2a9f58'},{c:'#4d96ff',d:'#2d6dd2'},{c:'#b57bff',d:'#8a4fe0'},
 {c:'#ff8fd8',d:'#de5fb3',need:30},{c:'gold',d:'#c99400',need:80},
 {c:'rainbow',d:'#8f55e8',need:150},{c:'galaxy',d:'#22145e',need:250}];
const SHAPES=[
 {name:'Dart',speed:1.08,steer:0.85,lift:1.0,bonk:1.0,trick:1},
 {name:'Glider',speed:1.0,steer:0.9,lift:1.5,bonk:0.7,trick:1},
 {name:'Stunt',speed:1.0,steer:1.25,lift:1.0,bonk:0.85,trick:2}];
const PATTERNS=['none','dots','stripes','stars','hearts'];
const WORLDS=[{name:'Backyard',track:1},{name:'Beach',track:2},{name:'Space',track:3,needRaces:1}];
const worldOpen=i=>!WORLDS[i].needRaces||save.races>=WORLDS[i].needRaces;
const PAL={G:['#45d36a','#279a48'],Y:['#ffcf3d','#d49b00'],B:['#4aa8ff','#2a74cf'],P:['#b77bff','#8247dc'],
 O:['#ff8f3d','#cf621a'],R:['#ff5a7a','#c9334f'],Wt:['#ffffff','#b9c8de'],Gy:['#c3cad6','#8d96a6']};

// ================= audio =================
const mtof=m=>440*Math.pow(2,(m-69)/12);
const Snd={ac:null,master:null,mus:null,fx:null,nb:null,lastChirp:0,
 init(){
  if(this.ac){if(this.ac.state!=='running')this.ac.resume().catch(()=>{});return;}
  const AC=window.AudioContext||window.webkitAudioContext; if(!AC)return;
  try{this.ac=new AC();}catch(e){return;}
  const ac=this.ac;
  this.master=ac.createGain();this.master.gain.value=save.muted?0:0.9;this.master.connect(ac.destination);
  this.mus=ac.createGain();this.mus.gain.value=0.3;this.mus.connect(this.master);
  this.fx=ac.createGain();this.fx.gain.value=0.85;this.fx.connect(this.master);
  const len=ac.sampleRate|0,b=ac.createBuffer(1,len,ac.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=Math.random()*2-1; this.nb=b;
  if(ac.state!=='running')ac.resume().catch(()=>{});
  Music.next=ac.currentTime+0.1;
 },
 ok(){return this.ac&&!save.muted&&this.ac.state==='running';},
 now(){return this.ac?this.ac.currentTime:0;},
 setMute(m){save.muted=m;persist();if(this.master)this.master.gain.setTargetAtTime(m?0:0.9,this.ac.currentTime,0.03);},
 tone(f,dur,type,vol,at,slide,dest){
  if(!this.ok())return; const ac=this.ac,t=Math.max(at||0,ac.currentTime);
  const o=ac.createOscillator(),g=ac.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.2,t+0.008);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(dest||this.fx);o.start(t);o.stop(t+dur+0.03);
 },
 noise(dur,vol,freq,at,ftype,dest,slide){
  if(!this.ok())return; const ac=this.ac,t=Math.max(at||0,ac.currentTime);
  const s=ac.createBufferSource();s.buffer=this.nb;
  const f=ac.createBiquadFilter();f.type=ftype||'bandpass';f.frequency.setValueAtTime(freq||1000,t);
  if(slide)f.frequency.exponentialRampToValueAtTime(slide,t+dur);
  const g=ac.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.2,t+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(f);f.connect(g);g.connect(dest||this.fx);s.start(t,Math.random()*0.5);s.stop(t+dur+0.03);
 },
 tap(){const t=this.now();this.tone(700,0.07,'sine',0.25,t,1100);},
 star(){const t=this.now();this.tone(1318,0.1,'sine',0.22,t);this.tone(1976,0.16,'sine',0.18,t+0.06);},
 ring(){const t=this.now();[784,988,1175,1568].forEach((f,i)=>this.tone(f,0.14,'triangle',0.2,t+i*0.05));},
 bonk(){const t=this.now();this.tone(420,0.42,'triangle',0.45,t,110);this.tone(880,0.18,'sine',0.18,t,300);
  // "boing" wobble
  for(let i=0;i<5;i++)this.tone(260+(i%2)*90,0.08,'sine',0.12,t+0.12+i*0.06);},
 whoosh(){const t=this.now();this.noise(0.5,0.3,400,t,'bandpass',null,3000);},
 loop(){const t=this.now();this.tone(300,0.55,'triangle',0.25,t,1400);this.tone(600,0.5,'sine',0.12,t+0.05,2400);this.noise(0.5,0.12,800,t,'bandpass',null,4000);},
 beep(go){const t=this.now();if(go){this.tone(1046,0.4,'square',0.14,t);this.tone(1568,0.4,'triangle',0.16,t);}else this.tone(523,0.18,'square',0.13,t);},
 cheer(){const t=this.now();[523,659,784,1046,784,1046,1318].forEach((f,i)=>this.tone(f,0.22,'triangle',0.2,t+i*0.09));
  this.noise(1.2,0.08,3000,t,'highpass');},
 chirp(){const t=this.now();if(t-this.lastChirp<0.35)return;this.lastChirp=t;
  this.tone(2300,0.07,'sine',0.12,t,3100);this.tone(2500,0.09,'sine',0.12,t+0.09,3300);},
 pop(){const t=this.now();this.tone(900,0.08,'sine',0.25,t,300);this.noise(0.06,0.2,2000,t);},
 sticker(){const t=this.now();[1046,1318,1568,2093].forEach((f,i)=>this.tone(f,0.25,'sine',0.16,t+i*0.07));}
};
// ================= music =================
const MEL=[72,null,76,79,76,null,74,72, 74,null,79,null,79,77,76,74, 76,null,72,76,81,null,79,76, 77,null,76,74,72,null,null,null];
const PROG=[60,55,57,53], CH=[[0,4,7],[0,4,7],[0,3,7],[0,4,7]];
const TRACKS=[
 {bpm:104,tp:0,lead:'triangle',drums:1},   // menu
 {bpm:128,tp:0,lead:'square',drums:2},     // backyard
 {bpm:118,tp:5,lead:'triangle',drums:2},   // beach
 {bpm:110,tp:-3,lead:'sine',drums:1},      // space
 {bpm:120,tp:2,lead:'triangle',drums:2}];  // finish
const Music={track:-1,next:0,step:0,
 play(tr){if(this.track===tr)return;this.track=tr;this.step=0;this.next=Snd.now()+0.12;},
 update(){
  const ac=Snd.ac; if(!ac)return;
  if(this.track<0||!Snd.ok()||document.hidden){this.next=ac.currentTime+0.1;return;}
  const tr=TRACKS[this.track],spb=60/tr.bpm/2;
  if(this.next<ac.currentTime-0.3)this.next=ac.currentTime+0.05;
  while(this.next<ac.currentTime+0.22){this.playStep(tr,this.step,this.next,spb);this.step=(this.step+1)%64;this.next+=spb;}
 },
 playStep(tr,s,t,spb){
  const bar=(s>>3)%4,i=s%8,root=PROG[bar]+tr.tp,M=Snd.mus;
  if(i===0||i===3||i===4||i===6)Snd.tone(mtof(root-24+(i===6?7:0)),spb*1.5,'triangle',0.34,t,null,M);
  if(i%2===1)for(const iv of CH[bar])Snd.tone(mtof(root+iv),spb*0.7,'square',0.028,t,null,M);
  if(s<32){const m=MEL[s];if(m!=null)Snd.tone(mtof(m+tr.tp),spb*1.6,tr.lead,tr.lead==='square'?0.07:0.14,t,null,M);}
  else{const arp=[0,7,12,CH[bar][1]+12,7,12,19,12];Snd.tone(mtof(root+12+arp[i]),spb*1.2,'sine',0.11,t,null,M);
   if(i===0){const m=MEL[(s-32)];if(m!=null)Snd.tone(mtof(m+tr.tp),spb*3,tr.lead,tr.lead==='square'?0.06:0.12,t,null,M);}}
  if(tr.drums){
   if(i===0||i===4)Snd.tone(150,0.16,'sine',0.5,t,45,M);
   if(tr.drums>1&&(i===2||i===6))Snd.noise(0.12,0.18,1800,t,'highpass',M);
   Snd.noise(0.03,i%2?0.05:0.08,8000,t,'highpass',M);
  }
 }
};
// ================= draw helpers =================
function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function circ(x,y,r){ctx.beginPath();ctx.arc(x,y,Math.max(0.1,r),0,TAU);}
function fillStroke(f,s,lw){ctx.fillStyle=f;ctx.fill();if(s){ctx.strokeStyle=s;ctx.lineWidth=lw||2;ctx.stroke();}}
function starPath(x,y,R,r,n){n=n||5;ctx.beginPath();for(let i=0;i<n*2;i++){const a=-Math.PI/2+i*Math.PI/n,rad=i%2?r:R;ctx.lineTo(x+Math.cos(a)*rad,y+Math.sin(a)*rad);}ctx.closePath();}
function heartPath(x,y,s){ctx.beginPath();ctx.moveTo(x,y+s*0.35);ctx.bezierCurveTo(x-s*1.1,y-s*0.35,x-s*0.45,y-s*1.05,x,y-s*0.45);ctx.bezierCurveTo(x+s*0.45,y-s*1.05,x+s*1.1,y-s*0.35,x,y+s*0.35);ctx.closePath();}
function poly(pts){ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);ctx.closePath();}
function text(s,x,y,size,fill,align,stroke,lw){
 ctx.font='900 '+Math.round(size)+'px '+FONT;ctx.textAlign=align||'center';ctx.textBaseline='middle';
 if(stroke!==null){ctx.lineWidth=lw||Math.max(2,size*0.18);ctx.strokeStyle=stroke||INK;ctx.strokeText(s,x,y);}
 ctx.fillStyle=fill||'#fff';ctx.fillText(s,x,y);}
function cloud(x,y,s,col){ctx.fillStyle=col||'#fff';ctx.beginPath();ctx.arc(x,y,s,0,TAU);ctx.arc(x+s*0.9,y+s*0.15,s*0.75,0,TAU);ctx.arc(x-s*0.9,y+s*0.2,s*0.7,0,TAU);ctx.arc(x+s*0.3,y-s*0.5,s*0.7,0,TAU);ctx.fill();}
function face(x,y,s,mood){ // eyes + smile, mood 0 happy 1 surprised
 ctx.fillStyle=INK;circ(x-s*0.35,y-s*0.1,s*0.12);ctx.fill();circ(x+s*0.35,y-s*0.1,s*0.12);ctx.fill();
 ctx.strokeStyle=INK;ctx.lineWidth=s*0.09;ctx.lineCap='round';ctx.beginPath();
 if(mood===1){circ(x,y+s*0.3,s*0.12);ctx.fill();}else{ctx.arc(x,y+s*0.12,s*0.25,0.15*Math.PI,0.85*Math.PI);ctx.stroke();}
 ctx.fillStyle='rgba(255,110,140,.55)';circ(x-s*0.6,y+s*0.15,s*0.12);ctx.fill();circ(x+s*0.6,y+s*0.15,s*0.12);ctx.fill();}

// ================= icons (centered, size s ~ radius) =================
const ICON={
 play(s){poly([[-s*0.28,-s*0.42],[s*0.46,0],[-s*0.28,s*0.42]]);},
 pause(s){rr(-s*0.38,-s*0.4,s*0.27,s*0.8,s*0.08);ctx.fill();ctx.stroke();rr(s*0.11,-s*0.4,s*0.27,s*0.8,s*0.08);},
 back(s){poly([[-s*0.5,0],[0,-s*0.45],[0,-s*0.18],[s*0.45,-s*0.18],[s*0.45,s*0.18],[0,s*0.18],[0,s*0.45]]);},
 home(s){poly([[0,-s*0.5],[s*0.5,-s*0.02],[s*0.33,-s*0.02],[s*0.33,s*0.45],[-s*0.33,s*0.45],[-s*0.33,-s*0.02],[-s*0.5,-s*0.02]]);},
 up(s){poly([[0,-s*0.5],[s*0.48,0],[s*0.2,0],[s*0.2,s*0.45],[-s*0.2,s*0.45],[-s*0.2,0],[-s*0.48,0]]);},
 down(s){poly([[0,s*0.5],[s*0.48,0],[s*0.2,0],[s*0.2,-s*0.45],[-s*0.2,-s*0.45],[-s*0.2,0],[-s*0.48,0]]);},
 star(s){starPath(0,0,s*0.5,s*0.22);},
 speaker(s,on){poly([[-s*0.45,-s*0.15],[-s*0.2,-s*0.15],[s*0.08,-s*0.42],[s*0.08,s*0.42],[-s*0.2,s*0.15],[-s*0.45,s*0.15]]);ctx.fill();ctx.stroke();
  ctx.lineCap='round';ctx.lineWidth=s*0.1;
  if(on){ctx.strokeStyle='#fff';ctx.beginPath();ctx.arc(s*0.12,0,s*0.25,-0.8,0.8);ctx.stroke();ctx.beginPath();ctx.arc(s*0.12,0,s*0.42,-0.8,0.8);ctx.stroke();}
  else{ctx.strokeStyle='#fff';ctx.beginPath();ctx.moveTo(s*0.22,-s*0.18);ctx.lineTo(s*0.5,s*0.18);ctx.moveTo(s*0.5,-s*0.18);ctx.lineTo(s*0.22,s*0.18);ctx.stroke();}
  ctx.beginPath();},
 fs(s){ctx.lineCap='round';ctx.lineJoin='round';const a=s*0.42,b=s*0.16;ctx.lineWidth=s*0.13;ctx.strokeStyle='#fff';ctx.beginPath();
  for(const[sx,sy] of [[-1,-1],[1,-1],[1,1],[-1,1]]){ctx.moveTo(sx*a,sy*(a-b)*1);ctx.lineTo(sx*a,sy*a);ctx.lineTo(sx*(a-b),sy*a);}
  ctx.stroke();ctx.beginPath();},
 tilt(s){ctx.save();ctx.rotate(-0.35);rr(-s*0.22,-s*0.4,s*0.44,s*0.8,s*0.1);ctx.fill();ctx.stroke();ctx.fillStyle=INK;circ(0,s*0.3,s*0.05);ctx.fill();ctx.restore();
  ctx.lineWidth=s*0.08;ctx.strokeStyle='#fff';ctx.beginPath();ctx.arc(0,0,s*0.5,-2.6,-1.9);ctx.stroke();ctx.beginPath();ctx.arc(0,0,s*0.5,0.5,1.2);ctx.stroke();ctx.beginPath();},
 touch(s){circ(0,s*0.05,s*0.2);ctx.fill();ctx.stroke();ctx.lineWidth=s*0.08;ctx.strokeStyle='#fff';ctx.beginPath();ctx.arc(0,s*0.05,s*0.34,0,TAU);ctx.stroke();ctx.globalAlpha=0.6;ctx.beginPath();ctx.arc(0,s*0.05,s*0.48,0,TAU);ctx.stroke();ctx.globalAlpha=1;ctx.beginPath();},
 book(s){poly([[0,-s*0.28],[-s*0.48,-s*0.4],[-s*0.48,s*0.35],[0,s*0.45]]);ctx.fill();ctx.stroke();poly([[0,-s*0.28],[s*0.48,-s*0.4],[s*0.48,s*0.35],[0,s*0.45]]);ctx.fill();ctx.stroke();
  ctx.fillStyle='#ffd93d';starPath(-s*0.24,0,s*0.17,s*0.08);ctx.fill();ctx.fillStyle='#ff6f9c';heartPath(s*0.24,s*0.05,s*0.16);ctx.fill();ctx.beginPath();},
 replay(s){ctx.lineCap='round';ctx.lineWidth=s*0.17;ctx.strokeStyle=INK;ctx.beginPath();ctx.arc(0,0,s*0.34,-1.2,4.2);ctx.stroke();ctx.lineWidth=s*0.1;ctx.strokeStyle='#fff';ctx.stroke();
  ctx.fillStyle='#fff';ctx.strokeStyle=INK;ctx.lineWidth=s*0.06;const a=-1.2,x=Math.cos(a)*s*0.34,y=Math.sin(a)*s*0.34;poly([[x+s*0.2,y-s*0.04],[x-s*0.08,y-s*0.2],[x-s*0.02,y+s*0.15]]);},
 map(s){poly([[-s*0.48,-s*0.3],[-s*0.16,-s*0.42],[s*0.16,-s*0.3],[s*0.48,-s*0.42],[s*0.48,s*0.3],[s*0.16,s*0.42],[-s*0.16,s*0.3],[-s*0.48,s*0.42]]);ctx.fill();ctx.stroke();
  ctx.fillStyle='#ff5a6e';circ(s*0.05,-s*0.06,s*0.14);ctx.fill();poly([[s*0.05-s*0.12,0],[s*0.05+s*0.12,0],[s*0.05,s*0.25]]);ctx.fill();ctx.fillStyle='#fff';circ(s*0.05,-s*0.06,s*0.05);ctx.fill();ctx.beginPath();},
 loop(s){ctx.lineCap='round';ctx.lineWidth=s*0.17;ctx.strokeStyle=INK;ctx.beginPath();ctx.moveTo(-s*0.5,s*0.32);ctx.bezierCurveTo(s*0.1,s*0.35,s*0.55,s*0.1,s*0.35,-s*0.25);ctx.bezierCurveTo(s*0.15,-s*0.6,-s*0.4,-s*0.4,-s*0.15,-s*0.05);ctx.bezierCurveTo(0,s*0.15,s*0.3,s*0.3,s*0.5,s*0.3);ctx.stroke();
  ctx.lineWidth=s*0.09;ctx.strokeStyle='#fff';ctx.stroke();ctx.fillStyle='#fff';ctx.strokeStyle=INK;ctx.lineWidth=s*0.05;poly([[s*0.56,s*0.3],[s*0.32,s*0.14],[s*0.38,s*0.42]]);},
 lock(s){ctx.lineWidth=s*0.12;ctx.strokeStyle=INK;ctx.beginPath();ctx.arc(0,-s*0.08,s*0.24,Math.PI,0);ctx.stroke();ctx.lineWidth=s*0.06;ctx.strokeStyle='#ddd';ctx.stroke();
  ctx.lineWidth=s*0.06;ctx.strokeStyle=INK;rr(-s*0.34,-s*0.1,s*0.68,s*0.52,s*0.08);ctx.fillStyle='#ffcf3d';},
 check(s){poly([[-s*0.45,0],[-s*0.15,s*0.32],[s*0.48,-s*0.32],[s*0.36,-s*0.44],[-s*0.15,s*0.08],[-s*0.33,-s*0.12]]);}
};
function drawIcon(name,x,y,s,extra){ctx.save();ctx.translate(x,y);ctx.fillStyle='#fff';ctx.strokeStyle=INK;ctx.lineWidth=Math.max(1.5,s*0.07);ctx.lineJoin='round';
 ICON[name](s,extra);ctx.fill();ctx.stroke();ctx.restore();}

// ================= paper planes =================
const PL=[
 {wing:[[50,2],[-44,-26],[-28,0]],keel:[[50,2],[-28,0],[-40,16]],eye:[16,-4,5]},
 {wing:[[44,2],[-36,-34],[-42,-22],[-22,0]],keel:[[44,2],[-22,0],[-32,16]],eye:[12,-5,5.5]},
 {wing:[[40,2],[-30,-22],[-22,0]],keel:[[40,2],[-22,0],[-32,14]],fin:[[-16,0],[-38,-32],[-30,-2]],eye:[10,-3,5]}];
const RAINBOW=['#ff5a5a','#ffa53d','#ffe14d','#5cd65c','#4da6ff','#a066ff'];
function paperFill(col){
 if(col.c==='rainbow'){const g=ctx.createLinearGradient(-40,-30,45,10);RAINBOW.forEach((k,i)=>g.addColorStop(i/5,k));return g;}
 if(col.c==='galaxy'){const g=ctx.createLinearGradient(-40,-30,45,10);g.addColorStop(0,'#2a1a6e');g.addColorStop(0.5,'#7a35c8');g.addColorStop(1,'#1d4aa0');return g;}
 if(col.c==='gold'){const g=ctx.createLinearGradient(-40,-30,45,10);g.addColorStop(0,'#ffe680');g.addColorStop(0.5,'#ffc400');g.addColorStop(1,'#fff3b0');return g;}
 return col.c;}
function drawPattern(pat,col){
 const pc=(col.c==='ffd93d'||col.c==='gold')?'rgba(255,255,255,.75)':'rgba(255,255,255,.7)';
 ctx.fillStyle=pc;ctx.strokeStyle=pc;
 if(pat===1){for(let x=-50;x<55;x+=12)for(let y=-36;y<20;y+=12){circ(x+((y/12)&1)*6,y,3.2);ctx.fill();}}
 else if(pat===2){ctx.lineWidth=5;ctx.beginPath();for(let x=-90;x<60;x+=14){ctx.moveTo(x,20);ctx.lineTo(x+40,-40);}ctx.stroke();}
 else if(pat===3){for(let x=-46;x<55;x+=16)for(let y=-34;y<20;y+=14){starPath(x+((y/14)&1)*8,y,4.5,2);ctx.fill();}}
 else if(pat===4){ctx.fillStyle='rgba(255,120,170,.9)';for(let x=-46;x<55;x+=16)for(let y=-34;y<20;y+=14){heartPath(x+((y/14)&1)*8,y+2,4.5);ctx.fill();}}
}

 o=o||{};const g=PL[shape],col=typeof colIdx==='object'?colIdx:COLORS[colIdx]||COLORS[0];
 const main=paperFill(col),dark=col.d;
 ctx.lineJoin='round';
 if(g.fin){poly(g.fin);fillStroke(dark,INK,2.2);}
 poly(g.keel);fillStroke(dark,INK,2.2);
 poly(g.wing);ctx.fillStyle=main;ctx.fill();
 if(pat||col.c==='galaxy'){ctx.save();poly(g.wing);ctx.clip();drawPattern(col.c==='galaxy'&&!pat?3:pat,col);ctx.restore();}
 poly(g.wing);ctx.strokeStyle=INK;ctx.lineWidth=2.2;ctx.stroke();

 ctx.strokeStyle='rgba(255,255,255,.6)';ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(g.wing[0][0]-6,g.wing[0][1]-1);ctx.lineTo(g.wing[g.wing.length-1][0]+4,g.wing[g.wing.length-1][1]-2);ctx.stroke();
 if(o.noFace)return;

 ctx.fillStyle='#fff';circ(ex,ey,er*(o.bigEye||1));ctx.fill();ctx.strokeStyle=INK;ctx.lineWidth=1.5;ctx.stroke();
 const wob=o.googly?Math.sin(T*9)*er*0.35:0;
 if(o.dizzy){ctx.strokeStyle=INK;ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(ex-er*0.6,ey-er*0.6);ctx.lineTo(ex+er*0.6,ey+er*0.6);ctx.moveTo(ex+er*0.6,ey-er*0.6);ctx.lineTo(ex-er*0.6,ey+er*0.6);ctx.stroke();}
 else{ctx.fillStyle=INK;circ(ex+er*0.3+wob,ey+er*0.1,er*0.55);ctx.fill();ctx.fillStyle='#fff';circ(ex+er*0.45+wob,ey-er*0.15,er*0.18);ctx.fill();}
 if(o.brow){ctx.strokeStyle=INK;ctx.lineWidth=1.8;ctx.beginPath();ctx.moveTo(ex-er,ey-er*1.5);ctx.lineTo(ex+er,ey-er*1.1);ctx.stroke();}
 // mouth on keel
 const mx=ex+8,my=ey+9;ctx.strokeStyle=INK;ctx.lineWidth=1.8;ctx.lineCap='round';ctx.beginPath();
 if(o.dizzy){ctx.arc(mx,my+3,3,Math.PI*1.1,Math.PI*1.9);}else ctx.arc(mx,my-2,4,0.1*Math.PI,0.9*Math.PI);ctx.stroke();
 if(o.tongue){ctx.fillStyle='#ff6f8f';circ(mx+1,my+3,2.4);ctx.fill();}
 ctx.fillStyle='rgba(255,110,140,.6)';circ(ex-6,ey+6,2.4);ctx.fill();
}

// ================= layout =================
const V={scale:1,w:1,h:1,top:0,bot:1,bandH:1,camFrac:0.22,cb:80};
function layoutWorld(){
 const refW=clamp(560+(W/H-0.45)*240,560,760);const s=clamp(Math.min(H/600,W/refW),0.3,5);
 V.scale=s;V.w=W/s;V.h=H/s;
 V.cb=Math.min(84*UI,H*0.19,W*0.21); // control button diameter (px)
 const m=10*UI;
 V.top=(SAFE.t+m+56*UI)/s+34;
 V.bot=(H-SAFE.b)/s-74;
 V.bandH=Math.max(150,V.bot-V.top);
 // keep the plane clear of the left thumb buttons
 V.camFrac=clamp((SAFE.l+V.cb+m*3+50*s)/W,0.22,0.42);
}
const wy=ny=>V.top+ny*V.bandH;
function resize(){
 W=Math.max(1,Math.round(window.innerWidth));H=Math.max(1,Math.round(window.innerHeight));
 DPR=Math.min(window.devicePixelRatio||1,2.5);
 const maxPx=3.2e6; if(W*H*DPR*DPR>maxPx)DPR=Math.max(1,Math.sqrt(maxPx/(W*H)));
 cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cv.style.width=W+'px';cv.style.height=H+'px';
 const cs=getComputedStyle(safeEl);
 SAFE={t:parseFloat(cs.paddingTop)||0,r:parseFloat(cs.paddingRight)||0,b:parseFloat(cs.paddingBottom)||0,l:parseFloat(cs.paddingLeft)||0};
 UI=clamp(Math.min(W,H)/420,0.8,1.7);
 layoutWorld();
}

function waveLayer(baseY,amp,per,f,cam,seed,col,bottom){

const hillY=(X,baseY,amp,per,seed)=>baseY+amp*(Math.sin(X/per+seed)*0.6+Math.sin(X/(per*0.37)+seed*1.7)*0.4);

function palm(x,y,s){ctx.strokeStyle='#a0703e';ctx.lineWidth=9*s;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x,y);ctx.quadraticCurveTo(x+10*s,y-50*s,x+4*s,y-95*s);ctx.stroke();

 ctx.fillStyle='#7a4a2a';circ(x+2*s,y-90*s,5*s);ctx.fill();circ(x+9*s,y-88*s,5*s);ctx.fill();}
function cloudLayer(cam,f,step,yMin,yMax,sz,alpha,seed){

 for(let k=Math.floor(off/step)-1;k<=Math.floor((off+V.w)/step)+1;k++){
  if(hash(k*3.1+seed)<0.35)continue;const x=k*step-off+hash(k+seed)*step*0.4,y=yMin+hash(k*7.7+seed)*(yMax-yMin);
  cloud(x,y,sz*(0.7+hash(k*1.3+seed)*0.6));}
 ctx.globalAlpha=1;}

 let v;if(a===90)v=-e.gamma;else if(a===270||a===-90)v=e.gamma;else if(a===180)v=-e.beta;else v=e.beta;
 tilt.raw=v;if(tilt.neutral==null)tilt.neutral=v;tilt.v=clamp(v-tilt.neutral,-45,45);}

  if(held('up')||keys.up)u-=1;if(held('down')||keys.down)u+=1;

   case 'gust':if(p.x>o.x&&p.x<o.x+o.w&&Math.abs(p.ny-o.ny)<o.h/2){inGust=true;if(!o.hit){o.hit=1;Snd.whoosh();}}break;

   default:{ // obstacles
    if(o.hitT!=null){const k=R.t-o.hitT;o.x+=o.kvx*dt;o.cy+=o.kvy*dt/V.bandH;break;}
    if(o.t==='bird'){if(going)o.x-=55*dt;o.cy=o.ny+Math.sin(R.t*2+o.ph)*0.04;}
    else if(o.t==='kite')o.cy=o.ny+Math.sin(R.t*1.3+o.ph)*0.03;
    else o.cy=o.ny+Math.sin(R.t*0.8+o.ph)*0.06;
    if(going&&!p.fin&&p.inv<=0&&p.loop<=0&&Math.hypot(p.x+8-o.x,py-wy(o.cy))<46)bonk(o);
   }}
 }
 p.gust=inGust;
 p.ny+=p.vny*dt;if(p.ny<0){p.ny=0;p.vny=Math.max(0,p.vny);}if(p.ny>1){p.ny=1;p.vny=Math.min(0,p.vny);}
 p.ang=lerp(p.ang,clamp(p.vny*0.45,-0.5,0.5),Math.min(1,dt*8));
 p.spin=Math.max(0,p.spin-dt*1.4);p.loop=Math.max(0,p.loop-dt);
 if(going){
  p.boost=Math.max(0,p.boost-dt);p.bonk=Math.max(0,p.bonk-dt);p.inv=Math.max(0,p.inv-dt);p.loopCd=Math.max(0,p.loopCd-dt);
  let mul=sh.speed*(1+(p.boost>0?0.45:0)+(inGust?0.4*sh.lift:0));if(p.bonk>0)mul*=0.45;if(p.fin)mul=0.9;
  p.spd=lerp(p.spd,BASE*mul,Math.min(1,dt*3));p.x+=p.spd*dt-p.bounce*dt;p.bounce=Math.max(0,p.bounce-900*dt);

 }
 // ---- rivals
 for(const r of R.rivals){

 }
 // ---- bird sidekick
 const b=R.bird,lp=loopOffset(p);b.x=lerp(b.x,p.x-75+lp.x*0.3,Math.min(1,dt*4));b.y=lerp(b.y,py-70+Math.sin(R.t*3)*8,Math.min(1,dt*4));b.say=Math.max(0,b.say-dt);
 // ---- camera
 const tc=p.x-V.w*V.camFrac;R.cam=R.count>0?tc:lerp(R.cam,tc,Math.min(1,dt*5));
 // ---- finish
 if(!p.fin){R.place=1+R.rivals.filter(r=>r.x>p.x).length;
  if(p.x>=R.L){p.fin=true;p.finT=R.t;R.place=1+R.rivals.filter(r=>r.fin).length;award();Snd.cheer();confetti(80,0,W,0);birdSay(2);}}
 else if(R.t-p.finT>2.4){scene='finish';sceneT=0;ptrs.clear();Music.play(4);confetti(120,0,W,0);if(R.reward.newStickers.length)setTimeout(()=>Snd.sticker(),900);}
}
function loopOffset(p){if(p.loop<=0)return{x:0,y:0,a:0};const a=(1-p.loop/0.85)*TAU;return{x:Math.sin(a)*48,y:-(1-Math.cos(a))*48,a:-a};}
function award(){
 const w=R.w,place=R.place,bonus=[5,3,2,1][place-1];
 const earned=Math.max(3,R.p.stars+bonus),before=save.total;
 save.total+=earned;save.races++;if(place===1)save.wins=(save.wins||0)+1;
 const prev=save.stickers,target=Math.min(STICKERS.length,save.races+Math.floor(save.total/25));

 const newStickers=[];for(let i=prev;i<save.stickers;i++)newStickers.push(i);
 const newColors=[];COLORS.forEach((c,i)=>{if(c.need&&c.need>before&&c.need<=save.total)newColors.push(i);});
 const newWorld=WORLDS.findIndex(x=>x.needRaces&&x.needRaces===save.races);
 save.best[w]=Math.min(save.best[w]||9,place);persist();
 R.reward={earned,place,bonus,collected:R.p.stars,newStickers,newColors,newWorld,order:null};

 R.reward.order=order;
}

function update(dt){
 T+=dt;sceneT+=dt;
 if(scene==='race'&&R)raceUpdate(dt);
 updParts(wparts,dt);updParts(sparts,dt);
 if(scene==='finish'&&sceneT<3&&Math.random()<dt*10)confetti(4,0,W,-10);
 for(const k in bookWiggle){bookWiggle[k]=Math.max(0,bookWiggle[k]-dt*1.5);}
}

 else if(scene==='finish'&&R)drawFinish();

 else drawMenu();
}
let last=performance.now(),fpsAcc=0,fpsN=0,fps=60,errors=0;
function frame(now){
 requestAnimationFrame(frame);
 let dt=(now-last)/1000;last=now;if(!(dt>0))dt=0;if(dt>0.1)dt=0.1;
 fpsAcc+=dt;fpsN++;if(fpsAcc>=1){fps=fpsN/fpsAcc;fpsAcc=0;fpsN=0;}
 if(window.innerWidth!==W||window.innerHeight!==H)resize();
 try{let rem=dt*TS;while(rem>1e-6){const s=Math.min(rem,1/50);update(s);rem-=s;}
  Music.update();draw();}catch(e){errors++;if(errors<5)console.error(e);}
}
