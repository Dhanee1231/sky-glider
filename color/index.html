#opBody{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;align-items:stretch}
#opPics{flex:1;min-height:0;display:flex;gap:8px;align-items:center;justify-content:center}
#opPics canvas{display:block;max-width:100%;max-height:100%;border-radius:22px;border:4px solid #fff;background:#fff1ee;box-shadow:0 5px 0 rgba(120,0,90,.35)}
#opPics .cw{flex:1 1 0;min-width:0;min-height:0;height:100%;display:grid;place-items:center;position:relative}
#opPics .mg{flex:none;width:34px;height:34px;color:#ffc400;animation:bob 2s ease-in-out infinite}#opPics .mg svg{width:100%;height:100%}
#opBusy{position:absolute;right:8px;top:8px;width:34px;height:34px;color:#d6339f;display:none;animation:spin 1.1s linear infinite}#opBusy svg{width:100%;height:100%}#opBusy.on{display:block}
@keyframes spin{to{transform:rotate(360deg)}}
html.fz-calm #opBusy,html.fz-calm #opPics .mg{animation:none}
#opSide{flex:none;display:flex;flex-direction:column;gap:8px;align-items:stretch;min-height:0}
#opMore{background:rgba(255,255,255,.7);border:4px solid #fff;border-radius:24px;padding:8px;display:flex;flex-direction:column;gap:6px;overflow:auto;min-height:0}
.opRow{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:nowrap}
.opRow .rb{width:var(--bb);height:var(--bb)}
.opRow .tg2{position:relative}
#opDiff{flex:none;width:100%;flex-wrap:wrap;align-items:stretch;align-content:center}
#opDiff.mosaic .dfb{flex-basis:70px;min-width:70px}
.dfb{position:relative;flex:1 1 96px;min-width:96px;min-height:48px;max-width:148px;height:auto;border-radius:16px;border:3px solid #fff;background:linear-gradient(150deg,#ff8fd0,#d6339f);padding:4px 4px 5px;color:#fff;font-weight:900;font-size:11px;line-height:1.05;text-shadow:0 1px 0 rgba(90,0,70,.5);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;box-shadow:0 3px 0 rgba(120,0,90,.5);overflow:visible;white-space:normal;text-align:center}
.dfb svg.dv{width:22px;height:22px;display:block;flex:none}
.dfb.k4{background:linear-gradient(150deg,#c48bff,#7d4bd8)}
.dfb.on{outline:none;border-color:#ffe27a;box-shadow:inset 0 0 0 2px #ffe27a,0 3px 0 rgba(120,0,90,.5)}
.dfb .gm{display:flex;flex-wrap:wrap;justify-content:center;max-width:100%}.dfb .gm svg{width:11px;height:11px;flex:none}
.dfb .nm{display:block;width:100%;max-width:100%;white-space:normal;overflow-wrap:break-word;word-break:normal;text-align:center}
.dial{display:flex;align-items:center;gap:6px;justify-content:center;flex:1;min-width:0}
.dial b{min-width:40px;text-align:center;color:#8a1270;font-size:clamp(18px,4vmin,26px)}
#palDots{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;max-width:150px}#palDots i{width:14px;height:14px;border-radius:50%;border:2px solid #fff;display:block}
.opBtn{width:46px;height:46px}
#opBar{flex:none;display:flex;gap:12px;align-items:center;justify-content:center}
.mk{flex:1;max-width:340px;min-height:calc(var(--bb)*1.45);border-radius:99px;border:4px solid #fff;background:linear-gradient(150deg,#ffe27a,#ff8fcf 55%,#d6339f);color:#fff;font-weight:900;font-size:clamp(22px,5.4vmin,34px);text-shadow:0 2px 0 rgba(90,0,70,.55);display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 6px 0 rgba(120,0,90,.5)}
.mk svg{width:1.3em;height:1.3em}.mk:active{transform:scale(.96)}
@media (orientation:landscape){#opBody{flex-direction:row}#opSide{width:min(46vw,380px);justify-content:center}#opPics{height:100%}}
#mkBody{flex:1;min-height:0;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3vmin}
#mkGem{width:min(36vmin,200px);aspect-ratio:1;color:#d6339f;animation:spin 2.4s linear infinite;filter:drop-shadow(0 6px 8px rgba(120,0,90,.3))}#mkGem svg{width:100%;height:100%}
#mkSp{position:relative;display:flex;gap:14px;color:#ffc400}#mkSp svg{width:34px;height:34px;animation:bob 1.2s ease-in-out infinite}#mkSp svg:nth-child(2){animation-delay:.2s}#mkSp svg:nth-child(3){animation-delay:.4s}
html.fz-calm #mkGem,html.fz-calm #mkSp svg{animation-duration:6s}
#mkBar{width:min(70vw,360px);height:20px;border-radius:12px;background:rgba(255,255,255,.55);border:3px solid #fff;overflow:hidden}#mkBar i{display:block;height:100%;width:6%;border-radius:9px;background:linear-gradient(90deg,#ffe27a,#ff8fcf);transition:width .25s}
#mkBar i{position:relative;overflow:hidden;min-width:22px}#mkBar i::before{content:"";position:absolute;top:0;bottom:0;left:0;width:200%;background:repeating-linear-gradient(115deg,transparent 0 14px,rgba(255,255,255,.6) 14px 18px,transparent 18px 30px);animation:mkGl 1.1s linear infinite}
#mkBar i b{position:absolute;right:2px;top:50%;width:16px;height:16px;color:#fff;transform:translateY(-50%);animation:mkTw .9s ease-in-out infinite;filter:drop-shadow(0 0 3px #ff5fa2)}#mkBar i b svg{width:100%;height:100%;display:block}
@keyframes mkGl{from{transform:translateX(-33.1px)}to{transform:translateX(0)}}@keyframes mkTw{0%,100%{transform:translateY(-50%) scale(.8) rotate(0)}50%{transform:translateY(-50%) scale(1.15) rotate(20deg)}}
html.fz-calm #mkBar i::before,html.fz-calm #mkBar i b{animation-duration:4s}@media (prefers-reduced-motion:reduce){#mkBar i::before,#mkBar i b{animation:none}}
#sc-err .card{margin:auto}
#errMsg{font-size:clamp(18px,4vmin,26px);display:flex;align-items:center;gap:8px;flex-direction:column}
#errIc{width:90px;height:90px;color:#ffc400}#errIc svg{width:100%;height:100%}
.hs2{display:flex;align-items:center;gap:8px;min-height:52px}
.hs2 img{width:44px;height:44px;border-radius:8px;object-fit:cover;border:2px solid #fff;background:#fff1ee}
.hs2 span{flex:1;font-size:15px}
.rb.sm{width:48px;height:48px;flex:none}.rb.warn{background:linear-gradient(145deg,#ff9a7a,#d6332f)}
#toast{position:absolute;left:50%;top:70px;transform:translateX(-50%);z-index:30;background:rgba(255,255,255,.95);color:#d6339f;border-radius:99px;padding:6px 16px;font-weight:900;display:none;align-items:center;gap:8px;border:3px solid #ffd34d}#toast.on{display:flex}#toast svg{width:24px;height:24px}
</style></head><body>
